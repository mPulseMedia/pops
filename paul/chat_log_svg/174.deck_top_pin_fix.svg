<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" rx="12" fill="#2a2a2a"/>
  <text x="300" y="28" text-anchor="middle" font-family="monospace" font-size="13" fill="#e0e0e0" font-weight="700">chat_174: deck_top_pin_fix</text>

  <!-- Before: top shifted up -->
  <rect x="30" y="50" width="160" height="180" rx="6" fill="#1e2433" stroke="#c96b6b" stroke-width="1"/>
  <text x="110" y="68" text-anchor="middle" font-family="monospace" font-size="9" fill="#c96b6b" font-weight="600">BUG</text>
  <rect x="45" y="78" width="130" height="80" rx="3" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="52" y="80" width="116" height="70" rx="3" fill="#335" stroke="#668" stroke-width="1"/>
  <text x="110" y="100" text-anchor="middle" font-family="monospace" font-size="7" fill="#f88">top moved up!</text>
  <line x1="48" y1="80" x2="48" y2="92" stroke="#f88" stroke-width="1"/>
  <text x="48" y="77" text-anchor="middle" font-family="monospace" font-size="6" fill="#f88">^</text>
  <text x="110" y="180" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">r.top + TAB only</text>

  <!-- After: top pinned -->
  <rect x="220" y="50" width="160" height="180" rx="6" fill="#1e332e" stroke="#6bc96b" stroke-width="1"/>
  <text x="300" y="68" text-anchor="middle" font-family="monospace" font-size="9" fill="#6bc96b" font-weight="600">FIX</text>
  <rect x="235" y="78" width="130" height="80" rx="3" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="240" y="90" width="120" height="68" rx="3" fill="#253" stroke="#6bc96b" stroke-width="1"/>
  <text x="300" y="110" text-anchor="middle" font-family="monospace" font-size="7" fill="#6f6">top pinned to 0.9 ref</text>
  <text x="300" y="145" text-anchor="middle" font-family="monospace" font-size="7" fill="#6f6">grows down + sides</text>
  <text x="300" y="180" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">refContentH = H * 0.9</text>

  <!-- Three modes -->
  <rect x="410" y="50" width="160" height="180" rx="6" fill="#1e2433" stroke="#556" stroke-width="1"/>
  <text x="490" y="68" text-anchor="middle" font-family="monospace" font-size="9" fill="#8ac" font-weight="600">THREE MODES</text>
  <rect x="425" y="82" width="130" height="38" rx="4" fill="#335"/>
  <text x="490" y="97" text-anchor="middle" font-family="monospace" font-size="8" fill="#adf">project</text>
  <text x="490" y="110" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">grid overview</text>
  <rect x="425" y="126" width="130" height="38" rx="4" fill="#335"/>
  <text x="490" y="141" text-anchor="middle" font-family="monospace" font-size="8" fill="#adf">deck</text>
  <text x="490" y="154" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">stacked cards</text>
  <rect x="425" y="170" width="130" height="38" rx="4" fill="#335"/>
  <text x="490" y="185" text-anchor="middle" font-family="monospace" font-size="8" fill="#adf">expanded</text>
  <text x="490" y="198" text-anchor="middle" font-family="monospace" font-size="7" fill="#888">fanned out</text>

  <text x="300" y="280" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">card0Y = r.top + (r.height - refContentH)/2 + TAB_OFFSET*scale</text>
</svg>