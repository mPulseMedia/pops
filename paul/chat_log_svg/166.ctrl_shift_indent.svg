<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" style="background:#fff">
  <style>
    text { font-family: monospace; font-size: 12px; fill: #222; }
    .title { font-size: 14px; font-weight: bold; }
    .key { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 6; }
    .action { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; rx: 6; }
    .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>
  <text x="210" y="22" text-anchor="middle" class="title">chat_166: ctrl_shift_indent</text>
  <text x="210" y="40" text-anchor="middle" font-size="11" fill="#666">Ctrl+Shift+Arrow left/right = indent/outdent</text>

  <rect x="20" y="56" width="170" height="36" class="key"/>
  <text x="105" y="79" text-anchor="middle">Ctrl+Shift+Left</text>
  <line x1="192" y1="74" x2="228" y2="74" class="arrow"/>
  <rect x="230" y="56" width="170" height="36" class="action"/>
  <text x="315" y="79" text-anchor="middle">outdent (level -1)</text>

  <rect x="20" y="104" width="170" height="36" class="key"/>
  <text x="105" y="127" text-anchor="middle">Ctrl+Shift+Right</text>
  <line x1="192" y1="122" x2="228" y2="122" class="arrow"/>
  <rect x="230" y="104" width="170" height="36" class="action"/>
  <text x="315" y="127" text-anchor="middle">indent (level +1)</text>

  <text x="210" y="164" text-anchor="middle" font-size="10" fill="#888">Same as Shift+Tab / Tab, reuses item_indent</text>
</svg>
