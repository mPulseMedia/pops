<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" style="background: white;">
  <style>
    text { font-family: monospace; font-size: 10px; }
    .heading { font-size: 13px; font-weight: bold; }
    .sub { font-size: 11px; font-weight: bold; }
    .add { fill: #28a745; }
    .rule { fill: #0366d6; }
    .label { fill: #666; font-size: 9px; }
  </style>

  <text x="280" y="20" text-anchor="middle" class="heading">139. Spatial Persistence A+B+C</text>

  <!-- A: Spec -->
  <rect x="10" y="38" width="170" height="150" rx="6" fill="#e8f4fd" stroke="#0366d6" stroke-width="1.5"/>
  <text x="95" y="56" text-anchor="middle" class="sub rule">A. Spec</text>
  <text x="20" y="72" font-size="9" class="rule">spec_06_spatial_persistence.txt</text>
  <text x="20" y="88" font-size="9">Sections A-I:</text>
  <text x="20" y="102" font-size="8">- Spatial properties</text>
  <text x="20" y="114" font-size="8">- Transition rules</text>
  <text x="20" y="126" font-size="8">- Beyond the horizon</text>
  <text x="20" y="138" font-size="8">- Per-view states</text>
  <text x="20" y="150" font-size="8">- Contract &amp; registry</text>
  <text x="20" y="162" font-size="8">- History (20+ entries)</text>
  <text x="20" y="178" font-size="8" class="label">Documents the principle</text>

  <!-- B: Validation -->
  <rect x="195" y="38" width="170" height="150" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="280" y="56" text-anchor="middle" class="sub add">B. Validation</text>
  <text x="205" y="72" font-size="9" class="add">spatial_contract_validate</text>
  <text x="205" y="88" font-size="9">Checks:</text>
  <text x="205" y="102" font-size="8">- from/to states exist</text>
  <text x="205" y="114" font-size="8">- lengths match rects</text>
  <text x="205" y="126" font-size="8">- from.length == to.length</text>
  <text x="205" y="142" font-size="9">Wired into:</text>
  <text x="205" y="156" font-size="8">- All 3 transition functions</text>
  <text x="205" y="168" font-size="8">- view_rect_animate</text>
  <text x="205" y="178" font-size="8" class="label">Warns on mismatch</text>

  <!-- C: Registry -->
  <rect x="380" y="38" width="170" height="150" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="465" y="56" text-anchor="middle" class="sub" fill="#856404">C. Registry</text>
  <text x="390" y="72" font-size="9" fill="#856404">spatial_registry{}</text>
  <text x="390" y="88" font-size="9">Tracks per card-rect:</text>
  <text x="390" y="102" font-size="8">{x, y, scaleX, scaleY, opacity}</text>
  <text x="390" y="120" font-size="9">Updated by:</text>
  <text x="390" y="134" font-size="8">- view_framework_show</text>
  <text x="390" y="146" font-size="8">- view_rect_animate (finish)</text>
  <text x="390" y="162" font-size="9">Read by:</text>
  <text x="390" y="176" font-size="8">- spatial_registry_get</text>

  <!-- Flow diagram -->
  <text x="280" y="210" text-anchor="middle" class="sub">Transition Flow</text>

  <rect x="30" y="225" width="120" height="30" rx="4" fill="#e8f4fd" stroke="#0366d6"/>
  <text x="90" y="244" text-anchor="middle" font-size="9">compute from-state</text>

  <line x1="150" y1="240" x2="180" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="180" y="225" width="90" height="30" rx="4" fill="#d4edda" stroke="#28a745"/>
  <text x="225" y="244" text-anchor="middle" font-size="9">validate</text>

  <line x1="270" y1="240" x2="300" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="300" y="220" width="100" height="40" rx="4" fill="#f0f0f0" stroke="#888"/>
  <text x="350" y="238" text-anchor="middle" font-size="9">z-index instant</text>
  <text x="350" y="250" text-anchor="middle" font-size="9">pos/scale anim</text>

  <line x1="400" y1="240" x2="430" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="430" y="225" width="110" height="30" rx="4" fill="#fff3cd" stroke="#ffc107"/>
  <text x="485" y="244" text-anchor="middle" font-size="9">update registry</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#333"/>
    </marker>
  </defs>

  <!-- Codenames added -->
  <rect x="30" y="280" width="500" height="55" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="40" y="298" font-size="9" font-weight="bold">New codenames (4):</text>
  <text x="40" y="312" font-size="9" class="add">spatial_registry, spatial_registry_update, spatial_registry_get, spatial_contract_validate</text>
  <text x="40" y="326" font-size="9">Total: 107 codenames</text>

  <!-- Compatibility note -->
  <rect x="30" y="350" width="500" height="55" rx="4" fill="#e8f4fd" stroke="#0366d6"/>
  <text x="40" y="368" font-size="9" font-weight="bold" class="rule">Why all three are compatible:</text>
  <text x="40" y="382" font-size="9">A = documentation (spec file, no code changes)</text>
  <text x="40" y="396" font-size="9">B = validation (additive console.warn, no behavior change)</text>
  <text x="300" y="382" font-size="9">C = data structure (registry tracks state,</text>
  <text x="300" y="396" font-size="9">   wired into existing apply/animate paths)</text>
</svg>
