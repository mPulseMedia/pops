<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320">
  <rect width="520" height="320" fill="#fff" rx="6"/>
  <text x="260" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#222">chat_170: SVG Text Size Rule Update</text>

  <!-- Before box -->
  <rect x="20" y="44" width="220" height="120" rx="5" fill="#fee" stroke="#c55" stroke-width="1.5"/>
  <text x="130" y="60" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#c55">BEFORE (F.5 only)</text>
  <text x="32" y="78" font-family="monospace" font-size="9" fill="#633">"Make text 33% smaller</text>
  <text x="32" y="90" font-family="monospace" font-size="9" fill="#633"> than you think"</text>
  <rect x="40" y="102" width="90" height="22" rx="3" fill="#fcc" stroke="#a33"/>
  <text x="85" y="117" text-anchor="middle" font-family="monospace" font-size="11" fill="#900">Too Big Label</text>
  <line x1="132" y1="113" x2="155" y2="113" stroke="#c55" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="158" y="116" font-family="monospace" font-size="8" fill="#c55">overflows!</text>
  <text x="32" y="150" font-family="monospace" font-size="8" fill="#966">Single vague hint; no</text>
  <text x="32" y="160" font-family="monospace" font-size="8" fill="#966">concrete px sizes</text>

  <!-- Arrow -->
  <polygon points="254,104 270,95 270,100 296,100 296,108 270,108 270,113" fill="#888"/>

  <!-- After box -->
  <rect x="280" y="44" width="220" height="200" rx="5" fill="#efe" stroke="#5a5" stroke-width="1.5"/>
  <text x="390" y="60" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#5a5">AFTER (new F.6 a-e)</text>

  <text x="292" y="78" font-family="monospace" font-size="8" fill="#353">a. 10-11px max in boxes</text>
  <text x="292" y="92" font-family="monospace" font-size="8" fill="#353">b. ~7px/char math check</text>
  <text x="292" y="106" font-family="monospace" font-size="8" fill="#353">c. 80% box-width limit</text>
  <text x="292" y="120" font-family="monospace" font-size="8" fill="#353">d. 13px max for titles</text>
  <text x="292" y="134" font-family="monospace" font-size="8" fill="#353">e. Assume 50% larger</text>

  <rect x="300" y="148" width="100" height="22" rx="3" fill="#cfc" stroke="#3a3"/>
  <text x="350" y="163" text-anchor="middle" font-family="monospace" font-size="9" fill="#060">Fits nicely</text>
  <text x="404" y="163" font-family="monospace" font-size="8" fill="#5a5">ok</text>

  <text x="292" y="192" font-family="monospace" font-size="8" fill="#696">Concrete px limits +</text>
  <text x="292" y="202" font-family="monospace" font-size="8" fill="#696">measurement formula +</text>
  <text x="292" y="212" font-family="monospace" font-size="8" fill="#696">mental-test heuristic</text>
  <text x="292" y="228" font-family="monospace" font-size="8" fill="#696">Renumbered F.7, F.8</text>

  <!-- File label -->
  <rect x="20" y="272" width="480" height="34" rx="4" fill="#eef" stroke="#88b"/>
  <text x="260" y="293" text-anchor="middle" font-family="monospace" font-size="9" fill="#446">.cursor/prompt.mdc  F.6 (new) | F.7, F.8 (renumbered)</text>
