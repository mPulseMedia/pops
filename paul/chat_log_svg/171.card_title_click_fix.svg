<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <rect width="600" height="340" rx="12" fill="#2a2a2a"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-family="monospace" font-size="13" fill="#e0e0e0" font-weight="700">chat_171: card_title_click_fix</text>

  <!-- Before: click_target_resolve -->
  <rect x="30" y="50" width="250" height="120" rx="6" fill="#3d2020" stroke="#c96b6b" stroke-width="1"/>
  <text x="155" y="68" text-anchor="middle" font-family="monospace" font-size="9" fill="#c96b6b" font-weight="600">BEFORE (bug)</text>
  <text x="42" y="86" font-family="monospace" font-size="8" fill="#ddd">click_target_resolve checks:</text>
  <text x="48" y="100" font-family="monospace" font-size="8" fill="#aaa">.card-text-item</text>
  <text x="48" y="112" font-family="monospace" font-size="8" fill="#aaa">.card-text-row</text>
  <text x="48" y="128" font-family="monospace" font-size="8" fill="#f88">title → falls to card-body</text>
  <text x="48" y="142" font-family="monospace" font-size="8" fill="#f88">→ promotes card + animates</text>
  <text x="48" y="156" font-family="monospace" font-size="8" fill="#f88">→ dblclick misses moved card</text>

  <!-- After: fix -->
  <rect x="320" y="50" width="250" height="120" rx="6" fill="#203d20" stroke="#6bc96b" stroke-width="1"/>
  <text x="445" y="68" text-anchor="middle" font-family="monospace" font-size="9" fill="#6bc96b" font-weight="600">AFTER (fix)</text>
  <text x="332" y="86" font-family="monospace" font-size="8" fill="#ddd">click_target_resolve checks:</text>
  <text x="338" y="100" font-family="monospace" font-size="8" fill="#aaa">.card-text-item</text>
  <text x="338" y="112" font-family="monospace" font-size="8" fill="#aaa">.card-text-row</text>
  <text x="338" y="124" font-family="monospace" font-size="8" fill="#6f6">.card-text-title  ← added</text>
  <text x="338" y="140" font-family="monospace" font-size="8" fill="#6f6">title → card-content</text>
  <text x="338" y="152" font-family="monospace" font-size="8" fill="#6f6">→ no promote in deck view</text>
  <text x="338" y="164" font-family="monospace" font-size="8" fill="#6f6">→ dblclick fires correctly</text>

  <!-- Arrow -->
  <line x1="285" y1="110" x2="315" y2="110" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4" fill="#888"/></marker></defs>

  <!-- Event flow diagram -->
  <rect x="30" y="190" width="540" height="130" rx="6" fill="#1e2433" stroke="#556" stroke-width="1"/>
  <text x="300" y="208" text-anchor="middle" font-family="monospace" font-size="9" fill="#8ac" font-weight="600">Double-click event flow</text>

  <rect x="50" y="220" width="90" height="30" rx="4" fill="#335"/>
  <text x="95" y="239" text-anchor="middle" font-family="monospace" font-size="8" fill="#adf">1st click</text>

  <rect x="170" y="220" width="110" height="30" rx="4" fill="#335"/>
  <text x="225" y="239" text-anchor="middle" font-family="monospace" font-size="8" fill="#adf">click_dispatch</text>

  <rect x="310" y="220" width="110" height="30" rx="4" fill="#253"/>
  <text x="365" y="239" text-anchor="middle" font-family="monospace" font-size="8" fill="#adf">card-content</text>

  <rect x="450" y="220" width="100" height="30" rx="4" fill="#253"/>
  <text x="500" y="239" text-anchor="middle" font-family="monospace" font-size="8" fill="#6f6">no-op (deck)</text>

  <line x1="140" y1="235" x2="168" y2="235" stroke="#668" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="280" y1="235" x2="308" y2="235" stroke="#668" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="420" y1="235" x2="448" y2="235" stroke="#668" stroke-width="1.5" marker-end="url(#arr2)"/>
  <defs><marker id="arr2" markerWidth="5" markerHeight="4" refX="4" refY="2" orient="auto"><path d="M0,0 L5,2 L0,4" fill="#668"/></marker></defs>

  <rect x="50" y="270" width="90" height="30" rx="4" fill="#335"/>
  <text x="95" y="289" text-anchor="middle" font-family="monospace" font-size="8" fill="#adf">2nd click</text>

  <rect x="170" y="270" width="110" height="30" rx="4" fill="#335"/>
  <text x="225" y="289" text-anchor="middle" font-family="monospace" font-size="8" fill="#adf">dblclick fires</text>

  <rect x="310" y="270" width="110" height="30" rx="4" fill="#253"/>
  <text x="365" y="289" text-anchor="middle" font-family="monospace" font-size="8" fill="#6f6">title editable</text>

  <line x1="140" y1="285" x2="168" y2="285" stroke="#668" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="280" y1="285" x2="308" y2="285" stroke="#668" stroke-width="1.5" marker-end="url(#arr2)"/>
</svg>