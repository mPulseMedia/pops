<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" style="background:#fff">
  <style>
    text { font-family: monospace; font-size: 12px; fill: #222; }
    .title { font-size: 14px; font-weight: bold; }
    .box { fill: #fff; stroke: #333; stroke-width: 1.5; rx: 6; }
    .rule { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; rx: 6; }
    .file { fill: #fff8e1; stroke: #f57f17; stroke-width: 1.5; rx: 6; }
    .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .dashed { stroke-dasharray: 5,4; }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>
  <text x="240" y="24" text-anchor="middle" class="title">chat_158: current_html_rule</text>
  <text x="240" y="42" text-anchor="middle" font-size="11" fill="#666">Every prompt: create SVG then update viewer</text>

  <!-- Step 1: Create SVG -->
  <rect x="30" y="60" width="180" height="50" class="file"/>
  <text x="120" y="82" text-anchor="middle" font-weight="bold">N.label.svg</text>
  <text x="120" y="98" text-anchor="middle" font-size="10">Step 1: create diagram</text>

  <!-- Step 2: Update current.html -->
  <rect x="270" y="60" width="180" height="50" class="file"/>
  <text x="360" y="82" text-anchor="middle" font-weight="bold">current.html</text>
  <text x="360" y="98" text-anchor="middle" font-size="10">Step 2: append to svgFiles[]</text>

  <!-- Arrow 1->2 -->
  <line x1="210" y1="85" x2="268" y2="85" class="arrow"/>

  <!-- Rule box: prompt.mdc -->
  <rect x="90" y="140" width="300" height="44" class="rule"/>
  <text x="240" y="160" text-anchor="middle" font-weight="bold">prompt.mdc  C.9 (new rule)</text>
  <text x="240" y="176" text-anchor="middle" font-size="10" fill="#1565c0">"After creating SVG, append to svgFiles in current.html"</text>

  <!-- Rule box: MEMORY.md -->
  <rect x="90" y="200" width="300" height="44" class="rule"/>
  <text x="240" y="220" text-anchor="middle" font-weight="bold">MEMORY.md  C.9 (new rule)</text>
  <text x="240" y="236" text-anchor="middle" font-size="10" fill="#1565c0">Mirrors prompt.mdc for Claude Code sessions</text>

  <text x="240" y="268" text-anchor="middle" font-size="10" fill="#888">Blue = rule added | Yellow = files touched each prompt</text>
</svg>
