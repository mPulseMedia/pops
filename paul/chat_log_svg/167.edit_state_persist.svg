<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" style="background:#fff">
  <style>
    text { font-family: monospace; font-size: 12px; fill: #222; }
    .title { font-size: 14px; font-weight: bold; }
    .bug { fill: #fce4ec; stroke: #c62828; stroke-width: 1.5; rx: 6; }
    .fix { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
    .step { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1; rx: 4; }
    .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>
  <text x="230" y="22" text-anchor="middle" class="title">chat_167: edit_state_persist</text>
  <text x="230" y="40" text-anchor="middle" font-size="11" fill="#666">Race: edit_state_clear vs async selectionchange</text>

  <!-- Timeline -->
  <text x="230" y="62" text-anchor="middle" font-size="11" font-weight="bold">Reload #1</text>
  <rect x="20" y="70" width="420" height="2" fill="#999"/>
  <rect x="30" y="76" width="90" height="22" class="step"/>
  <text x="75" y="91" text-anchor="middle" font-size="9">restore + focus</text>
  <rect x="130" y="76" width="80" height="22" class="bug"/>
  <text x="170" y="91" text-anchor="middle" font-size="9" fill="#c62828">clear() sync</text>
  <rect x="280" y="76" width="100" height="22" class="step"/>
  <text x="330" y="91" text-anchor="middle" font-size="9">selectionchange</text>
  <text x="330" y="104" text-anchor="middle" font-size="9" fill="#1565c0">re-saves (async)</text>

  <text x="230" y="126" text-anchor="middle" font-size="11" font-weight="bold">Reload #2 (fast)</text>
  <rect x="20" y="134" width="420" height="2" fill="#999"/>
  <rect x="30" y="140" width="100" height="22" class="bug"/>
  <text x="80" y="155" text-anchor="middle" font-size="9" fill="#c62828">beforeunload</text>
  <text x="80" y="167" text-anchor="middle" font-size="9" fill="#c62828">state already cleared!</text>

  <!-- Fix -->
  <rect x="60" y="180" width="340" height="30" class="fix"/>
  <text x="230" y="200" text-anchor="middle" font-weight="bold" fill="#2e7d32">Fix: removed edit_state_clear() after restore</text>
</svg>
