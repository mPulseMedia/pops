<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" style="background: white;">
  <style>
    text { font-family: monospace; font-size: 10px; }
    .heading { font-size: 13px; font-weight: bold; }
    .add { fill: #28a745; }
  </style>
  <text x="200" y="20" text-anchor="middle" class="heading">141. Current HTML Viewer</text>
  <rect x="20" y="40" width="360" height="140" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="200" y="60" text-anchor="middle" font-size="11" font-weight="bold" class="add">paul/chat_log_svg/current.html</text>
  <text x="30" y="82" font-size="9">Displays current.svg in browser</text>
  <text x="30" y="98" font-size="9">Auto-reloads every 4 seconds</text>
  <text x="30" y="114" font-size="9">Toggle switch: [Reload on/off]</text>
  <text x="30" y="130" font-size="9">Styled like app's reload_switch</text>
  <text x="30" y="150" font-size="9">User keeps one browser tab open to see</text>
  <text x="30" y="162" font-size="9">latest diagram as chat progresses</text>
</svg>
