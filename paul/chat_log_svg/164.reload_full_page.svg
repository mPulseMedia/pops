<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" style="background:#fff">
  <style>
    text { font-family: monospace; font-size: 12px; fill: #222; }
    .title { font-size: 14px; font-weight: bold; }
    .old { fill: #fce4ec; stroke: #c62828; stroke-width: 1.5; rx: 6; }
    .new { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
  </style>
  <text x="200" y="22" text-anchor="middle" class="title">chat_164: reload_full_page</text>

  <rect x="20" y="44" width="170" height="50" class="old"/>
  <text x="105" y="64" text-anchor="middle" font-weight="bold">Before</text>
  <text x="105" y="80" text-anchor="middle" font-size="10">setInterval img.src swap</text>
  <text x="105" y="92" text-anchor="middle" font-size="10" fill="#c62828">file:// ignores cache-bust</text>

  <rect x="210" y="44" width="170" height="50" class="new"/>
  <text x="295" y="64" text-anchor="middle" font-weight="bold">After</text>
  <text x="295" y="80" text-anchor="middle" font-size="10">location.reload() every 5s</text>
  <text x="295" y="92" text-anchor="middle" font-size="10" fill="#2e7d32">full page reload from disk</text>

  <rect x="60" y="110" width="280" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="200" y="130" text-anchor="middle" font-size="11" fill="#1565c0">Toggle state saved in localStorage</text>
  <text x="200" y="146" text-anchor="middle" font-size="11" fill="#1565c0">so on/off survives the reload cycle</text>
</svg>
