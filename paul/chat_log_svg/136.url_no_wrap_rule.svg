<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 180">
  <style>
    text { font-family: monospace; font-size: 11px; }
    .del { fill: #c44; }
    .add { fill: #28a745; }
  </style>

  <text x="230" y="20" text-anchor="middle" font-size="13" font-weight="bold">136. URL No-Wrap Rule</text>

  <!-- BEFORE -->
  <text x="115" y="48" text-anchor="middle" font-size="11" font-weight="bold">BEFORE</text>
  <rect x="10" y="56" width="210" height="70" rx="4" fill="#fdd" stroke="#c44"/>
  <text x="20" y="74" font-size="9" class="del">b.  file:///Users/.../pops/</text>
  <text x="20" y="88" font-size="9" class="del">    paul/chat_log_svg/</text>
  <text x="20" y="102" font-size="9" class="del">    133.tab_gap_fix.svg</text>
  <text x="20" y="118" font-size="8" class="del">URL broken across 3 lines (not clickable)</text>

  <!-- Arrow -->
  <text x="233" y="95" font-size="20">→</text>

  <!-- AFTER -->
  <text x="345" y="48" text-anchor="middle" font-size="11" font-weight="bold">AFTER</text>
  <rect x="250" y="56" width="200" height="70" rx="4" fill="#d4edda" stroke="#28a745"/>
  <text x="260" y="74" font-size="9" class="add">b.  file:///Users/.../pops/paul/</text>
  <text x="260" y="88" font-size="9" class="add">    chat_log_svg/133.tab_gap_fix.svg</text>
  <text x="260" y="108" font-size="8" class="add">Full URL on one line (clickable)</text>

  <!-- Rule box -->
  <rect x="60" y="140" width="340" height="30" rx="4" fill="#fff3cd" stroke="#ffc107"/>
  <text x="70" y="160" font-size="9">outline.mdc 6.C: never break a URL across lines</text>
</svg>
