        function readCssNumber(varName) {
          const raw = getComputedStyle(document.documentElement).getPropertyValue(varName);
          const value = Number.parseFloat(raw);
          return Number.isFinite(value) ? value : 0;
        }

        function updateDeckScales() {
          const baseWidth = readCssNumber("--card-base-width") || 1200;
          const baseHeight = (readCssNumber("--stack-base-height") || 755) + readCssNumber("--tab-height");
          const gap = readCssNumber("--expanded-gap") || 0;
          const expandedLift = readCssNumber("--expanded-lift") || 0;
          const topRowLift = readCssNumber("--expanded-top-row-lift") || 0;
          const bottomRowLift = readCssNumber("--expanded-bottom-row-lift") || 0;
          const buffer = readCssNumber("--expanded-buffer") || 0;
          document.documentElement.style.setProperty("--deck-content-width", `${baseWidth}px`);
          document.documentElement.style.setProperty("--deck-content-height", `${baseHeight}px`);

          decks.forEach((deck) => {
            const isMini = document.body.classList.contains("mini-mode") || document.body.classList.contains("cards-mini");
            let rect;
            if (isMini) {
              const vw = document.documentElement.clientWidth || window.innerWidth;
              const viewportWidth = vw >= 1024 ? vw / 3 : vw;
              const viewportHeight = viewportWidth * (baseHeight / baseWidth);
              rect = { width: viewportWidth, height: viewportHeight, left: 0, top: 0 };
            } else {
              const el = deck;
              rect = el.getBoundingClientRect();
            }
            if (rect.width === 0 || rect.height === 0) {
              return;
            }
            const scale = Math.min(rect.width / baseWidth, rect.height / baseHeight);
            deck.style.setProperty("--deck-scale", `${scale}`);
            const widthScale = (rect.width - gap * 2) / (baseWidth * 3);
            const heightAvailable = rect.height - gap - topRowLift + bottomRowLift - buffer;
            const heightScale = heightAvailable / (baseHeight * 2);
            const expandedScale = Math.min(widthScale, heightScale);
            deck.style.setProperty("--expanded-scale", `${expandedScale}`);
            const stepX = baseWidth * expandedScale + gap;
            const stepY = baseHeight * expandedScale + gap;
            const totalW = baseWidth * expandedScale * 3 + gap * 2;
            const offsetX = Math.max((rect.width - totalW) / 2, 0);
            const offsetY = deck.classList.contains("is-expanded") ? -expandedLift : 0;
            deck.style.setProperty("--expanded-step-x", `${stepX}px`);
            deck.style.setProperty("--expanded-step-y", `${stepY}px`);
            deck.style.setProperty("--expanded-offset-x", `${offsetX}px`);
            deck.style.setProperty("--expanded-offset-y", `${offsetY}px`);
          });
        }

        /* Order = [leftmost, …, rightmost]. Default: yellow leftmost, green rightmost (3 cards). */
        const orderMap = {
          yellow: ["yellow", "red", "green"],
          red: ["red", "yellow", "green"],
          green: ["green", "red", "yellow"],
        };

        function promote(color, deckOverride) {
          const deck = deckOverride || getActiveDeck();
          const order = orderMap[color];
          if (order) {
            setOrder(order, deck);
            localStorage.setItem(selectionKeyFor(deck.dataset.deck), color);
          }
        }

        function setActiveDeck(id) {
          decks.forEach((deck) => {
            deck.classList.toggle("is-active", deck.dataset.deck === id);
          });
          localStorage.setItem(ACTIVE_KEY, id);
          updateDeckScales();
        }

        function setExpanded(isExpanded, animate = false) {
          const active = getActiveDeck();
          if (!active) return;
          localStorage.setItem(EXPANDED_KEY, isExpanded ? "1" : "0");
          const finish = () => document.body.classList.remove("expand-animating", "expand-collapsing");

          if (!animate) {
            // Immediate toggle: just switch classes and redraw the framework
            // in the new view (expanded or deck).
            decks.forEach((deck) => deck.classList.remove("is-expanded"));
            if (isExpanded) active.classList.add("is-expanded");
            document.body.classList.toggle("deck-expanded", isExpanded);
            finish();
            requestAnimationFrame(function () {
              const view = isExpanded ? "expanded" : "deck";
              showCardRectFramework(getStatesForAllDecks(view));
            });
            return;
          }

          if (isExpanded) {
            // EXPAND: show overlay first so the real deck never flashes its row layout.
            // Then animate overlay from deck layout to expanded (center + left/right) layout.
            const fromStates = getStatesForAllDecks("deck");
            lastDeckModeStates = fromStates;
            setCardRectActiveDeckIndex(decks.indexOf(active));
            decks.forEach((deck) => deck.classList.remove("is-expanded"));
            showCardRectFramework(fromStates);
            document.body.classList.add("expand-animating");
            document.body.classList.add("deck-expanded");
            active.classList.add("is-expanded");
            requestAnimationFrame(function () {
              const toStates = getStatesForAllDecks("expanded");
              animateCardRects(fromStates, toStates, 520, finish);
            });
          } else {
            // COLLAPSE: animate from expanded layout back to deck (stacked).
            // Show overlay in expanded positions first so we never flash the real
            // deck’s layout (which would show three cards in a row).
            const fromStates = getStatesForAllDecks("expanded");
            showCardRectFramework(fromStates);
            document.body.classList.add("expand-collapsing");
            decks.forEach((deck) => deck.classList.remove("is-expanded"));
            document.body.classList.remove("deck-expanded");
            requestAnimationFrame(function () {
              const toStates = getStatesForAllDecksForCollapse();
              animateCardRects(fromStates, toStates, 520, function () {
                finish();
              });
            });
          }
        }

        /* ---------- Deck proxy: independent DOM representation for transitions ---------- */
        const PROXY_CONTENT_WIDTH = 1200;
        const PROXY_CONTENT_HEIGHT = 755;

        function getDeckProxy() {
          return document.getElementById("deckProxy");
        }

        function buildDeckProxy(deck) {
          const proxy = getDeckProxy();
          if (!proxy) return;
          const viewport = deck.querySelector(".deck-viewport");
          if (!viewport) return;
          proxy.innerHTML = "";
          proxy.appendChild(viewport.cloneNode(true));
        }

        function clearDeckProxy() {
          const proxy = getDeckProxy();
          if (!proxy) return;
          proxy.classList.remove("is-active");
          proxy.innerHTML = "";
          proxy.style.transform = "";
        }

        function runProxyTransition(fromRect, toRect, durationMs, onDone) {
          const proxy = getDeckProxy();
          if (!proxy) {
            if (onDone) onDone();
            return;
          }
          const scaleX = (v) => v / PROXY_CONTENT_WIDTH;
          const scaleY = (v) => v / PROXY_CONTENT_HEIGHT;
          proxy.style.transform =
            "translate(" + fromRect.left + "px," + fromRect.top + "px) scale(" + scaleX(fromRect.width) + "," + scaleY(fromRect.height) + ")";
          proxy.classList.add("is-active");
          const anim = proxy.animate(
            [
              {
                transform: "translate(" + fromRect.left + "px," + fromRect.top + "px) scale(" + scaleX(fromRect.width) + "," + scaleY(fromRect.height) + ")",
              },
              {
                transform: "translate(" + toRect.left + "px," + toRect.top + "px) scale(" + scaleX(toRect.width) + "," + scaleY(toRect.height) + ")",
              },
            ],
            { duration: durationMs, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "both" }
          );
          anim.onfinish = () => {
            proxy.classList.remove("is-active");
            proxy.innerHTML = "";
            proxy.style.transform = "";
            document.body.classList.remove("deck-proxy-animating");
            if (onDone) onDone();
          };
          anim.oncancel = () => {
            proxy.classList.remove("is-active");
            proxy.innerHTML = "";
            proxy.style.transform = "";
            document.body.classList.remove("deck-proxy-animating");
            if (onDone) onDone();
          };
        }

        /* ---------- Card rect framework: position, scale, transparency per card ---------- */
        const CARD_RECT_WIDTH = 1200;
        const CARD_RECT_HEIGHT = 755;
        const CARD_RECT_INDICES = [0, 1, 2];

        function cardRectState(x, y, scaleX, scaleY, opacity) {
          return { x: x, y: y, scaleX: scaleX, scaleY: scaleY, opacity: opacity != null ? opacity : 1 };
        }

        function getCardRectOverlay() {
          return document.getElementById("cardRectOverlay");
        }

        function buildCardRectOverlay() {
          const overlay = getCardRectOverlay();
          if (!overlay) return;
          overlay.innerHTML = "";
          const deckList = Array.from(document.querySelectorAll(".deck"));
          deckList.forEach(function (deck, deckIndex) {
            CARD_RECT_INDICES.forEach(function (cardIndex) {
              const rect = document.createElement("div");
              rect.className = "card-rect";
              rect.setAttribute("data-deck-index", String(deckIndex));
              rect.setAttribute("data-index", String(cardIndex));
              // For now, host a single fully functional card inside the
              // card-rect framework: the "top" card of the first deck.
              // Its own internal layout remains, but its position, scale
              // and opacity come entirely from the card-rect transform.
              if (deckIndex === 0 && cardIndex === 0) {
                const yellowLayer = deck && deck.querySelector('.card-layer[data-color="yellow"]');
                if (yellowLayer) {
                  const host = yellowLayer.cloneNode(true);
                  host.classList.add("card-layer--overlay");
                  rect.appendChild(host);
                  // Ensure this hosted card gets the same line-number and
                  // rows treatment as real deck cards, so its title/text
                  // sit at the same vertical positions and line numbers
                  // appear as expected.
                  applyLineNumbersInRoot(host);
                  // Also wire up text, tab, and title editing on this
                  // overlay card so the cursor/caret position, active
                  // edit state, and saved content behave exactly like
                  // they do in the underlying deck cards. The editing
                  // setup functions are idempotent and will only bind
                  // to elements that don't already have handlers.
                  setupCardTextEditing();
                  setupCardTabAndTitleEditing();
                }
              }
              overlay.appendChild(rect);
            });
          });
        }

        function getCardRects() {
          const overlay = getCardRectOverlay();
          if (!overlay) return [];
          return Array.from(overlay.querySelectorAll(".card-rect"));
        }

        function getStatesFromDeckRects(deck) {
          const layers = deck ? deck.querySelectorAll(".card-layer") : [];
          return CARD_RECT_INDICES.map(function (i) {
            const layer = Array.from(layers).find(function (l) { return ["yellow", "red", "green"][i] === l.dataset.color; });
            if (!layer) return cardRectState(0, 0, 0, 0, 0);
            const r = layer.getBoundingClientRect();
            return cardRectState(r.left, r.top, r.width / CARD_RECT_WIDTH, r.height / CARD_RECT_HEIGHT, 1);
          });
        }

        /** Stacked positions from viewport only (no layer rects). Use when the real deck is mid-transition (e.g. collapse). */
        function getStackedStatesFromViewport(deck) {
          const vp = deck && deck.querySelector(".deck-viewport");
          if (!vp) return CARD_RECT_INDICES.map(() => cardRectState(0, 0, 0, 0, 0));
          const r = vp.getBoundingClientRect();
          const scale = Math.min(r.width / STACK_BOUNDS_WIDTH, r.height / STACK_BOUNDS_HEIGHT);
          const stackW = STACK_BOUNDS_WIDTH * scale;
          const stackH = STACK_BOUNDS_HEIGHT * scale;
          const card0X = r.left + (r.width - stackW) / 2;
          const card0Y = r.top + (r.height - stackH) / 2 + 34 * scale;
          return CARD_RECT_INDICES.map(function (i) {
            const o = STACK_OFFSETS[i];
            return cardRectState(card0X + o.x * scale, card0Y + o.y * scale, scale, scale, 1);
          });
        }

        function getStackedLayoutStates() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const centerX = w / 2;
          const centerY = h / 2;
          const margin = 48;
          const scale = Math.min((w - 2 * margin) / CARD_RECT_WIDTH, (h - 2 * margin) / CARD_RECT_HEIGHT);
          const x = centerX - (CARD_RECT_WIDTH * scale) / 2;
          const y = centerY - (CARD_RECT_HEIGHT * scale) / 2;
          const s = cardRectState(x, y, scale, scale, 1);
          return [s, s, s];
        }

        function getExpandedLayoutStates() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const margin = 24;
          const gap = 16;
          const marginAboveHorizon = 16;
          const marginBelowHorizon = 16;
          // Keep expanded cards below the deck title bar: use a dynamic
          // buffer based on the pageTitle position instead of a fixed
          // margin from the top of the viewport.
          let safeTop = margin;
          if (typeof pageTitle !== "undefined" && pageTitle) {
            const titleRect = pageTitle.getBoundingClientRect();
            // Buffer between the bottom of the title and the top of the
            // expanded cards.
            safeTop = Math.max(margin, titleRect.bottom + 16);
          }
          const horizonY = h / 2;
          const topAvailableH = horizonY - safeTop - marginAboveHorizon;
          const bottomAvailableH = h - horizonY - marginBelowHorizon - marginAboveHorizon;
          const availableW = w - 2 * margin;
          const scaleFromTop = Math.min(availableW / CARD_RECT_WIDTH, topAvailableH / CARD_RECT_HEIGHT);
          const scaleFromBottom = Math.min((availableW - gap) / (2 * CARD_RECT_WIDTH), bottomAvailableH / CARD_RECT_HEIGHT);
          const scale = Math.min(scaleFromTop, scaleFromBottom);
          const cardW = CARD_RECT_WIDTH * scale;
          const cardH = CARD_RECT_HEIGHT * scale;
          const card0X = margin + (availableW - cardW) / 2;
          const card0Y = safeTop + (topAvailableH - cardH) / 2;
          const bottomRowWidth = cardW * 2 + gap;
          const card1X = margin + (availableW - bottomRowWidth) / 2;
          const card2X = card1X + cardW + gap;
          const cardsBottomY = horizonY + marginAboveHorizon;
          const card1Y = cardsBottomY + (bottomAvailableH - cardH) / 2;
          const card0 = cardRectState(card0X, card0Y, scale, scale, 1);
          const card1 = cardRectState(card1X, card1Y, scale, scale, 1);
          const card2 = cardRectState(card2X, card1Y, scale, scale, 1);
          return [card0, card1, card2];
        }

        /* Stack offsets in card pixels (match layerLayouts: yellow 0,0; red 36,-17; green 72,-34) */
        const STACK_OFFSETS = [
          { x: 0, y: 0 },
          { x: 36, y: -17 },
          { x: 72, y: -34 },
        ];
        const STACK_BOUNDS_WIDTH = 72 + CARD_RECT_WIDTH;
        const STACK_BOUNDS_HEIGHT = 34 + CARD_RECT_HEIGHT;

        function getStatesForDeck(deck, view) {
          if (view === "mini") {
            const vp = deck && deck.querySelector(".deck-viewport");
            if (!vp) return CARD_RECT_INDICES.map(() => cardRectState(0, 0, 0, 0, 0));
            const r = vp.getBoundingClientRect();
            const scale = Math.min(r.width / STACK_BOUNDS_WIDTH, r.height / STACK_BOUNDS_HEIGHT);
            const stackW = STACK_BOUNDS_WIDTH * scale;
            const stackH = STACK_BOUNDS_HEIGHT * scale;
            const card0X = r.left + (r.width - stackW) / 2;
            const card0Y = r.top + (r.height - stackH) / 2 + 34 * scale;
            return CARD_RECT_INDICES.map(function (i) {
              const o = STACK_OFFSETS[i];
              return cardRectState(card0X + o.x * scale, card0Y + o.y * scale, scale, scale, 1);
            });
          }
          if (view === "deck") return getStatesFromDeckRects(deck);
          if (view === "expanded") return getExpandedLayoutStates();
          return CARD_RECT_INDICES.map(() => cardRectState(0, 0, 0, 0, 0));
        }

        let lastStackedStates = null;
        let lastMiniStatesByDeckIndex = [];
        // Full flattened card-rect states for all decks in deck mode,
        // captured right before expanding so we can collapse back to
        // that exact physical configuration (positions/scale/opacity).
        let lastDeckModeStates = null;

        function getStatesForAllDecks(view) {
          const active = getActiveDeck();
          const flat = [];
          decks.forEach(function (deck, deckIndex) {
            const isActive = deck === active;
            if (view === "mini") {
              const miniStates = getStatesForDeck(deck, "mini");
              lastMiniStatesByDeckIndex[deckIndex] = miniStates;
              flat.push.apply(flat, miniStates);
            } else if (view === "deck") {
              if (isActive) {
                const stacked = getStatesFromDeckRects(deck);
                lastStackedStates = stacked;
                flat.push.apply(flat, stacked);
              } else {
                const center = getViewportCenter();
                flat.push.apply(flat, getRecedeStatesForDeck(center));
              }
            } else if (view === "expanded") {
              if (isActive) flat.push.apply(flat, getStatesForDeck(deck, "expanded"));
              else {
                const center = getViewportCenter();
                flat.push.apply(flat, getRecedeStatesForDeck(center));
              }
            } else {
              flat.push.apply(flat, lastMiniStatesByDeckIndex[deckIndex] || getStatesForDeck(deck, "mini"));
            }
          });
          return flat;
        }

        /** Deck-mode states for collapse: use viewport-based stacked positions so we don't read layer rects mid-transition. */
        function getStatesForAllDecksForCollapse() {
          const active = getActiveDeck();
          const center = getViewportCenter();
          const flat = [];
          decks.forEach(function (deck) {
            if (deck === active) {
              flat.push.apply(flat, getStackedStatesFromViewport(deck));
            } else {
              flat.push.apply(flat, getRecedeStatesForDeck(center));
            }
          });
          return flat;
        }

        function getViewportCenter() {
          return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        }

        function getRecedeStatesForDeck(center) {
          const recedeState = cardRectState(center.x, center.y, 0, 0, 0);
          return [recedeState, recedeState, recedeState];
        }

        function getStatesForAllDecksMiniToDeck() {
          const active = getActiveDeck();
          const center = getViewportCenter();
          const flat = [];
          decks.forEach(function (deck) {
            if (deck === active) {
              const stacked = getStatesFromDeckRects(deck);
              lastStackedStates = stacked;
              flat.push.apply(flat, stacked);
            } else {
              flat.push.apply(flat, getRecedeStatesForDeck(center));
            }
          });
          return flat;
        }

        // Current visual states while in deck mode (stacked or expanded):
        // - Active deck: real deck or expanded layout
        // - Other decks: receded to center (shrunken)
        function getStatesForAllDecksCurrentInDeckMode() {
          const active = getActiveDeck();
          const center = getViewportCenter();
          const flat = [];
          const isExpanded = document.body.classList.contains("deck-expanded");
          decks.forEach(function (deck) {
            if (deck === active) {
              const view = isExpanded ? "expanded" : "deck";
              flat.push.apply(flat, getStatesForDeck(deck, view));
            } else {
              flat.push.apply(flat, getRecedeStatesForDeck(center));
            }
          });
          return flat;
        }

        function getFrontCardIndexForDeck(deck) {
          if (!deck) return 0;
          const saved = localStorage.getItem(selectionKeyFor(deck.dataset.deck));
          const order = orderMap[saved] || orderMap.yellow;
          const colorToIndex = { yellow: 0, red: 1, green: 2 };
          return colorToIndex[order[0]] || 0;
        }

        function setCardRectActiveDeckIndex(activeDeckIndex, frontCardIndex) {
          const overlay = getCardRectOverlay();
          if (!overlay) return;
          overlay.dataset.activeDeckIndex = String(activeDeckIndex);
          const rects = getCardRects();
          const deck = decks[activeDeckIndex];
          const front = (frontCardIndex != null) ? frontCardIndex : getFrontCardIndexForDeck(deck);
          rects.forEach(function (rect) {
            const di = rect.getAttribute("data-deck-index");
            const cardIndex = parseInt(rect.getAttribute("data-index"), 10);
            if (di !== String(activeDeckIndex)) {
              rect.style.zIndex = 1;
            } else {
              rect.style.zIndex = (cardIndex === front) ? 3 : (cardIndex === (front + 1) % 3 ? 2 : 1);
            }
          });
        }

        function setMiniStackOrder(activeDeckIndexForLayer) {
          const rects = getCardRects();
          const colorToIndex = { yellow: 0, red: 1, green: 2 };
          const n = decks.length;
          const activeBase = (activeDeckIndexForLayer != null) ? n * 3 + 1 : -1;
          decks.forEach(function (deck, deckIndex) {
            const saved = localStorage.getItem(selectionKeyFor(deck.dataset.deck));
            const order = orderMap[saved] || orderMap.yellow;
            const frontIndex = colorToIndex[order[0]];
            const secondIndex = colorToIndex[order[1]];
            const backIndex = colorToIndex[order[2]];
            const base = deckIndex * 3;
            const isActiveDeck = (deckIndex === activeDeckIndexForLayer);
            const deckZBase = isActiveDeck ? activeBase : (n - 1 - deckIndex) * 3 + 1;
            if (rects[base + backIndex]) rects[base + backIndex].style.zIndex = deckZBase + 1;
            if (rects[base + secondIndex]) rects[base + secondIndex].style.zIndex = deckZBase + 2;
            if (rects[base + frontIndex]) rects[base + frontIndex].style.zIndex = deckZBase + 3;
          });
        }

        function getStatesForView(view) {
          const active = getActiveDeck();
          if (view === "deck" && document.body.classList.contains("deck-expanded")) {
            return lastStackedStates || getStatesFromDeckRects(active);
          }
          if (view === "deck") {
            const states = getStatesFromDeckRects(active);
            lastStackedStates = states;
            return states;
          }
          return getStatesForDeck(active, view);
        }

        function applyCardRectState(el, state) {
          if (!el || !state) return;
          el.style.transform = "translate(" + state.x + "px," + state.y + "px) scale(" + state.scaleX + "," + state.scaleY + ")";
          el.style.opacity = String(state.opacity != null ? state.opacity : 1);
        }

        function applyCardRectStates(states) {
          const rects = getCardRects();
          states.forEach(function (s, i) {
            if (rects[i]) applyCardRectState(rects[i], s);
          });
        }

        function animateCardRects(fromStates, toStates, durationMs, onDone) {
          const overlay = getCardRectOverlay();
          const rects = getCardRects();
          if (!overlay || rects.length === 0 || fromStates.length !== rects.length || toStates.length !== rects.length) {
            if (onDone) onDone();
            return;
          }
          const duration = durationMs || 520;
          // Smooth, fast-out-slow-in easing: quick start, gentle settling.
          const easing = "cubic-bezier(0.215, 0.61, 0.355, 1)";
          const anims = rects.map(function (rect, i) {
            const from = fromStates[i];
            const to = toStates[i];
            return rect.animate(
              [
                {
                  transform: "translate(" + from.x + "px," + from.y + "px) scale(" + from.scaleX + "," + from.scaleY + ")",
                  opacity: from.opacity != null ? from.opacity : 1,
                },
                {
                  transform: "translate(" + to.x + "px," + to.y + "px) scale(" + to.scaleX + "," + to.scaleY + ")",
                  opacity: to.opacity != null ? to.opacity : 1,
                },
              ],
              { duration: duration, easing: easing, fill: "both" }
            );
          });
          Promise.all(anims.map(function (a) { return new Promise(function (res) { a.onfinish = res; }); })).then(function () {
            if (onDone) onDone();
          });
        }

        function showCardRectFramework(states) {
          const rects = getCardRects();
          if (!states || states.length !== rects.length) return;
          const overlay = getCardRectOverlay();
          if (!overlay) return;
          applyCardRectStates(states);
          overlay.classList.add("is-active");
          document.body.classList.add("card-rect-framework");
        }

        function hideCardRectFramework() {
          const overlay = getCardRectOverlay();
          if (overlay) overlay.classList.remove("is-active");
          document.body.classList.remove("card-rect-framework");
        }

        (function setupCardRectClicks() {
          const overlay = getCardRectOverlay();
          if (!overlay) return;
          overlay.addEventListener("click", function (e) {
            if (!document.body.classList.contains("deck-mode")) return;
            const rect = e.target.closest(".card-rect[data-deck-index]");
            if (!rect) return;
            const active = getActiveDeck();
            if (!active || rect.getAttribute("data-deck-index") !== String(decks.indexOf(active))) return;
            e.preventDefault();
            e.stopPropagation();
            const idx = parseInt(rect.getAttribute("data-index"), 10);
            const color = ["yellow", "red", "green"][idx];
            if (color) {
              // In expanded deck mode: set the clicked card as front first, then collapse.
              // That way we never "set" card positions to the wrong order; the collapse
              // animation uses the correct target (clicked card in front).
              if (document.body.classList.contains("deck-expanded")) {
                promote(color, active);
                const activeIndex = decks.indexOf(active);
                if (activeIndex >= 0) setCardRectActiveDeckIndex(activeIndex, idx);
                setExpanded(false, true);
              } else {
                // In plain deck mode (not expanded), clicking a card-rect
                // just promotes that card within the active deck.
                promote(color, active);
                setCardRectActiveDeckIndex(decks.indexOf(active), idx);
                // Refresh deck-mode states so the overlay matches the
                // updated stack layout after promotion.
                const states = getStatesForAllDecks("deck");
                showCardRectFramework(states);
              }
            }
          });
        })();

        function applyMode(mode, options) {
          options = options || {};
          document.body.classList.toggle("mini-mode", mode === "mini");
          document.body.classList.toggle("deck-mode", mode === "deck");
          document.body.classList.toggle("cards-mini", mode === "mini");
          if (mode !== "deck") document.body.classList.remove("deck-expanded");
          pageTitle.textContent = mode === "mini" ? "All Projects" : getActiveDeck().dataset.title;
          document.title = pageTitle.textContent;
          updateDeckScales();
          requestAnimationFrame(updateAllTabOffsets);
          if (mode === "deck") {
            clearDeckProxy();
            window.scrollTo(0, 0);
            setExpanded(localStorage.getItem(EXPANDED_KEY) === "1", false);
          }
          if (!options.skipCardRectUpdate) {
            requestAnimationFrame(function () {
              const view = mode === "mini" ? "mini" : (document.body.classList.contains("deck-expanded") ? "expanded" : "deck");
              const states = getStatesForAllDecks(view);
              showCardRectFramework(states);
              if (mode === "mini") {
                setMiniStackOrder(options.activeDeckIndexForLayer);
              } else if (mode === "deck" || document.body.classList.contains("deck-expanded")) {
                const active = getActiveDeck();
                if (active) setCardRectActiveDeckIndex(decks.indexOf(active));
              }
            });
          }
        }

        function setMode(mode) {
          if (mode === "deck") lastMiniScroll = window.scrollY;
          localStorage.setItem(MODE_KEY, mode);
          if (mode === "mini") {
            if (document.body.classList.contains("deck-mode")) {
              const active = getActiveDeck();
              if (active) {
                const titleFromRect = pageTitle.getBoundingClientRect();
                const fromStates = getStatesForAllDecksCurrentInDeckMode();
                applyMode("mini", { activeDeckIndexForLayer: decks.indexOf(active) });
                requestAnimationFrame(function () {
                  const titleToRect = pageTitle.getBoundingClientRect();
                  runTitleFlip(titleFromRect, titleToRect);
                  const toStates = getStatesForAllDecks("mini");
                  showCardRectFramework(fromStates);
                  // Return to All Projects with the same smooth, fast-out-slow-in
                  // easing as other card transitions.
                  animateCardRects(fromStates, toStates, 520);
                });
              } else applyMode("mini");
            } else applyMode("mini");
          } else {
            if (document.body.classList.contains("mini-mode")) {
              const active = getActiveDeck();
              if (active) {
                const titleFromRect = pageTitle.getBoundingClientRect();
                const fromStates = getStatesForAllDecks("mini");
                applyMode("deck", { skipCardRectUpdate: true });
                requestAnimationFrame(function () {
                  const titleToRect = pageTitle.getBoundingClientRect();
                  runTitleFlip(titleFromRect, titleToRect);
                  const toStates = getStatesForAllDecksMiniToDeck();
                  setCardRectActiveDeckIndex(decks.indexOf(active));
                  showCardRectFramework(fromStates);
                  animateCardRects(fromStates, toStates, 520);
                });
              } else applyMode("deck");
            } else applyMode("deck");
          }
          if (mode !== "deck") setExpanded(false, false);
          if (mode === "deck") window.scrollTo(0, 0);
          else requestAnimationFrame(() => window.scrollTo(0, lastMiniScroll));
        }

        const colorToIndex = { yellow: YELLOW_CARD_INDEX, red: RED_CARD_INDEX, green: GREEN_CARD_INDEX };

        function getFrontCardData() {
          const active = getActiveDeck();
          if (!active) return null;
          const deckId = active.dataset.deck;
          const deckData = decksData.find((d) => d.id === deckId);
          if (!deckData || !deckData.cards) return null;
          const saved = localStorage.getItem(selectionKeyFor(deckId));
          const order = orderMap[saved] || orderMap.yellow;
          const frontIndex = colorToIndex[order[0]];
          if (frontIndex === undefined) return null;
          return deckData.cards[frontIndex] || null;
        }

        function runFlipAnimation(active, startRect, endRect) {
          const dx = startRect.left - endRect.left;
          const dy = startRect.top - endRect.top;
          const scaleX = startRect.width / endRect.width;
          const scaleY = startRect.height / endRect.height;
          if (active._flipAnimation) {
            active._flipAnimation.cancel();
          }
          active.classList.add("is-animating");
          active.style.transformOrigin = "top left";
          const animation = active.animate(
            [
              { transform: `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})` },
              { transform: "translate(0px, 0px) scale(1, 1)" },
            ],
            { duration: 520, easing: "ease", fill: "both" }
          );
          active._flipAnimation = animation;
          animation.onfinish = () => {
            active.classList.remove("is-animating");
            active.style.transformOrigin = "";
            active._flipAnimation = null;
          };
          animation.oncancel = () => {
            active.classList.remove("is-animating");
            active.style.transformOrigin = "";
            active._flipAnimation = null;
          };
        }

        function runTitleFlip(startRect, endRect) {
          if (!pageTitle || !startRect || !endRect) return;
          const dx = startRect.left - endRect.left;
          const dy = startRect.top - endRect.top;
          const scaleX = startRect.width / endRect.width;
          const scaleY = startRect.height / endRect.height;
          const animation = pageTitle.animate(
            [
              { transform: `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})` },
              { transform: "translate(0px, 0px) scale(1, 1)" },
            ],
            { duration: 520, easing: "ease", fill: "both" }
          );
          animation.onfinish = () => {
            pageTitle.style.transform = "";
          };
          animation.oncancel = () => {
            pageTitle.style.transform = "";
          };
        }

        function runDeckInit() {
          decks.forEach((deck) => {
            const deckTitle = deck.querySelector(".deck-title");
          if (deckTitle) {
            deckTitle.addEventListener("click", (event) => {
              if (document.body.classList.contains("deck-mode")) {
                event.stopPropagation();
                setMode("mini");
                return;
              }
              event.stopPropagation();
              setActiveDeck(deck.dataset.deck);
              setMode("deck");
            });
          }
          deck.querySelectorAll(".card-text-image").forEach((img) => {
            img.addEventListener("click", (event) => {
              if (document.body.classList.contains("mini-mode")) {
                return;
              }
              event.stopPropagation();
              openImageLightbox(img.src, img.alt);
            });
          });
          deck.querySelectorAll(".card-layer").forEach((layer) => {
            const handleExpandPick = (event) => {
              if (!document.body.classList.contains("deck-mode")) {
                return;
              }
              if (!deck.classList.contains("is-expanded")) {
                return;
              }
              event.stopPropagation();
              const color = layer.dataset.color;
              if (color) {
                setExpanded(false, true);
                setTimeout(() => {
                  promote(color, deck);
                }, 520);
              }
            };
            layer.addEventListener("click", handleExpandPick);
            layer
              .querySelectorAll(".card, .tab")
              .forEach((el) => el.addEventListener("click", handleExpandPick));
          });
          ["yellow", "red", "green"].forEach((color) => {
            deck
              .querySelectorAll(
                `.card-layer[data-color='${color}'] .card, .card-layer[data-color='${color}'] .tab`
              )
              .forEach((el) => {
                el.addEventListener("click", (event) => {
                  if (document.body.classList.contains("mini-mode")) {
                    event.stopPropagation();
                    return;
                  }
                  event.stopPropagation();
                  promote(color, deck);
                });
              });
          });

          /* In All Projects (mini) mode, clicking the viewport (card area) or the deck selects it */
          const viewport = deck.querySelector(".deck-viewport");
          if (viewport) {
            viewport.addEventListener("click", (event) => {
              if (!document.body.classList.contains("mini-mode")) return;
              event.stopPropagation();
              setActiveDeck(deck.dataset.deck);
              setMode("deck");
            });
          }

          deck.addEventListener("click", () => {
            setActiveDeck(deck.dataset.deck);
            setMode("deck");
          });
        });

        pageTitle.addEventListener("click", () => {
          if (document.body.classList.contains("deck-mode")) {
            setMode("mini");
          }
        });

        const exportDeckDataBtn = document.getElementById("exportDeckDataBtn");
        if (exportDeckDataBtn) {
          exportDeckDataBtn.addEventListener("click", exportDeckDataToFile);
        }
        const reloadDeckDataBtn = document.getElementById("reloadDeckDataBtn");
        if (reloadDeckDataBtn) {
          reloadDeckDataBtn.addEventListener("click", reloadDeckDataFromFile);
        }
        const titleRowBackBtn = document.getElementById("titleRowBackBtn");
        if (titleRowBackBtn) {
          titleRowBackBtn.addEventListener("click", () => setMode("mini"));
        }
        const titleRowExpandBtn = document.getElementById("titleRowExpandBtn");
        if (titleRowExpandBtn) {
          titleRowExpandBtn.addEventListener("click", () => {
            const active = getActiveDeck();
            const expanded = active && active.classList.contains("is-expanded");
            setExpanded(!expanded, true);
          });
        }
        const AUTO_RELOAD_KEY = "index-card3-auto-reload";
        const autoReloadSwitch = document.getElementById("autoReloadSwitch");
        const autoReloadStatus = document.getElementById("autoReloadStatus");
        function updateAutoReloadUI() {
          const on = localStorage.getItem(AUTO_RELOAD_KEY) !== "0";
          if (autoReloadSwitch) {
            autoReloadSwitch.setAttribute("aria-checked", on ? "true" : "false");
            autoReloadSwitch.setAttribute("aria-label", "Auto-reload " + (on ? "on" : "off"));
          }
          if (autoReloadStatus) autoReloadStatus.textContent = on ? "on" : "off";
        }
        if (autoReloadSwitch) {
          updateAutoReloadUI();
          autoReloadSwitch.addEventListener("click", () => {
            const on = localStorage.getItem(AUTO_RELOAD_KEY) !== "0";
            localStorage.setItem(AUTO_RELOAD_KEY, on ? "0" : "1");
            updateAutoReloadUI();
          });
        }
        const loadDeckDataFileBtn = document.getElementById("loadDeckDataFileBtn");
        const loadDeckDataFileInput = document.getElementById("loadDeckDataFileInput");
        if (loadDeckDataFileBtn && loadDeckDataFileInput) {
          loadDeckDataFileBtn.addEventListener("click", () => loadDeckDataFileInput.click());
          loadDeckDataFileInput.addEventListener("change", () => {
            const file = loadDeckDataFileInput.files && loadDeckDataFileInput.files[0];
            loadDeckDataFromFileInput(file);
            loadDeckDataFileInput.value = "";
          });
        }

        document.addEventListener("click", (event) => {
          if (event.target.closest(".title-row-back") || event.target.closest(".title-row-expand")) {
            return;
          }
          const rect = pageTitle.getBoundingClientRect();
          const pad = 24;
          const x = event.clientX;
          const y = event.clientY;
          const inside =
            x >= rect.left - pad &&
            x <= rect.right + pad &&
            y >= rect.top - pad &&
            y <= rect.bottom + pad;
          if (inside) {
            if (document.body.classList.contains("deck-mode")) {
              setMode("mini");
            }
          }
        });

        const modeBackdrop = document.getElementById("modeBackdrop");
        if (modeBackdrop) {
          modeBackdrop.addEventListener("click", () => {
            if (document.body.classList.contains("deck-mode")) {
              setMode("mini");
            }
          });
          modeBackdrop.addEventListener("touchend", () => {
            if (document.body.classList.contains("deck-mode")) {
              setMode("mini");
            }
          });
        }

        if (imageLightbox) {
          imageLightbox.addEventListener("click", () => {
            closeImageLightbox();
          });
        }

        const savedActive = localStorage.getItem(ACTIVE_KEY);
        if (savedActive) {
          setActiveDeck(savedActive);
        }

        const savedMode = localStorage.getItem(MODE_KEY) || "mini";
        if (savedMode === "mini") {
          const active = getActiveDeck();
          applyMode(savedMode, active != null ? { activeDeckIndexForLayer: decks.indexOf(active) } : {});
        } else {
          applyMode(savedMode);
        }
        if (savedMode === "mini") {
          requestAnimationFrame(() => {
            window.scrollTo(0, lastMiniScroll);
          });
        } else {
          window.scrollTo(0, 0);
        }

        try {
          const lightboxState = JSON.parse(localStorage.getItem(IMAGE_LIGHTBOX_KEY));
          if (lightboxState && lightboxState.open && lightboxState.src) {
            openImageLightbox(lightboxState.src, lightboxState.alt || "");
          }
        } catch {
          // ignore invalid state
        }

        applyLineNumbers();
        setupCardTextEditing();
        setupCardTabAndTitleEditing();
        /* Save selection when still in edit mode so reload can restore it (no blur) */
        window.addEventListener("pagehide", saveCurrentEditStateIfActive);
        window.addEventListener("beforeunload", saveCurrentEditStateIfActive);
        document.addEventListener("selectionchange", saveCurrentEditStateIfActive);
        updateAllTabOffsets();
        updateDeckScales();
        requestAnimationFrame(() => {
          updateDeckScales();
          updateAllTabOffsets();
        });

        decks.forEach((deck) => {
          const saved = localStorage.getItem(selectionKeyFor(deck.dataset.deck));
          if (saved && orderMap[saved]) {
            setOrder(orderMap[saved], deck);
          } else {
            setOrder(orderMap.yellow, deck);
          }
        });

        let resizeFrame = null;
        window.addEventListener("resize", () => {
          if (resizeFrame) return;
          resizeFrame = requestAnimationFrame(() => {
            resizeFrame = null;
            updateDeckScales();
            updateAllTabOffsets();
          });
        });
        }

        if (window.__SAVED_STATE__) {
          const state = window.__SAVED_STATE__;
          window.__SAVED_STATE__ = null;
          if (state.decks && state.decks.length > 0 && normalizeToDecksData({ decks: state.decks }) != null) {
            loadDecksFromData({ decks: state.decks }, false);
          } else {
            loadDeckData();
          }
        } else {
          loadDeckData();
        }
      })();
    </script>
  </body>
</html>
