            }
            if (view === "deck" || view === "expanded") {
              var active = deck_active_get();
              if (!active || hit.deckIndex !== decks.indexOf(active)) return;
              var color = ["yellow", "red", "green"][hit.cardIndex];
              if (!color) return;
              if (view === "expanded") {
                card_promote(color, active);
                deck_active_index_set(hit.deckIndex);
                var expandedStates = view_state_list_get("expanded");
                view_framework_show(expandedStates);
                requestAnimationFrame(function () {
                  requestAnimationFrame(function () { view_set("deck"); });
                });
              } else {
                var fromStates = view_state_list_get("deck");
                card_promote(color, active);
                deck_active_index_set(hit.deckIndex);
                var toStates = view_state_list_get("deck");
                view_framework_show(fromStates);
                view_rect_animate(fromStates, toStates, 300);
              }
            }
            return;
          }
          if (hit.type === "card-image") {
            if (view !== "project") {
              e.stopPropagation();
              lightbox_open(hit.element.src, hit.element.alt);
            }
            return;
          }
          if (hit.type === "card-content") {
            if (view === "project") {
              var deck = decks[hit.deckIndex];
              if (deck) {
                deck_active_set(deck.dataset.deck);
                view_set("deck");
              }
            } else if (view === "expanded") {
              var active = deck_active_get();
              if (!active || hit.deckIndex !== decks.indexOf(active)) return;
              var color = ["yellow", "red", "green"][hit.cardIndex];
              if (color) {
                card_promote(color, active);
                deck_active_index_set(hit.deckIndex);
              }
              view_set("deck");
            }
            /* deck: do nothing — allow native editing */
            return;
          }
          if (hit.type === "card-body") {
            if (view === "project") {
              var deck = decks[hit.deckIndex];
              if (deck) {
                deck_active_set(deck.dataset.deck);
                view_set("deck");
              }
            } else if (view === "deck" || view === "expanded") {
              var active = deck_active_get();
              if (!active || hit.deckIndex !== decks.indexOf(active)) return;
              var color = ["yellow", "red", "green"][hit.cardIndex];
              if (!color) return;
              if (view === "expanded") {
                card_promote(color, active);
                deck_active_index_set(hit.deckIndex);
                var expandedStates = view_state_list_get("expanded");
                view_framework_show(expandedStates);
                requestAnimationFrame(function () {
                  requestAnimationFrame(function () { view_set("deck"); });
                });
              } else {
                var fromStates = view_state_list_get("deck");
                card_promote(color, active);
                deck_active_index_set(hit.deckIndex);
                var toStates = view_state_list_get("deck");
                view_framework_show(fromStates);
                view_rect_animate(fromStates, toStates, 300);
              }
            }
            return;
          }
        }

        // __click_dispatch
        function click_dispatch(e) {
          /* Skip if click is inside a contenteditable area */
          if (e.target.closest && e.target.closest("[contenteditable='true']")) return;
          /* Skip lightbox clicks */
          if (e.target.closest && e.target.closest(".image-lightbox")) return;
          /* Skip UI controls */
          if (e.target.closest && e.target.closest("#reloadRow, #titleRow")) return;
          var view = click_view_get();
          var hits = document.elementsFromPoint(e.clientX, e.clientY);
          var hit = click_target_resolve(hits, view);
          if (hit) click_route(hit, view, e);
        }
        document.addEventListener("click", click_dispatch);

        function view_apply(view, options) {
          // __view_apply __chat_140 __spatial_title_animate __chat_145 __title_settle_jump_fix
          options = options || {};
          document.body.classList.toggle("project-view", view === "project");
          document.body.classList.toggle("deck-view", view === "deck");
          document.body.classList.toggle("expanded-view", view === "expanded");
          pageTitle.textContent = view === "project" ? "Projects" : deck_title_text_get(deck_active_get()) || "Projects";
          document.title = pageTitle.textContent;
          deck_scale_update();
          requestAnimationFrame(deck_tab_offset_update_all);
          decks.forEach((deck) => deck.classList.remove("is-expanded"));
          if (view === "deck" || view === "expanded") {
            deck_proxy_clear();
            window.scrollTo(0, 0);
            const active = deck_active_get();
            if (active && view === "expanded") active.classList.add("is-expanded");
          }
          if (!options.skipCardRectUpdate) {
            requestAnimationFrame(function () {
              const viewState = view === "project" ? "project" : (view === "expanded" ? "expanded" : "deck");
              const states = view_state_list_get(viewState);
              view_framework_show(states);
              if (view === "project") {
                view_project_stack_set(options.activeDeckIndexForLayer);
                title_rect_cache_build();
              } else {
                const active = deck_active_get();
                if (active) deck_active_index_set(decks.indexOf(active));
              }
              if (!options.skipTitleUpdate) {
                title_rect_overlay_show(title_state_list_get(viewState));
              }
            });
          }
        }

        function view_set(view) {
          // __view_set
          if (view === "deck" || view === "expanded") lastProjectScroll = window.scrollY;
          localStorage.setItem(VIEW_KEY, view);
          const fromProject = document.body.classList.contains("project-view");
          const fromDeck = document.body.classList.contains("deck-view");
          const fromExpanded = document.body.classList.contains("expanded-view");

          if (fromProject && view === "deck") {
            transition_project_deck_run("deck");
          } else if (fromProject && view === "expanded") {
            transition_project_expanded_run("expanded");
          } else if (fromDeck && view === "project") {
            transition_project_deck_run("project");
          } else if (fromDeck && view === "expanded") {
            transition_deck_expanded_run("expanded");
          } else if (fromExpanded && view === "project") {
            transition_project_expanded_run("project");
          } else if (fromExpanded && view === "deck") {
            transition_deck_expanded_run("deck");
          } else {
            view_apply(view);
          }

          if (view === "deck" || view === "expanded") window.scrollTo(0, 0);
          else requestAnimationFrame(() => window.scrollTo(0, lastProjectScroll));
        }

        const colorToIndex = { yellow: YELLOW_CARD_INDEX, red: RED_CARD_INDEX, green: GREEN_CARD_INDEX };

        function card_front_data_get() {
          const active = deck_active_get();
          if (!active) return null;
          const deckId = active.dataset.deck;
          const deckData = decksData.find((d) => d.id === deckId);
          if (!deckData || !deckData.cards) return null;
          const saved = localStorage.getItem(deck_selection_key_get(deckId));
          const order = orderMap[saved] || orderMap.yellow;
          const frontIndex = colorToIndex[order[0]];
          if (frontIndex === undefined) return null;
          return deckData.cards[frontIndex] || null;
        }

        function card_flip_animate(active, startRect, endRect) {
          const dx = startRect.left - endRect.left;
          const dy = startRect.top - endRect.top;
          const scaleX = startRect.width / endRect.width;
          const scaleY = startRect.height / endRect.height;
          if (active._flipAnimation) {
            active._flipAnimation.cancel();
          }
          active.classList.add("is-animating");
          active.style.transformOrigin = "top left";
          const animation = active.animate(
            [
              { transform: `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})` },
              { transform: "translate(0px, 0px) scale(1, 1)" },
            ],
            { duration: 520, easing: "ease", fill: "both" }
          );
          active._flipAnimation = animation;
          animation.onfinish = () => {
            active.classList.remove("is-animating");
            active.style.transformOrigin = "";
            active._flipAnimation = null;
          };
          animation.oncancel = () => {
            active.classList.remove("is-animating");
            active.style.transformOrigin = "";
            active._flipAnimation = null;
          };
        }

        function title_flip_animate(startRect, endRect) {
          if (!pageTitle || !startRect || !endRect) return;
          const dx = startRect.left - endRect.left;
          const dy = startRect.top - endRect.top;
          const scaleX = startRect.width / endRect.width;
          const scaleY = startRect.height / endRect.height;
          const animation = pageTitle.animate(
            [
              { transform: `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})` },
              { transform: "translate(0px, 0px) scale(1, 1)" },
            ],
            { duration: 520, easing: "ease", fill: "both" }
          );
          animation.onfinish = () => {
            pageTitle.style.transform = "";
          };
          animation.oncancel = () => {
            pageTitle.style.transform = "";
          };
        }

        function deck_init_run() {
          decks.forEach((deck) => {
            const deckTitle = deck.querySelector(".deck-title");
          if (deckTitle) {
            // __ux_deck_click
            deckTitle.addEventListener("click", (event) => {
              if (document.body.classList.contains("deck-view") || document.body.classList.contains("expanded-view")) {
                event.stopPropagation();
                view_set("project");
                return;
              }
              event.stopPropagation();
              deck_active_set(deck.dataset.deck);
              view_set("deck");
            });
          }
          /* Card interactivity lives in the overlay; viewport/deck clicks open deck in project view */
          const viewport = deck.querySelector(".deck-viewport");
          if (viewport) {
            viewport.addEventListener("click", (event) => {
              if (!document.body.classList.contains("project-view")) return;
              event.stopPropagation();
              deck_active_set(deck.dataset.deck);
              view_set("deck");
            });
          }

          deck.addEventListener("click", () => {
            if (!document.body.classList.contains("project-view")) return;
            deck_active_set(deck.dataset.deck);
            view_set("deck");
          });
        });

        pageTitle.addEventListener("click", () => {
          if (document.body.classList.contains("deck-view") || document.body.classList.contains("expanded-view")) {
            view_set("project");
          }
        });

        const exportDeckDataBtn = document.getElementById("exportDeckDataBtn");
        if (exportDeckDataBtn) {
          exportDeckDataBtn.addEventListener("click", export_file_save);
        }
        const titleRowBackBtn = document.getElementById("titleRowBackBtn");
        if (titleRowBackBtn) {
          // __ux_title_back
          titleRowBackBtn.addEventListener("click", () => view_set("project"));
        }
        const titleRowExpandBtn = document.getElementById("titleRowExpandBtn");
        if (titleRowExpandBtn) {
          // __ux_title_expand
          titleRowExpandBtn.addEventListener("click", () => {
            const isExpanded = document.body.classList.contains("expanded-view");
            view_set(isExpanded ? "deck" : "expanded");
          });
        }
        const reload_key = "index-card3-auto-reload";
        const reload_switch = document.getElementById("reload_switch");
        const reload_switch_status = document.getElementById("reload_switch_status");
        function update_reload_ui() {
          // __update_reload_ui
          const on = localStorage.getItem(reload_key) === "1";
          if (reload_switch) {
            reload_switch.setAttribute("aria-checked", on ? "true" : "false");
            reload_switch.setAttribute("aria-label", "Auto-reload " + (on ? "on" : "off"));
          }
          if (reload_switch_status) reload_switch_status.textContent = on ? "on" : "off";
        }
        if (reload_switch) {
          update_reload_ui();
          reload_switch.addEventListener("click", () => {
            // __reload_toggle_click
            const on = localStorage.getItem(reload_key) === "1";
            localStorage.setItem(reload_key, on ? "0" : "1");
            update_reload_ui();
          });
        }
        const deck_data_loadFileBtn = document.getElementById("deck_data_loadFileBtn");
        const deck_data_loadFileInput = document.getElementById("deck_data_loadFileInput");
        if (deck_data_loadFileBtn && deck_data_loadFileInput) {
          deck_data_loadFileBtn.addEventListener("click", () => deck_data_loadFileInput.click());
          deck_data_loadFileInput.addEventListener("change", () => {
            const file = deck_data_loadFileInput.files && deck_data_loadFileInput.files[0];
            deck_data_file_load(file);
            deck_data_loadFileInput.value = "";
          });
        }

        document.addEventListener("click", (event) => {
          if (event.target.closest(".title-row-back") || event.target.closest(".title-row-expand")) {
            return;
          }
          /* Skip navigation if click hit a deck title overlay (dblclick edits it) */
          if (event.target.closest(".title-rect[data-title-type='deck']")) {
            return;
          }
          const rect = pageTitle.getBoundingClientRect();
          const pad = 24;
          const x = event.clientX;
          const y = event.clientY;
          const inside =
            x >= rect.left - pad &&
            x <= rect.right + pad &&
            y >= rect.top - pad &&
            y <= rect.bottom + pad;
          if (inside) {
            if (document.body.classList.contains("deck-view") || document.body.classList.contains("expanded-view")) {
              view_set("project");
            }
          }
        });

        const viewBackdrop = document.getElementById("viewBackdrop");
        if (viewBackdrop) {
          viewBackdrop.addEventListener("click", () => {
            if (document.body.classList.contains("deck-view") || document.body.classList.contains("expanded-view")) {
              view_set("project");
            }
          });
          viewBackdrop.addEventListener("touchend", () => {
            if (document.body.classList.contains("deck-view") || document.body.classList.contains("expanded-view")) {
              view_set("project");
            }
          });
        }

        if (imageLightbox) {
          imageLightbox.addEventListener("click", () => {
            lightbox_close();
          });
        }

        const savedActive = localStorage.getItem(ACTIVE_KEY);
        if (savedActive) {
          deck_active_set(savedActive);
        }

        let savedView = localStorage.getItem(VIEW_KEY) || localStorage.getItem(LEGACY_MODE_KEY) || "project";
        if (savedView === "mini") savedView = "project";
        if (savedView === "deck" && localStorage.getItem(EXPANDED_KEY) === "1") savedView = "expanded";
        if (savedView) localStorage.setItem(VIEW_KEY, savedView);
        if (savedView === "project") {
          const active = deck_active_get();
          view_apply(savedView, active != null ? { activeDeckIndexForLayer: decks.indexOf(active) } : {});
        } else {
          view_apply(savedView);
        }
        if (savedView === "project") {
          requestAnimationFrame(() => {
            window.scrollTo(0, lastProjectScroll);
          });
        } else {
          window.scrollTo(0, 0);
        }

        try {
          const lightboxState = JSON.parse(localStorage.getItem(IMAGE_LIGHTBOX_KEY));
          if (lightboxState && lightboxState.open && lightboxState.src) {
            lightbox_open(lightboxState.src, lightboxState.alt || "");
          }
        } catch {
          // ignore invalid state
        }

        card_outline_apply_all();
        item_edit_setup();
        item_insert_setup();
        tab_title_edit_setup();
        /* Save selection when still editing so reload can restore it (no blur) */
        window.addEventListener("pagehide", edit_state_save_current);
        window.addEventListener("beforeunload", edit_state_save_current);
        document.addEventListener("selectionchange", edit_state_save_current);
        deck_tab_offset_update_all();
        deck_scale_update();
        requestAnimationFrame(() => {
          deck_scale_update();
          deck_tab_offset_update_all();
        });

        decks.forEach((deck) => {
          const saved = localStorage.getItem(deck_selection_key_get(deck.dataset.deck));
          if (saved && orderMap[saved]) {
            deck_order_set(orderMap[saved], deck);
          } else {
            deck_order_set(orderMap.yellow, deck);
          }
        });

        let resizeFrame = null;
        window.addEventListener("resize", () => {
          if (resizeFrame) return;
          resizeFrame = requestAnimationFrame(() => {
            resizeFrame = null;
            deck_scale_update();
            deck_tab_offset_update_all();
            if (document.body.classList.contains("project-view")) {
              title_rect_cache_build();
            }
            var currentView = document.body.classList.contains("project-view") ? "project"
              : document.body.classList.contains("expanded-view") ? "expanded" : "deck";
            title_rect_overlay_show(title_state_list_get(currentView));
          });
        });
        }

        if (window.__SAVED_STATE__) {
          const state = window.__SAVED_STATE__;
          window.__SAVED_STATE__ = null;
          if (state.decks && state.decks.length > 0 && deck_data_normalize({ decks: state.decks }) != null) {
            deck_data_render({ decks: state.decks }, false);
          } else {
            deck_data_load();
          }
        } else {
          deck_data_load();
        }
      })();
    </script>
  </body>
</html>
