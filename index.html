<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decks</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="project-view">
    <div class="title-row">
      <button type="button" class="title-row-back" id="titleRowBackBtn" title="Back to Project" aria-label="Back to Project"><span aria-hidden="true">←</span></button>
      <h1 class="page-title" id="pageTitle">Project</h1>
      <button type="button" class="title-row-btn load-deck-data" id="loadDeckDataFileBtn" title="Load index.txt from file" aria-label="Load from file">📂</button>
      <button type="button" class="title-row-btn export-deck-data" id="exportDeckDataBtn" title="Export deck data" aria-label="Export deck data"><span class="title-row-btn-icon" aria-hidden="true">↓</span></button>
      <button type="button" class="title-row-btn reload-deck-data" id="reloadDeckDataBtn" title="Reload data from index.txt" aria-label="Reload data from index.txt"><span class="title-row-btn-icon" aria-hidden="true">↑</span></button>
      <button type="button" class="title-row-expand" id="titleRowExpandBtn" title="Expand" aria-label="Expand"></button>
      <span class="reload_switch_wrap" title="Page auto-reload">
        <button type="button" class="reload_switch" id="reload_switch" role="switch" aria-label="Auto-reload page" title="Toggle auto-reload"><span class="reload_switch_label">Reload</span> <span class="reload_switch_status" id="reload_switch_status">on</span></button>
      </span>
    </div>
    <input type="file" id="loadDeckDataFileInput" accept=".txt,.json,application/json" hidden />
    <div class="view-backdrop" id="viewBackdrop" aria-hidden="true"></div>
    <div class="image-lightbox" id="imageLightbox" aria-hidden="true">
      <img alt="" src="" />
    </div>
    <div id="deckProxy" class="deck-proxy" aria-hidden="true"></div>
    <div id="cardRectOverlay" class="card-rect-overlay" aria-hidden="true"></div>
    <div id="titleOverlay" class="title-overlay" aria-hidden="true"></div>
    <main class="decks" id="decksRoot" aria-label="Decks"></main>

    <a href="buddy.html" class="page-link-box" title="Buddy (LLM &amp; transcription)">B</a>

    <script src="shared.js"></script>
    <script>
      PopsShared.setupAutoReload({
        // __reload_ui_setup
        intervalMs: 4000,
        scrollKey: "scroll-index-card3",
        canReload: function () {
          return localStorage.getItem("index-card3-auto-reload") !== "0" && !window.__popsIsListening;
        }
      });
      (function () {
        const LINES_TOTAL = 13;
        const VIEW_KEY = "index-card3-view";
        const LEGACY_MODE_KEY = "index-card3-mode";
        const ACTIVE_KEY = "index-card3-active";
        const SELECT_KEY = "index-card3-selected";
        const EXPANDED_KEY = "index-card3-expanded";
        const IMAGE_LIGHTBOX_KEY = "index-card3-image-lightbox";
        const CARD_EDITS_KEY = "index-card3-card-edits";
        const ACTIVE_EDIT_KEY = "index-card3-active-edit";
        const DATA_URL = "index.txt";
        const pageTitle = document.getElementById("pageTitle");
        const decksRoot = document.getElementById("decksRoot");
        const imageLightbox = document.getElementById("imageLightbox");
        const imageLightboxImg = imageLightbox ? imageLightbox.querySelector("img") : null;
        let lastProjectScroll = 0;

        /* Leftmost card is ALWAYS index 0 (yellow). Do not overwrite --card-left anywhere. */
        const LEFTMOST_CARD_INDEX = 0;
        const YELLOW_CARD_INDEX = LEFTMOST_CARD_INDEX;
        const RED_CARD_INDEX = 1;
        const GREEN_CARD_INDEX = 2;

        const layerLayouts = [
          {
            color: "yellow", /* ALWAYS leftmost: --card-left 0px must stay fixed */
            style:
              "--card-left: 0px; --card-top: 0px; --tab-offset-x: 50px; --tab-offset-y: -53px; --layer-z: 90; --text-list-top: 22px;",
          },
          {
            color: "red", /* second from left */
            style:
              "--card-left: 36px; --card-top: -17px; --tab-offset-x: 292px; --tab-offset-y: -53px; --layer-z: 70; --text-title-top: -32px; --text-list-top: 24px;",
          },
          {
            color: "green", /* third from left / rightmost */
            style:
              "--card-left: 72px; --card-top: -34px; --tab-offset-x: 534px; --tab-offset-y: -53px; --layer-z: 50; --text-title-top: -32px; --text-list-top: 24px;",
          },
        ];

        let decksData;
        let decks;

        /* Fallback when index.txt is missing or invalid. Half a Chair's Worth: index 0 = yellow (leftmost), 1 = red, 2 = green */
        const defaultBarbershopCards = [
          {
            tabLabel: "Basic<br />Information",
            title: "Basic Information",
            image: "png/half a chairs worth.png",
            imageAlt: "Half a Chair's Worth",
            items: [
              { text: "Title" },
              { text: "\"Half a Chair's Worth\"", classes: ["level-2"] },
              { text: "Old titles", classes: ["level-2"] },
              { text: "\"What We Know, How Do We Know It\"", classes: ["level-3"] },
              { text: "What is it", classes: ["section"] },
              { text: "Amusing dialog on a heavy subject", classes: ["level-2"] },
              { text: "Message", classes: ["section"] },
              { text: "Know thy self", classes: ["level-2"] },
            ],
          },
          {
            tabLabel: "Main<br />Characters",
            title: "Main Characters",
            image: "png/vision.png",
            imageAlt: "Vision",
            imageClass: "card-text-image-small card-text-image-narrow",
            items: [
              { text: "George Weatherby" },
              {
                text: "Poetic, \"by the time we published this book, people won't be reading books anymore.\"",
                classes: ["level-2"],
              },
              { text: "Bad barber", classes: ["level-2"] },
              { text: "Aubrey Frick", classes: ["section"] },
              { text: "Practical, \"nobody cares anyway.\" Has Bad haircut.", classes: ["level-2"] },
              { text: "Has Deep cut in conscience", classes: ["level-2"] },
              { text: "Commonalities", classes: ["section"] },
              { text: "Assistant professors of mathematics (cover for math).", classes: ["level-2"] },
              { text: "Floridian", classes: ["level-2"] },
              { text: "40 year olds", classes: ["level-2"] },
              {
                text: "Don't speak Spanish, likely not Cuban, white vs Indian debate (undecided).",
                classes: ["level-2"],
              },
              { text: "Will misinformed and lie while deciding", classes: ["level-2"] },
            ],
          },
          {
            tabLabel: "Setting<br />&amp; Story",
            title: "Setting & Story",
            image: "png/shape.png",
            imageAlt: "Story shape",
            imageClass: "card-text-image-small card-text-image-narrow",
            items: [
              { text: "Setting" },
              { text: "Cuba, before Castro died", classes: ["level-2"] },
              { text: "One barbershop chair (half a chair's worth)", classes: ["level-2"] },
              { text: "Missed cruise return; ship flagged Uganda; seven years", classes: ["level-2"] },
              { text: "Setup", classes: ["section"] },
              { text: "Aubrey's adult child (20) is visiting", classes: ["level-2"] },
              { text: "He prepares the wisdom he'll say", classes: ["level-2"] },
              {
                text: "Issue (missed cruise or weren't allowed back; got drunk/drugged/illegal; may not be revealed early)",
                classes: ["level-2"],
              },
              { text: "Story flow", classes: ["section"] },
              { text: "Action rises, drops, then spikes at end", classes: ["level-2"] },
              { text: "Decide peak and trough", classes: ["level-2"] },
              { text: "By Act 1 Scene 1 end, we know who they are", classes: ["level-2"] },
            ],
          },
        ];

        const emptyCards = layerLayouts.map(() => ({
          tabLabel: "",
          title: "",
          items: [],
        }));

        /* Deck 3 Comebacks: yellow card = Too cheap with "how's your mother" */
        const comebacksCards = [
          { tabLabel: "Too cheap", title: "Too cheap", items: [{ text: "how's your mother" }] },
          ...layerLayouts.slice(1).map(() => ({ tabLabel: "", title: "", items: [] })),
        ];

        /* Away We Go deck: index 0 = yellow, 1 = red, 2 = green. Fallback when index.txt missing. */
        const defaultAwayWeGoCards = layerLayouts.map((layout, index) => {
          if (index === YELLOW_CARD_INDEX) {
            return {
              tabLabel: "Herodotus",
              title: "Herodotus",
              items: [
                { text: "The Greek historian Herodotus believed that we are what we do, not what we say.", classes: ["level-2"] },
                { text: "According to him, our worth does not rely upon our appearance or the wardrobe we carry.", classes: ["level-2"] },
                { text: "Furthermore, our evaluation of moral behavior sometimes lies outside the scope of due diligence.", classes: ["level-2"] },
                { text: "The inevitability of conflict was evident from the start.", classes: ["level-2"] },
              ],
            };
          }
          if (index === RED_CARD_INDEX) {
            return {
              tabLabel: "Example",
              title: "Example",
              items: [
                { text: "A story comes to mind from my operations days at AT&T in which I ran into a clash of cultures that caused confusion daily.", classes: ["level-2"] },
                { text: "For example, a driver was sent to our location in West Virginia in a super-long limousine, inappropriate in scruffy West Virginia.", classes: ["level-2"] },
                { text: "I could not convince the driver that money was not the sole criteria for evaluation.", classes: ["level-2"] },
                { text: "\"It's free. They give you the limo for free!\"", classes: ["level-2"] },
                { text: "Again and again, she demonstrated that money was the only criteria she considered.", classes: ["level-2"] },
              ],
            };
          }
          if (index === GREEN_CARD_INDEX) {
            return {
              tabLabel: "Conflicts",
              title: "Conflicts",
              items: [
                { text: "Conflicts are inevitable; we all have to navigate backgrounds and situations in the early part of our career.", classes: ["level-2"] },
                { text: "There are differences in the meaning of words, phrases, and gestures.", classes: ["level-2"] },
                { text: "It takes repetition to wipe out the past.", classes: ["level-2"] },
                { classes: ["line-break"] },
                { text: "He had a way that permitted, etc.", classes: ["level-2"] },
              ],
            };
          }
          return { tabLabel: "", title: "", items: [] };
        });

        const defaultDecksData = [
          { id: "barbershop", title: "Half a Chair's Worth", miniTitle: "Half a Chair's Worth", isActive: true, cards: defaultBarbershopCards },
          { id: "new", title: "Away We Go", miniTitle: "Away We Go", isActive: false, cards: defaultAwayWeGoCards },
          { id: "third", title: "Title", miniTitle: "Title", isActive: false, cards: comebacksCards },
        ];

        function normalizeToDecksData(data) {
          if (data && Array.isArray(data.decks) && data.decks.length > 0) {
            return data.decks.map((d, i) => ({
              id: d.id != null ? d.id : "deck-" + i,
              title: d.title != null ? d.title : "",
              miniTitle: d.miniTitle != null ? d.miniTitle : (d.title != null ? d.title : ""),
              isActive: i === 0,
              cards: Array.isArray(d.cards) ? d.cards : [],
            }));
          }
          if (data && Array.isArray(data.barbershopCards) && Array.isArray(data.awayWeGoCards)) {
            return [
              { id: "barbershop", title: "Half a Chair's Worth", miniTitle: "Half a Chair's Worth", isActive: true, cards: data.barbershopCards },
              { id: "new", title: "Away We Go", miniTitle: "Away We Go", isActive: false, cards: data.awayWeGoCards },
              { id: "third", title: "Title", miniTitle: "Title", isActive: false, cards: (data.comebacksCards && Array.isArray(data.comebacksCards)) ? data.comebacksCards : comebacksCards },
            ];
          }
          return null;
        }

        function loadDecksFromData(data, fromFile) {
          // __ux_data_render
          const list = normalizeToDecksData(data);
          decksData = list != null ? list : defaultDecksData;
          /* Do not clear CARD_EDITS_KEY so title/tab and item edits persist across reloads */
          while (decksRoot.firstChild) {
            decksRoot.removeChild(decksRoot.firstChild);
          }
          decksData.forEach((deck, index) => {
            decksRoot.appendChild(buildDeck(deck, index));
          });
          decks = Array.from(document.querySelectorAll(".deck"));
          buildCardRectOverlay();
          buildTitleOverlay();
          runDeckInit();
        }

        function setDeckDataSource(message) {
          const el = document.getElementById("deckDataSource");
          if (el) el.textContent = message ? ` ${message}` : "";
        }

        function loadDeckData() {
          // __ux_data_load
          if (location.protocol === "file:") {
            loadDecksFromData(null, false);
            setDeckDataSource("(file:// — click 📂 to load index.txt)");
            return;
          }
          const url = new URL(DATA_URL + "?t=" + Date.now(), location.href).href;
          fetch(url, { cache: "no-store" })
            .then((r) => (r.ok ? r.json() : Promise.reject()))
            .then((data) => {
              if (normalizeToDecksData(data) != null) {
                loadDecksFromData(data, true);
                setDeckDataSource("(loaded from index.txt)");
              } else {
                loadDecksFromData(null, false);
                setDeckDataSource("(using built-in data; serve over HTTP or use Load from file)");
              }
            })
            .catch(() => {
              loadDecksFromData(null, false);
              setDeckDataSource("(reload failed — click 📂 to load index.txt)");
            });
        }

        function reloadDeckDataFromFile() {
          // __reload_data_fetch
          const url = new URL(DATA_URL + "?t=" + Date.now(), location.href).href;
          fetch(url, { cache: "no-store" })
            .then((r) => (r.ok ? r.json() : Promise.reject()))
            .then((data) => {
              if (normalizeToDecksData(data) != null) {
                loadDecksFromData(data, true);
                setDeckDataSource("(loaded from index.txt)");
              } else {
                loadDecksFromData(null, false);
                setDeckDataSource("(reload failed; using built-in data)");
              }
            })
            .catch(() => {
              loadDecksFromData(null, false);
              setDeckDataSource("(reload failed, e.g. file:// — use Load from file)");
            });
        }

        function loadDeckDataFromFileInput(file) {
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              if (normalizeToDecksData(data) != null) {
                loadDecksFromData(data, true);
                setDeckDataSource("(loaded from file)");
              } else {
                setDeckDataSource("(invalid format: need decks array or barbershopCards + awayWeGoCards)");
              }
            } catch (_) {
              setDeckDataSource("(invalid JSON)");
            }
          };
          reader.onerror = () => setDeckDataSource("(could not read file)");
          reader.readAsText(file);
        }

        function createEl(tag, className, text) {
          const el = document.createElement(tag);
          if (className) {
            el.className = className;
          }
          if (text != null) {
            el.textContent = text;
          }
          return el;
        }

        function buildLines(container) {
          const red = createEl("span", "line red");
          red.style.top = "var(--line-offset)";
          container.appendChild(red);
          for (let i = 1; i < LINES_TOTAL; i += 1) {
            const line = createEl("span", "line blue");
            line.style.top = `calc(var(--line-offset) + var(--line-gap) * ${i})`;
            container.appendChild(line);
          }
        }

        function getCardEdits() {
          try {
            const raw = localStorage.getItem(CARD_EDITS_KEY);
            return raw ? JSON.parse(raw) : {};
          } catch (_) {
            return {};
          }
        }
        function getEditedText(deckId, cardIndex, itemIndex) {
          const key = `${deckId}-${cardIndex}-${itemIndex}`;
          return getCardEdits()[key];
        }
        function saveEditedText(deckId, cardIndex, itemIndex, text) {
          const edits = getCardEdits();
          edits[`${deckId}-${cardIndex}-${itemIndex}`] = text;
          localStorage.setItem(CARD_EDITS_KEY, JSON.stringify(edits));
        }
        function getEditedTabLabel(deckId, cardIndex) {
          return getCardEdits()[`${deckId}-${cardIndex}-tabLabel`];
        }
        function saveEditedTabLabel(deckId, cardIndex, text) {
          const edits = getCardEdits();
          edits[`${deckId}-${cardIndex}-tabLabel`] = text;
          localStorage.setItem(CARD_EDITS_KEY, JSON.stringify(edits));
        }
        function getEditedCardTitle(deckId, cardIndex) {
          return getCardEdits()[`${deckId}-${cardIndex}-cardTitle`];
        }
        function saveEditedCardTitle(deckId, cardIndex, text) {
          const key = `${deckId}-${cardIndex}-cardTitle`;
          const edits = getCardEdits();
          edits[key] = text;
          try {
            localStorage.setItem(CARD_EDITS_KEY, JSON.stringify(edits));
          } catch (e) {
            console.warn("Could not save card title to localStorage", e);
          }
        }
        /** Single source of truth for card title (used for both title and tab). Same pattern as getEditedText: prefer stored value. */
        function getDisplayTitle(deckId, cardIndex) {
          const stored = getEditedCardTitle(deckId, cardIndex);
          if (stored != null) return stored;
          const deckData = decksData && decksData.find((d) => d.id === deckId);
          const card = deckData && deckData.cards && deckData.cards[cardIndex];
          return (card && card.title) != null ? card.title : "";
        }
        /** Shorten title for tab: first few words so tab doesn't overflow. */
        function shortenForTab(fullTitle) {
          if (!fullTitle || typeof fullTitle !== "string") return "";
          const plain = fullTitle.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
          const words = plain ? plain.split(" ") : [];
          const maxWords = 3;
          if (words.length <= maxWords) return plain;
          return words.slice(0, maxWords).join(" ") + "…";
        }
        /** Save active edit state for reload restore. opts: { type, deckId, cardIndex, selectionStart, selectionEnd, itemIndex? }. type: "item"|"tab"|"cardTitle"; itemIndex only for type "item". */
        function saveActiveEditState(opts) {
          const type = opts.type;
          const deckId = opts.deckId;
          const cardIndex = opts.cardIndex;
          const selectionStart = opts.selectionStart;
          const selectionEnd = opts.selectionEnd;
          const itemIndex = opts.itemIndex;
          try {
            const payload = { type, deckId, cardIndex, selectionStart, selectionEnd };
            if (type === "item" && itemIndex != null) payload.itemIndex = itemIndex;
            localStorage.setItem(ACTIVE_EDIT_KEY, JSON.stringify(payload));
          } catch (_) {}
        }
        function clearActiveEditState() {
          localStorage.removeItem(ACTIVE_EDIT_KEY);
        }

        /** Save current selection/cursor when still editing (e.g. before reload without blur). */
        function saveCurrentEditStateIfActive() {
          const el = document.activeElement;
          if (!el || el.contentEditable !== "true") return;
          const { start, end } = getSelectionOffsets(el);

          if (el.classList && el.classList.contains("card-text-item-text")) {
            const item = el.closest(".card-text-item");
            if (!item || !item.dataset.deckId) return;
            const deckId = item.dataset.deckId;
            const cardIndex = parseInt(item.dataset.cardIndex, 10);
            const itemIndex = parseInt(item.dataset.itemIndex, 10);
            saveActiveEditState({ type: "item", deckId, cardIndex, selectionStart: start, selectionEnd: end, itemIndex });
            return;
          }
          if (el.classList && el.classList.contains("card-tab-editable") && el.dataset.deckId) {
            saveActiveEditState({ type: "tab", deckId: el.dataset.deckId, cardIndex: parseInt(el.dataset.cardIndex, 10), selectionStart: start, selectionEnd: end });
            return;
          }
          if (el.classList && el.classList.contains("card-title-editable") && el.dataset.deckId) {
            saveActiveEditState({ type: "cardTitle", deckId: el.dataset.deckId, cardIndex: parseInt(el.dataset.cardIndex, 10), selectionStart: start, selectionEnd: end });
            return;
          }
        }

        /** Build deck data with all localStorage edits applied, for export as index.txt. */
        function getExportDeckData() {
          if (!decksData || decksData.length < 1) return null;
          const edits = getCardEdits();
          function applyEditsToCards(deckId, cards) {
            const out = JSON.parse(JSON.stringify(cards));
            out.forEach((card, cardIndex) => {
              const titleKey = `${deckId}-${cardIndex}-cardTitle`;
              if (edits[titleKey] != null) card.title = edits[titleKey];
              card.tabLabel = shortenForTab(card.title) || card.title || "";
              (card.items || []).forEach((item, itemIndex) => {
                const key = `${deckId}-${cardIndex}-${itemIndex}`;
                if (edits[key] != null) {
                  item.text = edits[key];
                }
              });
            });
            return out;
          }
          return {
            decks: decksData.map((d) => ({
              id: d.id,
              title: d.title,
              miniTitle: d.miniTitle,
              cards: applyEditsToCards(d.id, d.cards),
            })),
          };
        }

        function exportDeckDataToFile() {
          const data = getExportDeckData();
          if (!data) return;
          const json = JSON.stringify(data, null, 2);
          const blob = new Blob([json], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "index.txt";
          a.click();
          URL.revokeObjectURL(a.href);
        }

        function buildTextList(items, deckId, cardIndex) {
          // __ux_card_items_build
          const list = createEl("div", "card-text-list");
          items.forEach((item, itemIndex) => {
            const entry = document.createElement("div");
            entry.className = "card-text-item";
            if (item.classes && item.classes.length) {
              entry.classList.add(...item.classes);
            }
            entry.dataset.deckId = deckId;
            entry.dataset.cardIndex = String(cardIndex);
            entry.dataset.itemIndex = String(itemIndex);
            const textSpan = document.createElement("span");
            textSpan.className = "card-text-item-text";
            const savedText = getEditedText(deckId, cardIndex, itemIndex);
            textSpan.textContent = savedText != null ? savedText : (item.text != null ? item.text : item.html != null ? item.html : "");
            entry.appendChild(textSpan);
            list.appendChild(entry);
          });
          return list;
        }

        function buildCardLayer(layerConfig, cardData, deckId, cardIndex) {
          // __ux_card_layer_build
          const layer = createEl("div", "card-layer");
          layer.dataset.color = layerConfig.color;
          layer.setAttribute("style", layerConfig.style);

          const tab = createEl("div", `tab card-${layerConfig.color}-tab tab-label card-tab-editable`);
          tab.dataset.deckId = deckId;
          tab.dataset.cardIndex = String(cardIndex);
          const titleContent = getDisplayTitle(deckId, cardIndex);
          const tabContent = shortenForTab(titleContent) || titleContent || "";
          tab.textContent = tabContent;

          const card = createEl("div", `card card-${layerConfig.color}-primary`);
          if (titleContent) card.dataset.cardTitle = titleContent;
          const lines = createEl("div", "card-lines");
          lines.setAttribute("aria-hidden", "true");
          buildLines(lines);

          const text = createEl("div", "card-text");
          const title = createEl("div", "card-text-title card-title-editable", titleContent);
          title.dataset.deckId = deckId;
          title.dataset.cardIndex = String(cardIndex);
          const list = buildTextList(cardData.items || [], deckId, cardIndex);

          text.appendChild(title);
          if (cardData.image) {
            const img = createEl("img", "card-text-image");
            img.src = cardData.image;
            img.alt = cardData.imageAlt || "";
            if (cardData.imageClass) {
              cardData.imageClass.split(/\s+/).forEach((cls) => {
                if (cls) {
                  img.classList.add(cls);
                }
              });
            }
            text.classList.add("has-image");
            text.appendChild(img);
          }
          text.appendChild(list);
          card.appendChild(lines);
          card.appendChild(text);

          layer.appendChild(tab);
          layer.appendChild(card);
          return layer;
        }

        function openImageLightbox(src, alt) {
          // __ux_lightbox_open
          if (!imageLightbox || !imageLightboxImg) return;
          imageLightboxImg.src = src;
          imageLightboxImg.alt = alt || "";
          imageLightbox.classList.add("open");
          imageLightbox.setAttribute("aria-hidden", "false");
          localStorage.setItem(IMAGE_LIGHTBOX_KEY, JSON.stringify({ open: true, src, alt: alt || "" }));
        }

        function closeImageLightbox() {
          // __ux_lightbox_close
          if (!imageLightbox || !imageLightboxImg) return;
          imageLightbox.classList.remove("open");
          imageLightbox.setAttribute("aria-hidden", "true");
          imageLightboxImg.src = "";
          imageLightboxImg.alt = "";
          localStorage.setItem(IMAGE_LIGHTBOX_KEY, JSON.stringify({ open: false }));

        function buildDeck(deckData, index) {
          // __deck_build
          const deck = createEl("div", "deck");
          if (deckData.isActive) {
            deck.classList.add("is-active");
          }
          deck.dataset.deck = deckData.id;
          deck.dataset.title = deckData.title || deckData.miniTitle || String(index + 1);

          const titleText = `${index + 1})${deckData.miniTitle ? " " + deckData.miniTitle : ""}`;
          const title = createEl("div", "deck-title", titleText);
          title.setAttribute("aria-hidden", "true");

          const viewport = createEl("div", "deck-viewport");
          const scaleWrap = createEl("div", "deck-scale");
          const stackWrap = createEl("div", "deck-stack-wrap");
          const section = createEl("section", "card-scene");
          section.setAttribute("aria-label", `${deckData.title} deck`);
          const stack = createEl("div", "card-stack");
          /* Cards live only in the overlay; stack kept empty for viewport dimensions */

          section.appendChild(stack);
          stackWrap.appendChild(section);
          scaleWrap.appendChild(stackWrap);
          viewport.appendChild(scaleWrap);
          deck.appendChild(title);
          deck.appendChild(viewport);
          return deck;
        }

        function getActiveDeck() {
          return decks.find((deck) => deck.classList.contains("is-active")) || decks[0];
        }

        function getDeckTitleText(deck) {
          const el = deck && deck.querySelector(".deck-title");
          return el ? el.textContent : (deck ? deck.dataset.title : "");
        }

        function selectionKeyFor(deckName) {
          return `${SELECT_KEY}-${deckName}`;
        }

        /* Slots set top + z only. Horizontal position is fixed: yellow always leftmost (0px), then red, green. */
        /* Position by stack order: front=0px (lowest), middle=-8px, highest=-24px. */
        const slots = {
          front: { cardTop: "0px", layerZ: 90 },
          middle: { cardTop: "-8px", layerZ: 70 },
          highest: { cardTop: "-24px", layerZ: 50 },
        };
        const stackTopsByPosition = ["0px", "-8px", "-24px"];
        const tabOffsetY = -53;

        function buildLayerMap(deck) {
          const layerMap = {};
          const overlay = document.getElementById("cardRectOverlay");
          if (!overlay) return layerMap;
          const deckIndex = decks.indexOf(deck);
          if (deckIndex < 0) return layerMap;
          overlay.querySelectorAll(".card-rect[data-deck-index=\"" + deckIndex + "\"]").forEach((rect) => {
            const layer = rect.querySelector(".card-layer");
            if (layer && layer.dataset.color) {
              layerMap[layer.dataset.color] = layer;
            }
          });
          return layerMap;
        }

        function applyLayer(layer, slot) {
          if (!layer) return;
          layer.style.setProperty("--card-top", slot.cardTop);
          layer.style.setProperty("--layer-z", slot.layerZ);
          /* Do not set --card-left here: leftmost (yellow) must always stay at 0px */
        }

        function updateTabOffsets(layerMap, deck) {
          // __deck_tab_offset_update
          /* Card layers live in overlay; use design width 1200 (CARD_RECT_WIDTH) */
          const cardWidth = 1200;
          /* Tabs 28% each; margins 5% each side; gaps 2% between – room at edges */
          const tabFrac = 0.28;
          const marginFrac = 0.05;
          const gapFrac = 0.02;
          const tabWidth = Math.floor(cardWidth * tabFrac);
          const leftInset = Math.round(cardWidth * marginFrac);
          const gap = Math.round(cardWidth * gapFrac);
          const colors = ["yellow", "red", "green"];
          colors.forEach((color, index) => {
            const layer = layerMap[color];
            if (!layer) return;
            layer.style.setProperty("--tab-width", tabWidth + "px");
            const left = leftInset + index * (tabWidth + gap);
            layer.style.setProperty("--tab-offset-x", left + "px");
          });
        }

        function updateAllTabOffsets() {
          decks.forEach((deck) => {
            updateTabOffsets(buildLayerMap(deck), deck);
          });
        }

        function setOrder(order, deck) {
          // __deck_order_set
          const layerMap = buildLayerMap(deck);
          const layerZByPosition = [90, 70, 50];
          order.forEach((color, pos) => {
            const layer = layerMap[color];
            if (!layer) return;
            const cardTop = stackTopsByPosition[pos] || slots.front.cardTop;
            const slot = { cardTop: cardTop, layerZ: layerZByPosition[pos] };
            applyLayer(layer, slot);
          });
          Object.values(layerMap).forEach((layer) => layer.classList.remove("is-front"));
          if (layerMap[order[0]]) {
            layerMap[order[0]].classList.add("is-front");
          }
          const cardStack = deck.querySelector(".card-stack");
          if (cardStack) {
            const tops = order.map((color, pos) => {
              const top = stackTopsByPosition[pos] || slots.front.cardTop;
              return parseFloat(top) + tabOffsetY;
            });
            const minTop = Math.min(...tops);
            cardStack.style.setProperty("--stack-top-offset", `${-minTop}px`);
          }
          updateTabOffsets(layerMap, deck);
        }

        const toRoman = (n) => {
          if (n < 1 || n > 20) return String(n);
          const map = [[10, "x"], [9, "ix"], [5, "v"], [4, "iv"], [1, "i"]];
          let s = "";
          for (const [val, sym] of map) {
            while (n >= val) {
              s += sym;
              n -= val;
            }
          }
          return s;
        };

        function applyLineNumbersInRoot(root) {
          const maxLines = 12;
          if (!root) return;
          root.querySelectorAll(".card-text-list").forEach((list) => {
            const card = list.closest(".card");
            const cardTitle = (card && (card.dataset.cardTitle || card.querySelector(".card-text-title")?.textContent || "") || "").trim().toLowerCase();
            const isBasicInfo = cardTitle === "basic information" || (cardTitle && cardTitle.startsWith("basic info"));

            const sectionItems = Array.from(list.querySelectorAll(".card-text-item.section"));
            if (!isBasicInfo) {
              sectionItems.forEach((section) => {
                const prev = section.previousElementSibling;
                if (!prev || !prev.classList.contains("line-break")) {
                  const breakItem = document.createElement("div");
                  breakItem.className = "card-text-item line-break";
                  list.insertBefore(breakItem, section);
                }
              });
            }

            if (!isBasicInfo) {
              list.querySelectorAll(".card-text-item.level-2").forEach((item) => {
                const next = item.nextElementSibling;
                if (next && next.classList.contains("level-2")) {
                  const blank = document.createElement("div");
                  blank.className = "card-text-item line-break";
                  item.parentNode.insertBefore(blank, next);
                }
              });
            }

            const items = Array.from(list.querySelectorAll(".card-text-item"));
            /* Alpha-outline numbering: top level uppercase A/B/C, second level lowercase a/b/c, third level Roman i/ii/iii */
            const alphaOutlineCards = ["basic information", "basic info", "basic info.", "main characters", "setting & story", "herodotus"];
            const useAlphaOutline = alphaOutlineCards.includes(cardTitle) || (cardTitle && cardTitle.startsWith("basic info"));
            let topNum = 0;
            let level2Num = 0;
            let level3Num = 0;
            items.forEach((item) => {
              item.querySelectorAll(".alpha-marker").forEach((node) => node.remove());
              item.querySelectorAll(".bullet-marker").forEach((node) => node.remove());
              if (!item.classList.contains("line-break")) {
                let label;
                if (item.classList.contains("level-3")) {
                  level3Num += 1;
                  label = toRoman(level3Num) + ")";
                } else if (item.classList.contains("level-2")) {
                  level2Num += 1;
                  level3Num = 0;
                  label = useAlphaOutline
                    ? String.fromCharCode(96 + level2Num) + ")"
                    : String.fromCharCode(64 + level2Num) + ")";
                } else {
                  /* Top level: section headers or items with no level class */
                  topNum += 1;
                  level2Num = 0;
                  level3Num = 0;
                  label = useAlphaOutline
                    ? String.fromCharCode(64 + topNum) + ")"
                    : `${topNum})`;
                }
                const bullet = document.createElement("span");
                bullet.className = "bullet-marker";
                bullet.textContent = label;
                item.prepend(bullet);
              }
            });

            /* Line numbers in fixed vertical slots (align with ruled lines); text rows variable height. */
            const numbersWrap = document.createElement("div");
            numbersWrap.className = "card-line-numbers";
            numbersWrap.setAttribute("aria-hidden", "true");
            for (let i = 0; i < maxLines; i += 1) {
              const slot = document.createElement("div");
              slot.className = "card-line-number-slot";
              slot.style.setProperty("--line-index", String(i));
              const numSpan = document.createElement("span");
              numSpan.className = "line-number";
              numSpan.textContent = String(i + 1);
              slot.appendChild(numSpan);
              numbersWrap.appendChild(slot);
            }

            const rowsWrap = document.createElement("div");
            rowsWrap.className = "card-text-rows-wrap";
            for (let i = 0; i < maxLines; i += 1) {
              const rowEl = document.createElement("div");
              rowEl.className = "card-text-row";
              const cell = document.createElement("div");
              cell.className = "card-text-cell";
              if (items[i]) {
                cell.appendChild(items[i]);
              }
              rowEl.appendChild(cell);
              rowsWrap.appendChild(rowEl);
            }

            list.innerHTML = "";
            list.classList.add("card-text-list-rows");
            list.appendChild(numbersWrap);
            list.appendChild(rowsWrap);
          });
        }

        function setupCardTextEditing() {
          // __ux_edit_item_setup
          document.querySelectorAll(".card-text-item:not(.line-break) .card-text-item-text").forEach((textSpan) => {
            if (textSpan._editBound) return;
            textSpan._editBound = true;
            const item = textSpan.closest(".card-text-item");
            const deckId = item.dataset.deckId;
            const cardIndex = parseInt(item.dataset.cardIndex, 10);
            const itemIndex = parseInt(item.dataset.itemIndex, 10);

            textSpan.addEventListener("dblclick", (e) => {
              if (document.body.classList.contains("project-view")) return;
              e.stopPropagation();
              e.preventDefault();
              textSpan.contentEditable = "true";
              if (item) item.classList.add("is-editing");
              textSpan.focus();
              const x = e.clientX;
              const y = e.clientY;
              if (document.caretRangeFromPoint) {
                const range = document.caretRangeFromPoint(x, y);
                if (range) {
                  const sel = window.getSelection();
                  sel.removeAllRanges();
                  sel.addRange(range);
                }
              }
              saveActiveEditState({ type: "item", deckId, cardIndex, selectionStart: textSpan.textContent.length, selectionEnd: textSpan.textContent.length, itemIndex });
            });

            function commitToDeckAndStorage(deckId, cardIndex, itemIndex, text) {
              const deckData = decksData.find((d) => d.id === deckId);
              if (deckData && deckData.cards && deckData.cards[cardIndex] && deckData.cards[cardIndex].items && deckData.cards[cardIndex].items[itemIndex]) {
                deckData.cards[cardIndex].items[itemIndex].text = text;
              }
              saveEditedText(deckId, cardIndex, itemIndex, text);
            }

            textSpan.addEventListener("blur", () => {
              if (textSpan.contentEditable !== "true") return;
              /* Save current selection/cursor so we can re-select after reload */
              const sel = window.getSelection();
              if (sel.rangeCount && textSpan.contains(sel.anchorNode)) {
                try {
                  const range = sel.getRangeAt(0);
                  const len = textSpan.textContent.length;
                  const start = range.startContainer === textSpan || range.startContainer.parentNode === textSpan
                    ? range.startOffset
                    : len;
                  const end = range.endContainer === textSpan || range.endContainer.parentNode === textSpan
                    ? range.endOffset
                    : len;
                  saveActiveEditState({ type: "item", deckId, cardIndex, selectionStart: Math.min(start, len), selectionEnd: Math.min(end, len), itemIndex });
                } catch (_) {}
              } else {
                /* No selection in this span; save cursor at end so we can still restore this line */
                const len = textSpan.textContent.length;
                saveActiveEditState({ type: "item", deckId, cardIndex, selectionStart: len, selectionEnd: len, itemIndex });
              }
              textSpan.contentEditable = "false";
              if (item) item.classList.remove("is-editing");
              const newText = textSpan.textContent.replace(/\s+$/g, "").replace(/^\s+/, "");
              textSpan.textContent = newText;
              commitToDeckAndStorage(deckId, cardIndex, itemIndex, newText);
            });

            textSpan.addEventListener("keydown", (e) => {
              if (textSpan.contentEditable !== "true") return;
              if (e.key === "Escape") {
                e.preventDefault();
                textSpan.blur();
              }
            });

            textSpan.addEventListener("input", () => {
              if (textSpan.contentEditable !== "true") return;
              const currentText = textSpan.textContent;
              commitToDeckAndStorage(deckId, cardIndex, itemIndex, currentText);
              const sel = window.getSelection();
              if (sel.rangeCount && textSpan.contains(sel.anchorNode)) {
                try {
                  const range = sel.getRangeAt(0);
                  const len = textSpan.textContent.length;
                  const start = range.startContainer === textSpan || range.startContainer.parentNode === textSpan
                    ? range.startOffset
                    : len;
                  const end = range.endContainer === textSpan || range.endContainer.parentNode === textSpan
                    ? range.endOffset
                    : len;
                  saveActiveEditState({ type: "item", deckId, cardIndex, selectionStart: Math.min(start, len), selectionEnd: Math.min(end, len), itemIndex });
                } catch (_) {}
              }
            });
          });

          try {
            const active = localStorage.getItem(ACTIVE_EDIT_KEY);
            if (active) {
              const parsed = JSON.parse(active);
              const type = parsed.type || "item";
              const deckId = parsed.deckId;
              const selectionStart = parsed.selectionStart;
              const selectionEnd = parsed.selectionEnd;

              function restoreSelection(el, s, e) {
                if (typeof s !== "number" || typeof e !== "number" || !el) return;
                if (!el.firstChild) el.appendChild(document.createTextNode(el.textContent || ""));
                try {
                  const len = el.textContent.length;
                  const start = Math.min(s, len);
                  const end = Math.min(e, len);
                  const sel = window.getSelection();
                  const range = document.createRange();
                  range.setStart(el.firstChild, start);
                  range.setEnd(el.firstChild, end);
                  sel.removeAllRanges();
                  sel.addRange(range);
                } catch (_) {}
              }

              if (type === "item") {
                const itemIndex = parsed.itemIndex;
                const cardIndex = parsed.cardIndex;
                const item = document.querySelector(
                  `.card-text-item[data-deck-id="${deckId}"][data-card-index="${cardIndex}"][data-item-index="${itemIndex}"]`
                );
                if (item) {
                  const textSpan = item.querySelector(".card-text-item-text");
                  if (textSpan) {
                    if (!textSpan.firstChild) textSpan.appendChild(document.createTextNode(textSpan.textContent || ""));
                    textSpan.contentEditable = "true";
                    item.classList.add("is-editing");
                    textSpan.focus();
                    restoreSelection(textSpan, selectionStart, selectionEnd);
                  }
                }
              } else if (type === "tab") {
                const cardIndex = parsed.cardIndex;
                const tab = document.querySelector(
                  `.tab-label.card-tab-editable[data-deck-id="${deckId}"][data-card-index="${cardIndex}"]`
                );
                if (tab) {
                  if (!tab.firstChild) tab.appendChild(document.createTextNode(tab.textContent || ""));
                  tab.contentEditable = "true";
                  tab.focus();
                  restoreSelection(tab, selectionStart, selectionEnd);
                }
              } else if (type === "cardTitle") {
                const cardIndex = parsed.cardIndex;
                const title = document.querySelector(
                  `.card-text-title.card-title-editable[data-deck-id="${deckId}"][data-card-index="${cardIndex}"]`
                );
                if (title) {
                  if (!title.firstChild) title.appendChild(document.createTextNode(title.textContent || ""));
                  title.contentEditable = "true";
                  title.focus();
                  restoreSelection(title, selectionStart, selectionEnd);
                }
              }
              clearActiveEditState();
            }
          } catch (_) {}
        }

        function getSelectionOffsets(el) {
          const len = el.textContent.length;
          let start = len, end = len;
          const sel = window.getSelection();
          if (sel.rangeCount && el.contains(sel.anchorNode)) {
            try {
              const range = sel.getRangeAt(0);
              start = range.startContainer === el || range.startContainer.parentNode === el ? range.startOffset : len;
              end = range.endContainer === el || range.endContainer.parentNode === el ? range.endOffset : len;
              start = Math.min(start, len);
              end = Math.min(end, len);
            } catch (_) {}
          }
          return { start, end };
        }

        function readCssNumber(varName) {
          const raw = getComputedStyle(document.documentElement).getPropertyValue(varName);
          const value = Number.parseFloat(raw);
          return Number.isFinite(value) ? value : 0;
        }

        function updateDeckScales() {
          // __deck_scale_update
          const baseWidth = readCssNumber("--card-base-width") || 1200;
          const baseHeight = (readCssNumber("--stack-base-height") || 755) + readCssNumber("--tab-height");
          const gap = readCssNumber("--expanded-gap") || 0;
          const expandedLift = readCssNumber("--expanded-lift") || 0;
          const topRowLift = readCssNumber("--expanded-top-row-lift") || 0;
          const bottomRowLift = readCssNumber("--expanded-bottom-row-lift") || 0;
          const buffer = readCssNumber("--expanded-buffer") || 0;
          document.documentElement.style.setProperty("--deck-content-width", `${baseWidth}px`);
          document.documentElement.style.setProperty("--deck-content-height", `${baseHeight}px`);

          decks.forEach((deck) => {
            const isProjectView = document.body.classList.contains("project-view");
            let rect;
            if (isProjectView) {
              const vw = document.documentElement.clientWidth || window.innerWidth;
              const viewportWidth = vw >= 1024 ? vw / 3 : vw;
              const viewportHeight = viewportWidth * (baseHeight / baseWidth);
              rect = { width: viewportWidth, height: viewportHeight, left: 0, top: 0 };
            } else {
              const el = deck;
              rect = el.getBoundingClientRect();
            }
            if (rect.width === 0 || rect.height === 0) {
              return;
            }
            const scale = Math.min(rect.width / baseWidth, rect.height / baseHeight);
            deck.style.setProperty("--deck-scale", `${scale}`);
            const widthScale = (rect.width - gap * 2) / (baseWidth * 3);
            const heightAvailable = rect.height - gap - topRowLift + bottomRowLift - buffer;
            const heightScale = heightAvailable / (baseHeight * 2);
            const expandedScale = Math.min(widthScale, heightScale);
            deck.style.setProperty("--expanded-scale", `${expandedScale}`);
            const stepX = baseWidth * expandedScale + gap;
            const stepY = baseHeight * expandedScale + gap;
            const totalW = baseWidth * expandedScale * 3 + gap * 2;
            const offsetX = Math.max((rect.width - totalW) / 2, 0);
            const offsetY = deck.classList.contains("is-expanded") ? -expandedLift : 0;
            deck.style.setProperty("--expanded-step-x", `${stepX}px`);
            deck.style.setProperty("--expanded-step-y", `${stepY}px`);
            deck.style.setProperty("--expanded-offset-x", `${offsetX}px`);
            deck.style.setProperty("--expanded-offset-y", `${offsetY}px`);
          });
        }

        /* Order = [front, middle, back]. Tapping a tab brings that card to the front.
           Back two ordered by color: yellow < red < green (lowest back to highest). */
        const orderMap = {
          yellow: ["yellow", "red", "green"],
          red: ["red", "yellow", "green"],
          green: ["green", "yellow", "red"],
        };

        function promote(color, deckOverride) {
          // __ux_card_promote
          const deck = deckOverride || getActiveDeck();
          const order = orderMap[color];
          if (order) {
            setOrder(order, deck);
            localStorage.setItem(selectionKeyFor(deck.dataset.deck), color);
          }
        }

        function setActiveDeck(id) {
          // __deck_active_set
          decks.forEach((deck) => {
            deck.classList.toggle("is-active", deck.dataset.deck === id);
          });
          localStorage.setItem(ACTIVE_KEY, id);
          updateDeckScales();
        }

        function runProjectDeckTransition(toView) {
          // __ux_transition_project_deck_run
          const active = getActiveDeck();
          if (!active) {
            applyView(toView);
            return;
          }
          const activeIndex = decks.indexOf(active);
          syncTitleOverlayContent();
          const titleFromStates = toView === "project" ? getTitleFromStatesForDeckToProject(activeIndex) : getTitleStatesFromDOM();
          if (toView === "project") {
            const els = getTitleElements();
            if (els[0]) els[0].textContent = "Project";
          }
          showTitleOverlay(titleFromStates);
          const fromStates = toView === "project" ? getStatesForAllDecksCurrentInDeckView() : getStatesForAllDecks("project");
          applyView(toView, toView === "project"
            ? { activeDeckIndexForLayer: activeIndex, skipTitleOverlayUpdate: true }
            : { skipCardRectUpdate: true, skipTitleOverlayUpdate: true });
          if (toView === "project") showCardRectFramework(fromStates);
          requestAnimationFrame(function () {
            if (toView === "deck") {
              updateDeckScales();
              const saved = active ? localStorage.getItem(selectionKeyFor(active.dataset.deck)) : null;
              const order = orderMap[saved] || orderMap.yellow;
              if (active) setOrder(order, active);
            }
            requestAnimationFrame(function () {
              const toStates = toView === "project" ? getStatesForAllDecks("project") : getStatesForAllDecksProjectToDeck();
              if (toView === "deck") setCardRectActiveDeckIndex(activeIndex);
              const titleEls = getTitleElements();
              if (toView === "deck" && titleEls[activeIndex + 1]) titleEls[activeIndex + 1].textContent = getDeckTitleText(getActiveDeck());
              const titleToStates = toView === "project" ? getTitleStatesFromDOM() : getTitleToStatesForProjectToDeck(activeIndex);
              animateTitleOverlay(titleFromStates, titleToStates, 520);
              showCardRectFramework(fromStates);
              animateCardRects(fromStates, toStates, 520, toView === "deck" ? function () {
                buildCardRectOverlay();
                requestAnimationFrame(function () {
                  const states = getStatesForAllDecks("deck");
                  showCardRectFramework(states);
                });
              } : undefined);
            });
          });
        }

                function runDeckExpandedTransition(toView) {
          // __ux_transition_deck_expanded_run
          const active = getActiveDeck();
          if (!active) return;
          const finish = () => document.body.classList.remove("expand-animating", "expand-collapsing");
          syncTitleOverlayContent();
          const titleFromStates = getTitleStatesFromDOM();
          showTitleOverlay(titleFromStates);

          if (toView === "expanded") {
            const fromStates = getStatesForAllDecks("deck");
            lastDeckViewStates = fromStates;
            setCardRectActiveDeckIndex(decks.indexOf(active));
            decks.forEach((deck) => deck.classList.remove("is-expanded"));
            showCardRectFramework(fromStates);
            document.body.classList.add("expand-animating");
            document.body.classList.remove("deck-view");
            document.body.classList.add("expanded-view");
            active.classList.add("is-expanded");
            requestAnimationFrame(function () {
              const titleToStates = getTitleStatesFromDOM();
              animateTitleOverlay(titleFromStates, titleToStates, 520);
              const toStates = getStatesForAllDecks("expanded");
              animateCardRects(fromStates, toStates, 520, finish);
            });
          } else if (toView === "deck") {
            const fromStates = getStatesForAllDecks("expanded");
            showCardRectFramework(fromStates);
            document.body.classList.add("expand-collapsing");
            decks.forEach((deck) => deck.classList.remove("is-expanded"));
            document.body.classList.remove("expanded-view");
            document.body.classList.add("deck-view");
            requestAnimationFrame(function () {
              updateDeckScales();
              const saved = active ? localStorage.getItem(selectionKeyFor(active.dataset.deck)) : null;
              const order = orderMap[saved] || orderMap.yellow;
              if (active) setOrder(order, active);
              requestAnimationFrame(function () {
                setCardRectActiveDeckIndex(decks.indexOf(active));
                const titleToStates = getTitleStatesFromDOM();
                animateTitleOverlay(titleFromStates, titleToStates, 520);
                const toStates = getStatesForAllDecksForCollapse();
                animateCardRects(fromStates, toStates, 520, function () {
                  buildCardRectOverlay();
                  requestAnimationFrame(function () {
                    const states = getStatesForAllDecks("deck");
                    showCardRectFramework(states);
                    finish();
                  });
                });
              });
            });
          }
        }

        function runProjectExpandedTransition(toView) {
          const active = getActiveDeck();
          if (!active) {
            applyView(toView);
            return;
          }
          const activeIndex = decks.indexOf(active);
          syncTitleOverlayContent();
          const titleFromStates = toView === "project" ? getTitleFromStatesForDeckToProject(activeIndex) : getTitleStatesFromDOM();
          if (toView === "project") {
            const els = getTitleElements();
            if (els[0]) els[0].textContent = "Project";
          }
          showTitleOverlay(titleFromStates);
          const fromStates = toView === "project" ? getStatesForAllDecks("expanded") : getStatesForAllDecks("project");
          applyView(toView, toView === "project"
            ? { activeDeckIndexForLayer: activeIndex, skipTitleOverlayUpdate: true }
            : { skipCardRectUpdate: true, skipTitleOverlayUpdate: true });
          requestAnimationFrame(function () {
            const toStates = toView === "project" ? getStatesForAllDecks("project") : getStatesForAllDecks("expanded");
            if (toView === "expanded") setCardRectActiveDeckIndex(activeIndex);
            const titleElsExp = getTitleElements();
            if (toView === "expanded" && titleElsExp[activeIndex + 1]) titleElsExp[activeIndex + 1].textContent = getDeckTitleText(getActiveDeck());
            const titleToStates = toView === "project" ? getTitleStatesFromDOM() : getTitleToStatesForProjectToDeck(activeIndex);
            animateTitleOverlay(titleFromStates, titleToStates, 520);
            showCardRectFramework(fromStates);
            animateCardRects(fromStates, toStates, 520);
          });
        }

        /* ---------- Deck proxy: independent DOM representation for transitions ---------- */
        const PROXY_CONTENT_WIDTH = 1200;
        const PROXY_CONTENT_HEIGHT = 728;

        function getDeckProxy() {
          return document.getElementById("deckProxy");
        }

        function buildDeckProxy(deck) {
          const proxy = getDeckProxy();
          if (!proxy) return;
          const viewport = deck.querySelector(".deck-viewport");
          if (!viewport) return;
          proxy.innerHTML = "";
          proxy.appendChild(viewport.cloneNode(true));
        }

        function clearDeckProxy() {
          const proxy = getDeckProxy();
          if (!proxy) return;
          proxy.classList.remove("is-active");
          proxy.innerHTML = "";
          proxy.style.transform = "";
        }

        function runProxyTransition(fromRect, toRect, durationMs, onDone) {
          const proxy = getDeckProxy();
          if (!proxy) {
            if (onDone) onDone();
            return;
          }
          const scaleX = (v) => v / PROXY_CONTENT_WIDTH;
          const scaleY = (v) => v / PROXY_CONTENT_HEIGHT;
          proxy.style.transform =
            "translate(" + fromRect.left + "px," + fromRect.top + "px) scale(" + scaleX(fromRect.width) + "," + scaleY(fromRect.height) + ")";
          proxy.classList.add("is-active");
          const anim = proxy.animate(
            [
              {
                transform: "translate(" + fromRect.left + "px," + fromRect.top + "px) scale(" + scaleX(fromRect.width) + "," + scaleY(fromRect.height) + ")",
              },
              {
                transform: "translate(" + toRect.left + "px," + toRect.top + "px) scale(" + scaleX(toRect.width) + "," + scaleY(toRect.height) + ")",
              },
            ],
            { duration: durationMs, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "both" }
          );
          anim.onfinish = () => {
            proxy.classList.remove("is-active");
            proxy.innerHTML = "";
            proxy.style.transform = "";
            document.body.classList.remove("deck-proxy-animating");
            if (onDone) onDone();
          };
          anim.oncancel = () => {
            proxy.classList.remove("is-active");
            proxy.innerHTML = "";
            proxy.style.transform = "";
            document.body.classList.remove("deck-proxy-animating");
            if (onDone) onDone();
          };
        }

        /* ---------- Card rect framework: position, scale, transparency per card ---------- */
        const CARD_RECT_WIDTH = 1200;
        const CARD_RECT_HEIGHT = 728; /* wire frame = tab + .card (53+675), matches old card bottom edge */
        const CARD_RECT_INDICES = [0, 1, 2];

        function cardRectState(x, y, scaleX, scaleY, opacity) {
          return { x: x, y: y, scaleX: scaleX, scaleY: scaleY, opacity: opacity != null ? opacity : 1 };
        }

        function getCardRectOverlay() {
          return document.getElementById("cardRectOverlay");
        }

        function buildCardRectOverlay() {
          // __deck_rect_build
          const overlay = getCardRectOverlay();
          if (!overlay) return;
          overlay.innerHTML = "";
          const deckList = Array.from(document.querySelectorAll(".deck"));
          deckList.forEach(function (deck, deckIndex) {
            CARD_RECT_INDICES.forEach(function (cardIndex) {
              const rect = document.createElement("div");
              rect.className = "card-rect";
              rect.setAttribute("data-deck-index", String(deckIndex));
              rect.setAttribute("data-index", String(cardIndex));
              // Host cards from all three decks; built from data (no deck clones).
              if (deckIndex === 0 || deckIndex === 1 || deckIndex === 2) {
                const deckData = decksData && decksData.find((d) => d.id === deck.dataset.deck);
                const cardData = deckData && deckData.cards && deckData.cards[cardIndex];
                if (cardData) {
                  const color = ["yellow", "red", "green"][cardIndex];
                  const host = buildCardLayer(layerLayouts[cardIndex], cardData, deckData.id, cardIndex);
                  host.classList.add("card-layer--overlay");
                  rect.appendChild(host);
                  applyLineNumbersInRoot(host);
                  setupCardTextEditing();
                  setupCardTabAndTitleEditing();
                  host.querySelectorAll(".tab").forEach((tab) => {
                    tab.addEventListener("click", (e) => {
                      // __deck_tab_promote
                      if (!document.body.classList.contains("deck-view") && !document.body.classList.contains("expanded-view")) return;
                      const active = getActiveDeck();
                      if (!active || deck !== active) return;
                      /* Don't stopPropagation: allow overlay handler to run so tab click promotes */
                      promote(color, deck);
                      setCardRectActiveDeckIndex(deckIndex);
                      if (document.body.classList.contains("expanded-view")) {
                        const expandedStates = getStatesForAllDecks("expanded");
                        showCardRectFramework(expandedStates);
                        requestAnimationFrame(function () {
                          requestAnimationFrame(function () { setView("deck"); });
                        });
                      } else {
                        const states = getStatesForAllDecks("deck");
                        showCardRectFramework(states);
                      }
                    });
                  });
                  host.querySelectorAll(".card-text-image").forEach((img) => {
                    img.addEventListener("click", (e) => {
                      // __ux_lightbox_image_click
                      if (document.body.classList.contains("project-view")) return;
                      e.stopPropagation();
                      openImageLightbox(img.src, img.alt);
                    });
                  });
                }
              }
              overlay.appendChild(rect);
            });
          });
          requestAnimationFrame(updateAllTabOffsets);
        }

        function getCardRects() {
          const overlay = getCardRectOverlay();
          if (!overlay) return [];
          return Array.from(overlay.querySelectorAll(".card-rect"));
        }

        /**
         * Single source of truth for "where the three card rectangles go in deck (stacked) view."
         * Uses the same layout as the real deck: content 1200x808, tab 53px from top, STACK_OFFSETS.
         * Positions are assigned by stack order: front=lowest (0,0), middle, back=highest.
         * order = [front, middle, back]; each color gets STACK_OFFSETS[order.indexOf(color)].
         */
        function getStackedStatesFromViewport(deck) {
          // __deck_stack_layout_get
          const vp = deck && deck.querySelector(".deck-viewport");
          if (!vp) return CARD_RECT_INDICES.map(() => cardRectState(0, 0, 0, 0, 0));
          const saved = deck ? localStorage.getItem(selectionKeyFor(deck.dataset.deck)) : null;
          const order = orderMap[saved] || orderMap.yellow;
          const r = vp.getBoundingClientRect();
          let scale = Math.min(r.width / DECK_CONTENT_WIDTH, r.height / DECK_CONTENT_HEIGHT);
          scale *= DECK_VIEW_SCALE;
          const contentW = DECK_CONTENT_WIDTH * scale;
          const contentH = DECK_CONTENT_HEIGHT * scale;
          const card0X = r.left + (r.width - contentW) / 2;
          const card0Y = r.top + (r.height - contentH) / 2 + DECK_TAB_OFFSET * scale;
          const colors = ["yellow", "red", "green"];
          return colors.map(function (color) {
            const posInOrder = order.indexOf(color);
            const o = STACK_OFFSETS[posInOrder >= 0 ? posInOrder : 0];
            return cardRectState(card0X + o.x * scale, card0Y + o.y * scale, scale, scale, 1);
          });
        }

        function getStackedLayoutStates() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const centerX = w / 2;
          const centerY = h / 2;
          const margin = 48;
          const scale = Math.min((w - 2 * margin) / CARD_RECT_WIDTH, (h - 2 * margin) / CARD_RECT_HEIGHT);
          const x = centerX - (CARD_RECT_WIDTH * scale) / 2;
          const y = centerY - (CARD_RECT_HEIGHT * scale) / 2;
          const s = cardRectState(x, y, scale, scale, 1);
          return [s, s, s];
        }

        function getExpandedLayoutStates(deck) {
          // __view_expanded_layout_get
          const w = window.innerWidth;
          const h = window.innerHeight;
          const margin = 24;
          const gap = 16;
          const marginAboveHorizon = 16;
          const marginBelowHorizon = 16;
          let safeTop = margin;
          if (typeof pageTitle !== "undefined" && pageTitle) {
            const titleRect = pageTitle.getBoundingClientRect();
            safeTop = Math.max(margin, titleRect.bottom + 16);
          }
          const horizonY = h / 2;
          const topAvailableH = horizonY - safeTop - marginAboveHorizon;
          const bottomAvailableH = h - horizonY - marginBelowHorizon - marginAboveHorizon;
          const availableW = w - 2 * margin;
          const scaleFromTop = Math.min(availableW / CARD_RECT_WIDTH, topAvailableH / CARD_RECT_HEIGHT);
          const scaleFromBottom = Math.min((availableW - gap) / (2 * CARD_RECT_WIDTH), bottomAvailableH / CARD_RECT_HEIGHT);
          const scale = Math.min(scaleFromTop, scaleFromBottom);
          const cardW = CARD_RECT_WIDTH * scale;
          const cardH = CARD_RECT_HEIGHT * scale;
          const card0X = margin + (availableW - cardW) / 2;
          const card0Y = safeTop + (topAvailableH - cardH) / 2;
          const bottomRowWidth = cardW * 2 + gap;
          const card1X = margin + (availableW - bottomRowWidth) / 2;
          const card2X = card1X + cardW + gap;
          const cardsBottomY = horizonY + marginAboveHorizon;
          const card1Y = cardsBottomY + (bottomAvailableH - cardH) / 2;
          const topState = cardRectState(card0X, card0Y, scale, scale, 1);
          const bottomLeftState = cardRectState(card1X, card1Y, scale, scale, 1);
          const bottomRightState = cardRectState(card2X, card1Y, scale, scale, 1);
          const saved = deck ? localStorage.getItem(selectionKeyFor(deck.dataset.deck)) : null;
          const order = orderMap[saved] || orderMap.yellow;
          const positions = [topState, bottomLeftState, bottomRightState];
          const colors = ["yellow", "red", "green"];
          return colors.map(function (color) {
            const posInOrder = order.indexOf(color);
            return positions[posInOrder >= 0 ? posInOrder : 0];
          });
        }

        /* Stack offsets: vertical only (down). Front=0; middle=-17; back=-34. No horizontal slide. */
        const STACK_OFFSETS = [
          { x: 0, y: 0 },
          { x: 0, y: -17 },
          { x: 0, y: -34 },
        ];
        const STACK_BOUNDS_WIDTH = CARD_RECT_WIDTH;
        const STACK_BOUNDS_HEIGHT = 34 + CARD_RECT_HEIGHT;

        /** Deck content size and tab offset: must match CSS --deck-content-height and --tab-height (808 = 755+53). */
        const DECK_CONTENT_WIDTH = 1200;
        const DECK_CONTENT_HEIGHT = 808;
        const DECK_TAB_OFFSET = 53;
        /** Scale down cards in deck view so the deck title above them stays visible (all deck views). */
        const DECK_VIEW_SCALE = 0.9;

        function getStatesForDeck(deck, view) {
          // __view_state_deck_get
          if (view === "project") {
            const vp = deck && deck.querySelector(".deck-viewport");
            if (!vp) return CARD_RECT_INDICES.map(() => cardRectState(0, 0, 0, 0, 0));
            const saved = deck ? localStorage.getItem(selectionKeyFor(deck.dataset.deck)) : null;
            const order = orderMap[saved] || orderMap.yellow;
            const r = vp.getBoundingClientRect();
            const scale = Math.min(r.width / STACK_BOUNDS_WIDTH, r.height / STACK_BOUNDS_HEIGHT);
            const stackW = STACK_BOUNDS_WIDTH * scale;
            const stackH = STACK_BOUNDS_HEIGHT * scale;
            const card0X = r.left + (r.width - stackW) / 2;
            const card0Y = r.top + (r.height - stackH) / 2 + 34 * scale;
            const colors = ["yellow", "red", "green"];
            return colors.map(function (color) {
              const posInOrder = order.indexOf(color);
              const o = STACK_OFFSETS[posInOrder >= 0 ? posInOrder : 0];
              return cardRectState(card0X + o.x * scale, card0Y + o.y * scale, scale, scale, 1);
            });
          }
          if (view === "deck") return getStackedStatesFromViewport(deck);
          if (view === "expanded") return getExpandedLayoutStates(deck);
          return CARD_RECT_INDICES.map(() => cardRectState(0, 0, 0, 0, 0));
        }

        let lastStackedStates = null;
        let lastProjectStatesByDeckIndex = [];
        // Full flattened card-rect states for all decks in deck view,
        // captured right before expanding so we can collapse back to
        // that exact physical configuration (positions/scale/opacity).
        let lastDeckViewStates = null;

        function getStatesForAllDecks(view) {
          // __view_state_list_get
          const active = getActiveDeck();
          const flat = [];
          decks.forEach(function (deck, deckIndex) {
            const isActive = deck === active;
            if (view === "project") {
              const projectStates = getStatesForDeck(deck, "project");
              lastProjectStatesByDeckIndex[deckIndex] = projectStates;
              flat.push.apply(flat, projectStates);
            } else if (view === "deck") {
              if (isActive) {
                const stacked = getStatesForDeck(deck, "deck");
                lastStackedStates = stacked;
                flat.push.apply(flat, stacked);
              } else {
                const center = getViewportCenter();
                flat.push.apply(flat, getRecedeStatesForDeck(center));
              }
            } else if (view === "expanded") {
              if (isActive) flat.push.apply(flat, getStatesForDeck(deck, "expanded"));
              else {
                const center = getViewportCenter();
                flat.push.apply(flat, getRecedeStatesForDeck(center));
              }
            } else {
              flat.push.apply(flat, lastProjectStatesByDeckIndex[deckIndex] || getStatesForDeck(deck, "project"));
            }
          });
          return flat;
        }

        /** Deck-view states for collapse: use viewport-based stacked positions so we don't read layer rects mid-transition. */
        function getStatesForAllDecksForCollapse() {
          // __view_expanded_collapse_get
          const active = getActiveDeck();
          const center = getViewportCenter();
          const flat = [];
          decks.forEach(function (deck) {
            if (deck === active) {
              flat.push.apply(flat, getStackedStatesFromViewport(deck));
            } else {
              flat.push.apply(flat, getRecedeStatesForDeck(center));
            }
          });
          return flat;
        }

        function getViewportCenter() {
          return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        }

        function getRecedeStatesForDeck(center) {
          const recedeState = cardRectState(center.x, center.y, 0, 0, 0);
          return [recedeState, recedeState, recedeState];
        }

        function getStatesForAllDecksProjectToDeck() {
          // __view_transition_project_deck_get
          const active = getActiveDeck();
          const center = getViewportCenter();
          const flat = [];
          decks.forEach(function (deck) {
            if (deck === active) {
              const stacked = getStatesForDeck(deck, "deck");
              lastStackedStates = stacked;
              flat.push.apply(flat, stacked);
            } else {
              flat.push.apply(flat, getRecedeStatesForDeck(center));
            }
          });
          return flat;
        }

        // Current visual states while in deck view (stacked or expanded):
        // - Active deck: real deck or expanded layout
        // - Other decks: receded to center (shrunken)
        function getStatesForAllDecksCurrentInDeckView() {
          // __view_state_current_get
          const active = getActiveDeck();
          const center = getViewportCenter();
          const flat = [];
          const isExpanded = document.body.classList.contains("expanded-view");
          decks.forEach(function (deck) {
            if (deck === active) {
              const view = isExpanded ? "expanded" : "deck";
              flat.push.apply(flat, getStatesForDeck(deck, view));
            } else {
              flat.push.apply(flat, getRecedeStatesForDeck(center));
            }
          });
          return flat;
        }

        function getFrontCardIndexForDeck(deck) {
          if (!deck) return 0;
          const saved = localStorage.getItem(selectionKeyFor(deck.dataset.deck));
          const order = orderMap[saved] || orderMap.yellow;
          const colorToIndex = { yellow: 0, red: 1, green: 2 };
          return colorToIndex[order[0]] || 0;
        }

        function setCardRectActiveDeckIndex(activeDeckIndex, frontCardIndex) {
          // __deck_active_index_set
          const overlay = getCardRectOverlay();
          if (!overlay) return;
          overlay.dataset.activeDeckIndex = String(activeDeckIndex);
          const rects = getCardRects();
          const deck = decks[activeDeckIndex];
          const colorToIndex = { yellow: 0, red: 1, green: 2 };
          const saved = deck ? localStorage.getItem(selectionKeyFor(deck.dataset.deck)) : null;
          const order = orderMap[saved] || orderMap.yellow;
          const frontIndex = colorToIndex[order[0]];
          const secondIndex = colorToIndex[order[1]];
          const backIndex = colorToIndex[order[2]];
          rects.forEach(function (rect) {
            const di = rect.getAttribute("data-deck-index");
            const cardIndex = parseInt(rect.getAttribute("data-index"), 10);
            if (di !== String(activeDeckIndex)) {
              rect.style.zIndex = 1;
            } else {
              if (cardIndex === frontIndex) rect.style.zIndex = 3;
              else if (cardIndex === secondIndex) rect.style.zIndex = 2;
              else rect.style.zIndex = 1;
            }
          });
        }

        function setProjectStackOrder(activeDeckIndexForLayer) {
          // __view_project_stack_set
          const rects = getCardRects();
          const colorToIndex = { yellow: 0, red: 1, green: 2 };
          const n = decks.length;
          const activeBase = (activeDeckIndexForLayer != null) ? n * 3 + 1 : -1;
          decks.forEach(function (deck, deckIndex) {
            const saved = localStorage.getItem(selectionKeyFor(deck.dataset.deck));
            const order = orderMap[saved] || orderMap.yellow;
            const frontIndex = colorToIndex[order[0]];
            const secondIndex = colorToIndex[order[1]];
            const backIndex = colorToIndex[order[2]];
            const base = deckIndex * 3;
            const isActiveDeck = (deckIndex === activeDeckIndexForLayer);
            const deckZBase = isActiveDeck ? activeBase : (n - 1 - deckIndex) * 3 + 1;
            if (rects[base + backIndex]) rects[base + backIndex].style.zIndex = deckZBase + 1;
            if (rects[base + secondIndex]) rects[base + secondIndex].style.zIndex = deckZBase + 2;
            if (rects[base + frontIndex]) rects[base + frontIndex].style.zIndex = deckZBase + 3;

        function getStatesForView(view) {
          const active = getActiveDeck();
          if (view === "deck" && document.body.classList.contains("expanded-view")) {
            return lastStackedStates || getStatesForDeck(active, "deck");
          }
          if (view === "deck") {
            const states = getStatesForDeck(active, "deck");
            lastStackedStates = states;
            return states;
          }
          return getStatesForDeck(active, view);

        function applyCardRectState(el, state) {
          if (!el || !state) return;
          el.style.transform = "translate(" + state.x + "px," + state.y + "px) scale(" + state.scaleX + "," + state.scaleY + ")";
          const opacity = state.opacity != null ? state.opacity : 1;
          el.style.opacity = String(opacity);
          /* Receded rects (scale 0 or opacity 0) must not intercept clicks — they overlay the active deck */
          const isReceded = (state.scaleX === 0 && state.scaleY === 0) || opacity === 0;
          el.style.pointerEvents = isReceded ? "none" : "";
        }

        function applyCardRectStates(states) {
          const rects = getCardRects();
          states.forEach(function (s, i) {

        function animateCardRects(fromStates, toStates, durationMs, onDone) {
          // __view_rect_animate
