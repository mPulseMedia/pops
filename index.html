            if (onDone) onDone();
            return;
          }
          const duration = durationMs || 520;
          // Smooth, fast-out-slow-in easing: quick start, gentle settling.
          const easing = "cubic-bezier(0.215, 0.61, 0.355, 1)";
          const anims = rects.map(function (rect, i) {
            const from = fromStates[i];
            const to = toStates[i];
            return rect.animate(
              [
                {
                  transform: "translate(" + from.x + "px," + from.y + "px) scale(" + from.scaleX + "," + from.scaleY + ")",
                  opacity: from.opacity != null ? from.opacity : 1,
                },
                {
                  transform: "translate(" + to.x + "px," + to.y + "px) scale(" + to.scaleX + "," + to.scaleY + ")",
                  opacity: to.opacity != null ? to.opacity : 1,
                },
              ],
              { duration: duration, easing: easing, fill: "both" }
            );
          });
          Promise.all(anims.map(function (a) { return new Promise(function (res) { a.onfinish = res; }); })).then(function () {

        function showCardRectFramework(states) {

          if (!overlay) return;
          applyCardRectStates(states);
          overlay.classList.add("is-active");
          document.body.classList.add("card-rect-framework");
          if (document.body.classList.contains("deck-view") || document.body.classList.contains("expanded-view")) {
            const active = getActiveDeck();
            if (active) setCardRectActiveDeckIndex(decks.indexOf(active));
          }
        }

        function hideCardRectFramework() {
          const overlay = getCardRectOverlay();
          if (overlay) overlay.classList.remove("is-active");
          document.body.classList.remove("card-rect-framework");
        }

        /* ---------- Title overlay: persistent title objects (view + deck titles) ---------- */
        const TITLE_INDICES = { VIEW: 0, DECK_0: 1, DECK_1: 2, DECK_2: 3 };

        function titleRectState(x, y, scaleX, scaleY, opacity, fontSize) {
          const s = { x: x, y: y, scaleX: scaleX, scaleY: scaleY, opacity: opacity != null ? opacity : 1 };
          if (fontSize != null) s.fontSize = fontSize;
          return s;
        }

        function getTitleOverlay() {
          return document.getElementById("titleOverlay");
        }

        function getRecedeStateForTitle(center) {
          return titleRectState(center.x, center.y, 0, 0, 0, "0px");
        }

        function getComputedFontSize(el) {
          return el ? window.getComputedStyle(el).fontSize : "0px";
        }

        /** Read current DOM layout and return 4 title states (view + 3 deck titles).
         * In deck/expanded view, deck titles are hidden; return receded state. */
        function getTitleStatesFromDOM() {
          const center = getViewportCenter();
          const isDeckOrExpanded = document.body.classList.contains("deck-view") || document.body.classList.contains("expanded-view");
          const viewTitleState = pageTitle
            ? (function () {
                const r = pageTitle.getBoundingClientRect();
                const fs = getComputedFontSize(pageTitle);
                return titleRectState(r.left, r.top, r.width / (r.width || 1), r.height / (r.height || 1), 1, fs);
              })()
            : getRecedeStateForTitle(center);
          const deckStates = decks.map(function (deck) {
            if (isDeckOrExpanded) return getRecedeStateForTitle(center);
            const el = deck && deck.querySelector(".deck-title");
            if (!el) return getRecedeStateForTitle(center);
            const r = el.getBoundingClientRect();
            const fs = getComputedFontSize(el);
            return titleRectState(r.left, r.top, r.width / (r.width || 1), r.height / (r.height || 1), 1, fs);
          });
          while (deckStates.length < 3) deckStates.push(getRecedeStateForTitle(center));
          return [viewTitleState].concat(deckStates.slice(0, 3));
        }

        function getTitleElements() {
          const overlay = getTitleOverlay();
          if (!overlay) return [];
          return Array.from(overlay.querySelectorAll(".title-element"));
        }

        function applyTitleState(el, state) {
          if (!el || !state) return;
          el.style.transform = "translate(" + state.x + "px," + state.y + "px) scale(" + state.scaleX + "," + state.scaleY + ")";
          el.style.opacity = String(state.opacity != null ? state.opacity : 1);
          if (state.fontSize != null) el.style.fontSize = state.fontSize;
          el.style.pointerEvents = (state.opacity != null && state.opacity > 0) ? "auto" : "none";
        }

        function syncTitleOverlayContent() {
          const elements = getTitleElements();
          if (elements.length < 4) return;
          elements[0].textContent = pageTitle ? pageTitle.textContent : "Project";
          decks.forEach(function (deck, i) {
            const el = deck && deck.querySelector(".deck-title");
            if (elements[i + 1]) elements[i + 1].textContent = el ? el.textContent : "";
          });
        }

        /** For deck→project: Project returns from horizon; active deck title
         * animates from center to above its deck; other deck titles from receded. */
        function getTitleFromStatesForDeckToProject(activeDeckIndex) {
          const center = getViewportCenter();
          const receded = getRecedeStateForTitle(center);
          const fromStates = [receded, receded, receded, receded];
          if (pageTitle && activeDeckIndex >= 0 && activeDeckIndex < 3) {
            const r = pageTitle.getBoundingClientRect();
            const fs = getComputedFontSize(pageTitle);
            fromStates[activeDeckIndex + 1] = titleRectState(r.left, r.top, r.width / (r.width || 1), r.height / (r.height || 1), 1, fs);
          }
          return fromStates;
        }

        /** For project→deck: view title recedes, clicked deck title moves to center. */
        function getTitleToStatesForProjectToDeck(activeDeckIndex) {
          const center = getViewportCenter();
          const receded = getRecedeStateForTitle(center);
          const r = pageTitle.getBoundingClientRect();
          const fs = getComputedFontSize(pageTitle);
          const atCenter = titleRectState(r.left, r.top, r.width / (r.width || 1), r.height / (r.height || 1), 1, fs);
          const toStates = [receded, receded, receded, receded];
          toStates[activeDeckIndex + 1] = atCenter;
          return toStates;
        }

        function buildTitleOverlay() {
          const overlay = getTitleOverlay();
          if (!overlay) return;
          overlay.innerHTML = "";
          const labels = ["Project", "", "", ""];
          for (let i = 0; i < 4; i++) {
            const el = document.createElement("span");
            el.className = "title-element";
            el.setAttribute("data-index", String(i));
            el.textContent = labels[i];
            el.setAttribute("aria-hidden", "true");
            overlay.appendChild(el);
          }
          overlay.querySelector(".title-element[data-index='0']").addEventListener("click", function () {
            if (document.body.classList.contains("deck-view") || document.body.classList.contains("expanded-view")) {
              setView("project");
            }
          });
          [1, 2, 3].forEach(function (i) {
            const el = overlay.querySelector(".title-element[data-index='" + i + "']");
            if (!el) return;
            el.addEventListener("click", function () {
              if (!document.body.classList.contains("project-view")) return;
              const deck = decks[i - 1];
              if (deck) {
                setActiveDeck(deck.dataset.deck);
                setView("deck");
              }
            });
          });
        }

        function showTitleOverlay(states) {
          const overlay = getTitleOverlay();
          const elements = getTitleElements();
          if (!overlay || !states || states.length !== elements.length) return;
          states.forEach(function (s, i) {
            if (elements[i]) applyTitleState(elements[i], s);
          });
          overlay.classList.add("is-active");
          document.body.classList.add("title-overlay-active");
        }

        function animateTitleOverlay(fromStates, toStates, durationMs, onDone) {
          const overlay = getTitleOverlay();
          const elements = getTitleElements();
          if (!overlay || elements.length === 0 || fromStates.length !== elements.length || toStates.length !== elements.length) {
            if (onDone) onDone();
            return;
          }
          const duration = durationMs || 520;
          const easing = "cubic-bezier(0.215, 0.61, 0.355, 1)";
          const anims = elements.map(function (el, i) {
            const from = fromStates[i];
            const to = toStates[i];
            const fromFs = from.fontSize != null ? from.fontSize : getComputedFontSize(el);
            const toFs = to.fontSize != null ? to.fontSize : getComputedFontSize(el);
            const keyframes = [
              {
                transform: "translate(" + from.x + "px," + from.y + "px) scale(" + from.scaleX + "," + from.scaleY + ")",
                opacity: from.opacity != null ? from.opacity : 1,
                fontSize: fromFs,
              },
              {
                transform: "translate(" + to.x + "px," + to.y + "px) scale(" + to.scaleX + "," + to.scaleY + ")",
                opacity: to.opacity != null ? to.opacity : 1,
                fontSize: toFs,
              },
            ];
            return el.animate(keyframes, { duration: duration, easing: easing, fill: "both" });
          });
          Promise.all(anims.map(function (a) { return new Promise(function (res) { a.onfinish = res; }); })).then(function () {
            toStates.forEach(function (s, i) {
              if (elements[i]) applyTitleState(elements[i], s);
            });
            if (onDone) onDone();
          });
        }

        (function setupCardRectClicks() {
          // __ux_card_rect_click
          const overlay = getCardRectOverlay();
          if (!overlay) return;
          overlay.addEventListener("click", function (e) {
            const rect = e.target.closest(".card-rect[data-deck-index]");
            if (!rect) return;

            /* Project view: clicking any card rect opens that deck in deck view */
            if (document.body.classList.contains("project-view")) {
              e.preventDefault();
              e.stopPropagation();
              const deckIndex = parseInt(rect.getAttribute("data-deck-index"), 10);
              const deck = decks[deckIndex];
              if (deck) {
                setActiveDeck(deck.dataset.deck);
                setView("deck");
              }
              return;
            }

            if (!document.body.classList.contains("deck-view") && !document.body.classList.contains("expanded-view")) return;
            const active = getActiveDeck();
            if (!active || rect.getAttribute("data-deck-index") !== String(decks.indexOf(active))) return;
            e.preventDefault();
            e.stopPropagation();
            const idx = parseInt(rect.getAttribute("data-index"), 10);
            const color = ["yellow", "red", "green"][idx];
            if (color) {
              promote(color, active);
              const activeIndex = decks.indexOf(active);
              if (activeIndex >= 0) setCardRectActiveDeckIndex(activeIndex);
              if (document.body.classList.contains("expanded-view")) {
                const expandedStates = getStatesForAllDecks("expanded");
                showCardRectFramework(expandedStates);
                requestAnimationFrame(function () {
                  requestAnimationFrame(function () { setView("deck"); });
                });
              } else {
                const states = getStatesForAllDecks("deck");
                showCardRectFramework(states);
              }
            }
          });
        })();

        function applyView(view, options) {
          // __ux_view_apply
          options = options || {};
          document.body.classList.toggle("project-view", view === "project");
          document.body.classList.toggle("deck-view", view === "deck");
          document.body.classList.toggle("expanded-view", view === "expanded");
          pageTitle.textContent = view === "project" ? "Project" : getDeckTitleText(getActiveDeck()) || "Project";
          document.title = pageTitle.textContent;
          updateDeckScales();
          requestAnimationFrame(updateAllTabOffsets);
          decks.forEach((deck) => deck.classList.remove("is-expanded"));
          if (view === "deck" || view === "expanded") {
            clearDeckProxy();
            window.scrollTo(0, 0);
            const active = getActiveDeck();
            if (active && view === "expanded") active.classList.add("is-expanded");
          }
          if (!options.skipCardRectUpdate) {
            requestAnimationFrame(function () {
              const viewState = view === "project" ? "project" : (view === "expanded" ? "expanded" : "deck");
              const states = getStatesForAllDecks(viewState);
              showCardRectFramework(states);
              if (view === "project") {
                setProjectStackOrder(options.activeDeckIndexForLayer);
              } else {
                const active = getActiveDeck();
                if (active) setCardRectActiveDeckIndex(decks.indexOf(active));
              }
            });
          }
          if (!options.skipTitleOverlayUpdate && getTitleOverlay() && getTitleElements().length >= 4) {
            requestAnimationFrame(function () {
              syncTitleOverlayContent();
              showTitleOverlay(getTitleStatesFromDOM());
            });
          }
        }

        function setView(view) {
          // __ux_view_set
          if (view === "deck" || view === "expanded") lastProjectScroll = window.scrollY;
          localStorage.setItem(VIEW_KEY, view);
          const fromProject = document.body.classList.contains("project-view");
          const fromDeck = document.body.classList.contains("deck-view");
          const fromExpanded = document.body.classList.contains("expanded-view");

          if (fromProject && view === "deck") {
            runProjectDeckTransition("deck");
          } else if (fromProject && view === "expanded") {
            runProjectExpandedTransition("expanded");
          } else if (fromDeck && view === "project") {
            runProjectDeckTransition("project");
          } else if (fromDeck && view === "expanded") {
            runDeckExpandedTransition("expanded");
          } else if (fromExpanded && view === "project") {
            runProjectExpandedTransition("project");
          } else if (fromExpanded && view === "deck") {
            runDeckExpandedTransition("deck");
          } else {
            applyView(view);
          }

          if (view === "deck" || view === "expanded") window.scrollTo(0, 0);
          else requestAnimationFrame(() => window.scrollTo(0, lastProjectScroll));
        }

        const colorToIndex = { yellow: YELLOW_CARD_INDEX, red: RED_CARD_INDEX, green: GREEN_CARD_INDEX };

        function getFrontCardData() {
          const active = getActiveDeck();
          if (!active) return null;
          const deckId = active.dataset.deck;
          const deckData = decksData.find((d) => d.id === deckId);
          if (!deckData || !deckData.cards) return null;
          const saved = localStorage.getItem(selectionKeyFor(deckId));
          const order = orderMap[saved] || orderMap.yellow;
          const frontIndex = colorToIndex[order[0]];
          if (frontIndex === undefined) return null;
          return deckData.cards[frontIndex] || null;
        }

        function runFlipAnimation(active, startRect, endRect) {
          const dx = startRect.left - endRect.left;
          const dy = startRect.top - endRect.top;
          const scaleX = startRect.width / endRect.width;
          const scaleY = startRect.height / endRect.height;
          if (active._flipAnimation) {
            active._flipAnimation.cancel();
          }
          active.classList.add("is-animating");
          active.style.transformOrigin = "top left";
          const animation = active.animate(
            [
              { transform: `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})` },
              { transform: "translate(0px, 0px) scale(1, 1)" },
            ],
            { duration: 520, easing: "ease", fill: "both" }
          );
          active._flipAnimation = animation;
          animation.onfinish = () => {
            active.classList.remove("is-animating");
            active.style.transformOrigin = "";
            active._flipAnimation = null;
          };
          animation.oncancel = () => {
            active.classList.remove("is-animating");
            active.style.transformOrigin = "";
            active._flipAnimation = null;
          };
        }

        function runTitleFlip(startRect, endRect) {
          if (!pageTitle || !startRect || !endRect) return;
          const dx = startRect.left - endRect.left;
          const dy = startRect.top - endRect.top;
          const scaleX = startRect.width / endRect.width;
          const scaleY = startRect.height / endRect.height;
          const animation = pageTitle.animate(
            [
              { transform: `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})` },
              { transform: "translate(0px, 0px) scale(1, 1)" },
            ],
            { duration: 520, easing: "ease", fill: "both" }
          );
          animation.onfinish = () => {
            pageTitle.style.transform = "";
          };
          animation.oncancel = () => {
            pageTitle.style.transform = "";
          };
        }

          const state = window.__SAVED_STATE__;
          window.__SAVED_STATE__ = null;
          if (state.decks && state.decks.length > 0 && normalizeToDecksData({ decks: state.decks }) != null) {
            loadDecksFromData({ decks: state.decks }, false);
          } else {
            loadDeckData();
          }
        } else {
          loadDeckData();
        }
      })();
    </script>
