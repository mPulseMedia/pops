<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decks</title>
    <link rel="stylesheet" href="old/shared.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="mini-mode">
    <h1 class="page-title" id="pageTitle">All Projects</h1>
    <div class="mode-backdrop" id="modeBackdrop" aria-hidden="true"></div>
    <div class="image-lightbox" id="imageLightbox" aria-hidden="true">
      <img alt="" src="" />
    </div>
    <main class="decks" id="decksRoot" aria-label="Decks"></main>

    <script src="old/shared.js"></script>
    <script>
      PopsShared.setupAutoReload({ intervalMs: 4000, scrollKey: "scroll-index-card3" });
      (function () {
        const LINES_TOTAL = 20;
        const MODE_KEY = "index-card3-mode";
        const ACTIVE_KEY = "index-card3-active";
        const SELECT_KEY = "index-card3-selected";
        const EXPANDED_KEY = "index-card3-expanded";
        const IMAGE_LIGHTBOX_KEY = "index-card3-image-lightbox";
        const pageTitle = document.getElementById("pageTitle");
        const decksRoot = document.getElementById("decksRoot");
        const imageLightbox = document.getElementById("imageLightbox");
        const imageLightboxImg = imageLightbox ? imageLightbox.querySelector("img") : null;
        let lastMiniScroll = 0;

        /* Leftmost card is ALWAYS index 0 (yellow). Do not overwrite --card-left anywhere. */
        const LEFTMOST_CARD_INDEX = 0;
        const YELLOW_CARD_INDEX = LEFTMOST_CARD_INDEX;
        const RED_CARD_INDEX = 1;
        const GREEN_CARD_INDEX = 2;
        const BLUE_CARD_INDEX = 3;

        const layerLayouts = [
          {
            color: "yellow", /* ALWAYS leftmost: --card-left 0px must stay fixed */
            style:
              "--card-left: 0px; --card-top: 0px; --tab-offset-x: 50px; --tab-offset-y: -52px; --layer-z: 90; --text-list-top: 22px;",
          },
          {
            color: "red", /* second from left */
            style:
              "--card-left: 36px; --card-top: -17px; --tab-offset-x: 292px; --tab-offset-y: -52px; --layer-z: 70; --text-title-top: -32px; --text-list-top: 24px;",
          },
          {
            color: "green", /* third from left */
            style:
              "--card-left: 72px; --card-top: -34px; --tab-offset-x: 534px; --tab-offset-y: -52px; --layer-z: 50; --text-title-top: -32px; --text-list-top: 24px;",
          },
          {
            color: "blue", /* rightmost */
            style:
              "--card-left: 108px; --card-top: -51px; --tab-offset-x: 776px; --tab-offset-y: -52px; --layer-z: 30; --text-title-top: -32px; --text-list-top: 24px;",
          },
        ];

        /* Half a Chair's Worth: index 0 = yellow (leftmost), index 1 = red, then green, blue */
        const barbershopCards = [
          {
            tabLabel: "Basic<br />Information",
            title: "Basic Information",
            image: "png/half a chairs worth.png",
            imageAlt: "Half a Chair's Worth",
            items: [
              { text: "Title" },
              { text: "\"Half a Chair's Worth\"", classes: ["level-2"] },
              { text: "Old titles", classes: ["level-2"] },
              { text: "\"What We Know, How Do We Know It\"", classes: ["level-3"] },
              { text: "What is it", classes: ["section"] },
              { text: "Amusing dialog on a heavy subject", classes: ["level-2"] },
              { text: "Message", classes: ["section"] },
              { text: "Know thy self", classes: ["level-2"] },
            ],
          },
          {
            tabLabel: "Main<br />Characters",
            title: "Main Characters",
            image: "png/vision.png",
            imageAlt: "Vision",
            imageClass: "card-text-image-small card-text-image-narrow",
            items: [
              { text: "George Weatherby" },
              {
                text: "Poetic, \"by the time we published this book, people won't be reading books anymore.\"",
                classes: ["level-2"],
              },
              { text: "Bad barber", classes: ["level-2"] },
              { text: "Aubrey Frick", classes: ["section"] },
              { text: "Practical, \"nobody cares anyway.\" Has Bad haircut.", classes: ["level-2"] },
              { text: "Has Deep cut in conscience", classes: ["level-2"] },
              { text: "Commonalities", classes: ["section"] },
              { text: "Assistant professors of mathematics (cover for math).", classes: ["level-2"] },
              { text: "Floridian", classes: ["level-2"] },
              { text: "40 year olds", classes: ["level-2"] },
              {
                text: "Don't speak Spanish, likely not Cuban, white vs Indian debate (undecided).",
                classes: ["level-2"],
              },
              { text: "Will misinformed and lie while deciding", classes: ["level-2"] },
            ],
          },
          {
            tabLabel: "Setting<br />&amp; Story",
            title: "Setting & Story",
            image: "png/shape.png",
            imageAlt: "Story shape",
            imageClass: "card-text-image-small card-text-image-narrow",
            items: [
              { text: "Setting" },
              { text: "Cuba, before Castro died", classes: ["level-2"] },
              { text: "One barbershop chair (half a chair's worth)", classes: ["level-2"] },
              { text: "Missed cruise return; ship flagged Uganda; seven years", classes: ["level-2"] },
              { text: "Setup", classes: ["section"] },
              { text: "Aubrey's adult child (20) is visiting", classes: ["level-2"] },
              { text: "He prepares the wisdom he'll say", classes: ["level-2"] },
              {
                text: "Issue (missed cruise or weren't allowed back; got drunk/drugged/illegal; may not be revealed early)",
                classes: ["level-2"],
              },
              { text: "Story flow", classes: ["section"] },
              { text: "Action rises, drops, then spikes at end", classes: ["level-2"] },
              { text: "Decide peak and trough", classes: ["level-2"] },
              { text: "By Act 1 Scene 1 end, we know who they are", classes: ["level-2"] },
            ],
          },
          {
            tabLabel: "Script<br />Snippets",
            title: "Script Snippets",
            items: [
              { text: "In the chair, Aubrey checks the mirror and avoids eye contact" },
              { text: "\"If I stare too long, I start to see the questions.\"", classes: ["level-2"] },
              { text: "George polishes the clippers and stalls for time", classes: ["section"] },
              { text: "\"A sharp edge helps, but it doesn't make a decision for you.\"", classes: ["level-2"] },
              { text: "The shop goes quiet as the cruise story hangs in the air", classes: ["section"] },
              { text: "\"Seven years is a long time to wait for a boat that won't return.\"", classes: ["level-2"] },
            ],
          },
        ];

        const emptyCards = layerLayouts.map(() => ({
          tabLabel: "",
          title: "",
          items: [],
        }));

        /* Away We Go deck: index 0 = yellow card, index 1 = red, index 2 = green, index 3 = blue */
        const awayWeGoCards = layerLayouts.map((layout, index) => {
          if (index === YELLOW_CARD_INDEX) {
            return {
              tabLabel: "Herodotus",
              title: "Herodotus",
              items: [
                { text: "The Greek historian Herodotus believed that we are what we do, not what we say.", classes: ["level-2"] },
                { text: "According to him, our worth does not rely upon our appearance or the wardrobe we carry.", classes: ["level-2"] },
                { text: "Furthermore, our evaluation of moral behavior sometimes lies outside the scope of due diligence.", classes: ["level-2"] },
                { text: "The inevitability of conflict was evident from the start.", classes: ["level-2"] },
              ],
            };
          }
          if (index === RED_CARD_INDEX) {
            return {
              tabLabel: "Example",
              title: "Example",
              items: [
                { text: "A story comes to mind from my operations days at AT&T in which I ran into a clash of cultures that caused confusion daily.", classes: ["level-2"] },
                { text: "For example, a driver was sent to our location in West Virginia in a super-long limousine, inappropriate in scruffy West Virginia.", classes: ["level-2"] },
                { text: "I could not convince the driver that money was not the sole criteria for evaluation.", classes: ["level-2"] },
                { text: "\"It's free. They give you the limo for free!\"", classes: ["level-2"] },
                { text: "Again and again, she demonstrated that money was the only criteria she considered.", classes: ["level-2"] },
              ],
            };
          }
          if (index === GREEN_CARD_INDEX) {
            return {
              tabLabel: "Conflicts",
              title: "Conflicts",
              items: [
                { text: "Conflicts are inevitable; we all have to navigate backgrounds and situations in the early part of our career.", classes: ["level-2"] },
                { text: "There are differences in the meaning of words, phrases, and gestures.", classes: ["level-2"] },
                { text: "It takes repetition to wipe out the past.", classes: ["level-2"] },
              ],
            };
          }
          return { tabLabel: "", title: "", items: [] };
        });

        const decksData = [
          {
            id: "barbershop",
            title: "Half a Chair's Worth",
            miniTitle: "Half a Chair's Worth",
            isActive: true,
            cards: barbershopCards,
          },
          {
            id: "new",
            title: "Away We Go",
            miniTitle: "Away We Go",
            isActive: false,
            cards: awayWeGoCards,
          },
          {
            id: "third",
            title: "3",
            miniTitle: "", /* no name: All Projects shows only "3)" */
            isActive: false,
            cards: emptyCards,
          },
        ];

        function createEl(tag, className, text) {
          const el = document.createElement(tag);
          if (className) {
            el.className = className;
          }
          if (text != null) {
            el.textContent = text;
          }
          return el;
        }

        function buildLines(container) {
          const red = createEl("span", "line red");
          red.style.top = "var(--line-offset)";
          container.appendChild(red);
          for (let i = 1; i < LINES_TOTAL; i += 1) {
            const line = createEl("span", "line blue");
            line.style.top = `calc(var(--line-offset) + var(--line-gap) * ${i})`;
            container.appendChild(line);
          }
        }

        function buildTextList(items) {
          const list = createEl("div", "card-text-list");
          items.forEach((item) => {
            const entry = createEl("div", "card-text-item", item.text);
            if (item.classes && item.classes.length) {
              entry.classList.add(...item.classes);
            }
            list.appendChild(entry);
          });
          return list;
        }

        function buildCardLayer(layerConfig, cardData) {
          const layer = createEl("div", "card-layer");
          layer.dataset.color = layerConfig.color;
          layer.setAttribute("style", layerConfig.style);

          const tab = createEl("div", `tab card-${layerConfig.color}-tab tab-label`);
          if (cardData.tabLabel) {
            tab.innerHTML = cardData.tabLabel;
          }

          const card = createEl("div", `card card-${layerConfig.color}-primary`);
          const lines = createEl("div", "card-lines");
          lines.setAttribute("aria-hidden", "true");
          buildLines(lines);

          const text = createEl("div", "card-text");
          const title = createEl("div", "card-text-title", cardData.title || "");
          const list = buildTextList(cardData.items || []);

          text.appendChild(title);
          if (cardData.image) {
            const img = createEl("img", "card-text-image");
            img.src = cardData.image;
            img.alt = cardData.imageAlt || "";
            if (cardData.imageClass) {
              cardData.imageClass.split(/\s+/).forEach((cls) => {
                if (cls) {
                  img.classList.add(cls);
                }
              });
            }
            text.classList.add("has-image");
            text.appendChild(img);
          }
          text.appendChild(list);
          card.appendChild(lines);
          card.appendChild(text);

          layer.appendChild(tab);
          layer.appendChild(card);
          return layer;
        }

        function openImageLightbox(src, alt) {
          if (!imageLightbox || !imageLightboxImg) return;
          imageLightboxImg.src = src;
          imageLightboxImg.alt = alt || "";
          imageLightbox.classList.add("open");
          imageLightbox.setAttribute("aria-hidden", "false");
          localStorage.setItem(IMAGE_LIGHTBOX_KEY, JSON.stringify({ open: true, src, alt: alt || "" }));
        }

        function closeImageLightbox() {
          if (!imageLightbox || !imageLightboxImg) return;
          imageLightbox.classList.remove("open");
          imageLightbox.setAttribute("aria-hidden", "true");
          imageLightboxImg.src = "";
          imageLightboxImg.alt = "";
          localStorage.setItem(IMAGE_LIGHTBOX_KEY, JSON.stringify({ open: false }));
        }

        function buildDeck(deckData, index) {
          const deck = createEl("div", "deck");
          if (deckData.isActive) {
            deck.classList.add("is-active");
          }
          deck.dataset.deck = deckData.id;
          deck.dataset.title = deckData.title || deckData.miniTitle || String(index + 1);

          const titleText = `${index + 1})${deckData.miniTitle ? " " + deckData.miniTitle : ""}`;
          const title = createEl("div", "deck-title", titleText);
          title.setAttribute("aria-hidden", "true");
          const expandToggle = createEl("button", "deck-expand-toggle");
          expandToggle.type = "button";
          expandToggle.setAttribute("aria-label", "Toggle expanded mode");

          const viewport = createEl("div", "deck-viewport");
          const scaleWrap = createEl("div", "deck-scale");
          const stackWrap = createEl("div", "deck-stack-wrap");
          const section = createEl("section", "card-scene");
          section.setAttribute("aria-label", `${deckData.title} deck`);
          const stack = createEl("div", "card-stack");

          deckData.cards.forEach((card, index) => {
            const layer = buildCardLayer(layerLayouts[index], card);
            stack.appendChild(layer);
          });

          section.appendChild(stack);
          stackWrap.appendChild(section);
          scaleWrap.appendChild(stackWrap);
          viewport.appendChild(scaleWrap);
          deck.appendChild(viewport);
          deck.appendChild(title);
          deck.appendChild(expandToggle);
          return deck;
        }

        decksData.forEach((deck, index) => {
          decksRoot.appendChild(buildDeck(deck, index));
        });

        const decks = Array.from(document.querySelectorAll(".deck"));

        function getActiveDeck() {
          return decks.find((deck) => deck.classList.contains("is-active")) || decks[0];
        }

        function selectionKeyFor(deckName) {
          return `${SELECT_KEY}-${deckName}`;
        }

        /* Slots set top + z only. Horizontal position is fixed: yellow always leftmost (0px), then red, green, blue. */
        const slots = {
          front: { cardTop: "0px", layerZ: 90 },
          yellow: { cardTop: "-8px", layerZ: 70 },
          green: { cardTop: "-16px", layerZ: 50 },
          back: { cardTop: "-24px", layerZ: 30 },
        };
        const tabOffsetY = -52;

        function buildLayerMap(deck) {
          const layerMap = {};
          deck.querySelectorAll(".card-layer").forEach((layer) => {
            layerMap[layer.dataset.color] = layer;
          });
          return layerMap;
        }

        function applyLayer(layer, slot) {
          if (!layer) return;
          layer.style.setProperty("--card-top", slot.cardTop);
          layer.style.setProperty("--layer-z", slot.layerZ);
          /* Do not set --card-left here: leftmost (yellow) must always stay at 0px */
        }

        function updateTabOffsets(layerMap, deck) {
          const card = deck.querySelector(".card");
          const cardWidth = card ? card.offsetWidth : window.innerWidth;
          const tabWidth = 235;
          const inset = Math.round(cardWidth * 0.04);
          const available = Math.max(cardWidth - tabWidth - inset * 2, 0);
          /* Order: yellow leftmost, then red, green, blue — tabs distributed evenly */
          const colors = ["yellow", "red", "green", "blue"];
          const n = colors.length;
          colors.forEach((color, index) => {
            const layer = layerMap[color];
            if (!layer) return;
            const left = n > 1 ? inset + (available * index) / (n - 1) : inset;
            layer.style.setProperty("--tab-offset-x", `${left}px`);
          });
        }

        function updateAllTabOffsets() {
          decks.forEach((deck) => {
            updateTabOffsets(buildLayerMap(deck), deck);
          });
        }

        function setOrder(order, deck) {
          const layerMap = buildLayerMap(deck);
          applyLayer(layerMap[order[0]], slots.front);
          applyLayer(layerMap[order[1]], slots.yellow); /* second position in fan */
          applyLayer(layerMap[order[2]], slots.green);
          applyLayer(layerMap[order[3]], slots.back);
          Object.values(layerMap).forEach((layer) => layer.classList.remove("is-front"));
          if (layerMap[order[0]]) {
            layerMap[order[0]].classList.add("is-front");
          }
          const cardStack = deck.querySelector(".card-stack");
          if (cardStack) {
            const minTop = Math.min(
              parseFloat(slots.front.cardTop) + tabOffsetY,
              parseFloat(slots.yellow.cardTop) + tabOffsetY,
              parseFloat(slots.green.cardTop) + tabOffsetY,
              parseFloat(slots.back.cardTop) + tabOffsetY
            );
            cardStack.style.setProperty("--stack-top-offset", `${-minTop}px`);
          }
          updateTabOffsets(layerMap, deck);
        }

        function applyLineNumbers() {
          document.querySelectorAll(".deck").forEach((deck) => {
            deck.querySelectorAll(".card-text-list").forEach((list) => {
              const sectionItems = Array.from(list.querySelectorAll(".card-text-item.section"));
              sectionItems.forEach((section) => {
                const prev = section.previousElementSibling;
                if (!prev || !prev.classList.contains("line-break")) {
                  const breakItem = document.createElement("div");
                  breakItem.className = "card-text-item line-break";
                  list.insertBefore(breakItem, section);
                }
              });

              const items = Array.from(list.querySelectorAll(".card-text-item"));
              const card = list.closest(".card");
              const maxLines = 18;
              const lineCount =
                Math.min(card?.querySelectorAll(".card-lines .line").length || items.length, maxLines);

              const numberColumn = document.createElement("div");
              numberColumn.className = "line-number-column";
              for (let lineIndex = 1; lineIndex <= lineCount; lineIndex += 1) {
                const row = document.createElement("div");
                row.className = "line-number-row";
                const number = document.createElement("span");
                number.className = "line-number";
                number.textContent = `${lineIndex}`;
                number.setAttribute("aria-hidden", "true");
                row.appendChild(number);
                numberColumn.appendChild(row);
              }

              const textColumn = document.createElement("div");
              textColumn.className = "line-text-column";
              const toRoman = (n) => {
                if (n < 1 || n > 20) return String(n);
                const map = [[10, "x"], [9, "ix"], [5, "v"], [4, "iv"], [1, "i"]];
                let s = "";
                for (const [val, sym] of map) {
                  while (n >= val) {
                    s += sym;
                    n -= val;
                  }
                }
                return s;
              };
              let topNum = 0;
              let level2Num = 0;
              let level3Num = 0;
              items.forEach((item) => {
                item.querySelectorAll(".alpha-marker").forEach((node) => node.remove());
                if (!item.classList.contains("line-break") && !item.querySelector(".bullet-marker")) {
                  let label;
                  if (item.classList.contains("level-3")) {
                    level3Num += 1;
                    label = toRoman(level3Num) + ")";
                  } else if (item.classList.contains("level-2")) {
                    level2Num += 1;
                    level3Num = 0;
                    label = String.fromCharCode(64 + level2Num) + ")";
                  } else {
                    topNum += 1;
                    level2Num = 0;
                    level3Num = 0;
                    label = `${topNum})`;
                  }
                  const bullet = document.createElement("span");
                  bullet.className = "bullet-marker";
                  bullet.textContent = label;
                  item.prepend(bullet);
                }
                textColumn.appendChild(item);
              });

              list.innerHTML = "";
              list.appendChild(numberColumn);
              list.appendChild(textColumn);
            });
          });
        }

        function readCssNumber(varName) {
          const raw = getComputedStyle(document.documentElement).getPropertyValue(varName);
          const value = Number.parseFloat(raw);
          return Number.isFinite(value) ? value : 0;
        }

        function updateDeckScales() {
          const baseWidth = readCssNumber("--card-base-width") || 1200;
          const baseHeight = (readCssNumber("--stack-base-height") || 755) + readCssNumber("--tab-height");
          const gap = readCssNumber("--expanded-gap") || 0;
          const expandedLift = readCssNumber("--expanded-lift") || 0;
          const topRowLift = readCssNumber("--expanded-top-row-lift") || 0;
          const bottomRowLift = readCssNumber("--expanded-bottom-row-lift") || 0;
          const buffer = readCssNumber("--expanded-buffer") || 0;
          document.documentElement.style.setProperty("--deck-content-width", `${baseWidth}px`);
          document.documentElement.style.setProperty("--deck-content-height", `${baseHeight}px`);

          decks.forEach((deck) => {
            const rect = deck.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) {
              return;
            }
            const scale = Math.min(rect.width / baseWidth, rect.height / baseHeight);
            deck.style.setProperty("--deck-scale", `${scale}`);
            const widthScale = (rect.width - gap) / (baseWidth * 2);
            const heightAvailable = rect.height - gap - topRowLift + bottomRowLift - buffer;
            const heightScale = heightAvailable / (baseHeight * 2);
            const expandedScale = Math.min(widthScale, heightScale);
            deck.style.setProperty("--expanded-scale", `${expandedScale}`);
            const stepX = baseWidth * expandedScale + gap;
            const stepY = baseHeight * expandedScale + gap;
            const totalW = baseWidth * expandedScale * 2 + gap;
            const offsetX = Math.max((rect.width - totalW) / 2, 0);
            const offsetY = deck.classList.contains("is-expanded") ? -expandedLift : 0;
            deck.style.setProperty("--expanded-step-x", `${stepX}px`);
            deck.style.setProperty("--expanded-step-y", `${stepY}px`);
            deck.style.setProperty("--expanded-offset-x", `${offsetX}px`);
            deck.style.setProperty("--expanded-offset-y", `${offsetY}px`);
          });
        }

        /* Order = [leftmost, …, rightmost]. Default: yellow (card 1) leftmost, blue rightmost. */
        const orderMap = {
          yellow: ["yellow", "red", "green", "blue"],
          red: ["red", "yellow", "green", "blue"],
          green: ["green", "red", "yellow", "blue"],
          blue: ["blue", "red", "yellow", "green"],
        };

        function promote(color, deckOverride) {
          const deck = deckOverride || getActiveDeck();
          const order = orderMap[color];
          if (order) {
            setOrder(order, deck);
            localStorage.setItem(selectionKeyFor(deck.dataset.deck), color);
          }
        }

        function setActiveDeck(id) {
          decks.forEach((deck) => {
            deck.classList.toggle("is-active", deck.dataset.deck === id);
          });
          localStorage.setItem(ACTIVE_KEY, id);
          updateDeckScales();
        }

        function setExpanded(isExpanded, animate = false) {
          const active = getActiveDeck();
          if (!active) {
            return;
          }
          localStorage.setItem(EXPANDED_KEY, isExpanded ? "1" : "0");
          const finish = () => {
            document.body.classList.remove("expand-animating", "expand-collapsing");
          };
          if (!animate) {
            decks.forEach((deck) => deck.classList.remove("is-expanded"));
            if (isExpanded) {
              active.classList.add("is-expanded");
            }
            document.body.classList.toggle("deck-expanded", isExpanded);
            finish();
            return;
          }

          if (isExpanded) {
            decks.forEach((deck) => deck.classList.remove("is-expanded"));
            document.body.classList.add("expand-animating");
            document.body.classList.add("deck-expanded");
            requestAnimationFrame(() => {
              active.classList.add("is-expanded");
              setTimeout(finish, 540);
            });
          } else {
            document.body.classList.add("expand-collapsing");
            const layers = Array.from(active.querySelectorAll(".card-layer"));
            layers.forEach((layer) => {
              const computed = getComputedStyle(layer).transform;
              layer.style.transform = computed === "none" ? "translate(0px, 0px) scale(1, 1)" : computed;
              layer.style.transformOrigin = "top left";
            });
            active.offsetWidth;
            active.classList.remove("is-expanded");
            requestAnimationFrame(() => {
              layers.forEach((layer) => {
                layer.style.transform = "translate(0px, 0px) scale(1, 1)";
              });
              setTimeout(() => {
                layers.forEach((layer) => {
                  layer.style.transform = "";
                  layer.style.transformOrigin = "";
                });
                document.body.classList.remove("deck-expanded");
                finish();
              }, 540);
            });
          }
        }

        function applyMode(mode) {
          document.body.classList.toggle("mini-mode", mode === "mini");
          document.body.classList.toggle("deck-mode", mode === "deck");
          if (mode !== "deck") {
            document.body.classList.remove("deck-expanded");
          }
          const title = mode === "mini" ? "All Projects" : getActiveDeck().dataset.title;
          pageTitle.textContent = title;
          document.title = title;
          updateDeckScales();
          requestAnimationFrame(() => {
            updateAllTabOffsets();
          });
          if (mode === "deck") {
            window.scrollTo(0, 0);
            const savedExpanded = localStorage.getItem(EXPANDED_KEY) === "1";
            setExpanded(savedExpanded, false);
          }
        }

        const colorToIndex = { yellow: YELLOW_CARD_INDEX, red: RED_CARD_INDEX, green: GREEN_CARD_INDEX, blue: BLUE_CARD_INDEX };

        function getFrontCardData() {
          const active = getActiveDeck();
          if (!active) return null;
          const deckId = active.dataset.deck;
          const deckData = decksData.find((d) => d.id === deckId);
          if (!deckData || !deckData.cards) return null;
          const saved = localStorage.getItem(selectionKeyFor(deckId));
          const order = orderMap[saved] || orderMap.yellow;
          const frontIndex = colorToIndex[order[0]];
          if (frontIndex === undefined) return null;
          return deckData.cards[frontIndex] || null;
        }

        function setMode(mode) {
          if (mode === "deck") {
            lastMiniScroll = window.scrollY;
          }
          localStorage.setItem(MODE_KEY, mode);
          if (mode === "mini") {
            animateActiveDeckToMini();
          } else {
            animateActiveDeckToDeck();
          }
          if (mode !== "deck") {
            setExpanded(false, false);
          }
          if (mode === "deck") {
            window.scrollTo(0, 0);
          } else {
            requestAnimationFrame(() => {
              window.scrollTo(0, lastMiniScroll);
            });
          }
        }

        function runFlipAnimation(active, startRect, endRect) {
          const dx = startRect.left - endRect.left;
          const dy = startRect.top - endRect.top;
          const scaleX = startRect.width / endRect.width;
          const scaleY = startRect.height / endRect.height;
          if (active._flipAnimation) {
            active._flipAnimation.cancel();
          }
          active.classList.add("is-animating");
          active.style.transformOrigin = "top left";
          const animation = active.animate(
            [
              { transform: `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})` },
              { transform: "translate(0px, 0px) scale(1, 1)" },
            ],
            { duration: 520, easing: "ease", fill: "both" }
          );
          active._flipAnimation = animation;
          animation.onfinish = () => {
            active.classList.remove("is-animating");
            active.style.transformOrigin = "";
            active._flipAnimation = null;
          };
          animation.oncancel = () => {
            active.classList.remove("is-animating");
            active.style.transformOrigin = "";
            active._flipAnimation = null;
          };
        }

        function animateActiveDeckToMini() {
          if (!document.body.classList.contains("deck-mode")) {
            applyMode("mini");
            return;
          }
          const active = getActiveDeck();
          if (!active) {
            applyMode("mini");
            return;
          }
          const startRect = active.getBoundingClientRect();
          applyMode("mini");
          requestAnimationFrame(() => {
            const endRect = active.getBoundingClientRect();
            runFlipAnimation(active, startRect, endRect);
          });
        }

        function animateActiveDeckToDeck() {
          if (!document.body.classList.contains("mini-mode")) {
            applyMode("deck");
            return;
          }
          const active = getActiveDeck();
          if (!active) {
            applyMode("deck");
            return;
          }
          const startRect = active.getBoundingClientRect();
          applyMode("deck");
          requestAnimationFrame(() => {
            const endRect = active.getBoundingClientRect();
            runFlipAnimation(active, startRect, endRect);
          });
        }

        decks.forEach((deck) => {
          const toggle = deck.querySelector(".deck-expand-toggle");
          if (toggle) {
            toggle.addEventListener("click", (event) => {
              event.stopPropagation();
              if (!document.body.classList.contains("deck-mode")) {
                return;
              }
              const nextExpanded = !deck.classList.contains("is-expanded");
              setExpanded(nextExpanded, true);
            });
          }
          const deckTitle = deck.querySelector(".deck-title");
          if (deckTitle) {
            deckTitle.addEventListener("click", (event) => {
              if (document.body.classList.contains("deck-mode")) {
                event.stopPropagation();
                setMode("mini");
                return;
              }
              event.stopPropagation();
              setActiveDeck(deck.dataset.deck);
              setMode("deck");
            });
          }
          deck.querySelectorAll(".card-text-image").forEach((img) => {
            img.addEventListener("click", (event) => {
              if (document.body.classList.contains("mini-mode")) {
                return;
              }
              event.stopPropagation();
              openImageLightbox(img.src, img.alt);
            });
          });
          deck.querySelectorAll(".card-layer").forEach((layer) => {
            const handleExpandPick = (event) => {
              if (!document.body.classList.contains("deck-mode")) {
                return;
              }
              if (!deck.classList.contains("is-expanded")) {
                return;
              }
              event.stopPropagation();
              const color = layer.dataset.color;
              if (color) {
                setExpanded(false, true);
                setTimeout(() => {
                  promote(color, deck);
                }, 520);
              }
            };
            layer.addEventListener("click", handleExpandPick);
            layer
              .querySelectorAll(".card, .tab")
              .forEach((el) => el.addEventListener("click", handleExpandPick));
          });
          ["yellow", "red", "green", "blue"].forEach((color) => {
            deck
              .querySelectorAll(
                `.card-layer[data-color='${color}'] .card, .card-layer[data-color='${color}'] .tab`
              )
              .forEach((el) => {
                el.addEventListener("click", (event) => {
                  event.stopPropagation();
                  if (document.body.classList.contains("mini-mode")) {
                    setActiveDeck(deck.dataset.deck);
                    setMode("deck");
                  }
                  promote(color, deck);
                });
              });
          });

          deck.addEventListener("click", () => {
            setActiveDeck(deck.dataset.deck);
            setMode("deck");
          });
        });

        pageTitle.addEventListener("click", () => {
          if (document.body.classList.contains("deck-mode")) {
            setMode("mini");
          }
        });

        document.addEventListener("click", (event) => {
          const rect = pageTitle.getBoundingClientRect();
          const pad = 24;
          const x = event.clientX;
          const y = event.clientY;
          const inside =
            x >= rect.left - pad &&
            x <= rect.right + pad &&
            y >= rect.top - pad &&
            y <= rect.bottom + pad;
          if (inside) {
            if (document.body.classList.contains("deck-mode")) {
              setMode("mini");
            }
          }
        });

        const modeBackdrop = document.getElementById("modeBackdrop");
        if (modeBackdrop) {
          modeBackdrop.addEventListener("click", () => {
            if (document.body.classList.contains("deck-mode")) {
              setMode("mini");
            }
          });
          modeBackdrop.addEventListener("touchend", () => {
            if (document.body.classList.contains("deck-mode")) {
              setMode("mini");
            }
          });
        }

        if (imageLightbox) {
          imageLightbox.addEventListener("click", () => {
            closeImageLightbox();
          });
        }

        const savedActive = localStorage.getItem(ACTIVE_KEY);
        if (savedActive) {
          setActiveDeck(savedActive);
        }

        const savedMode = localStorage.getItem(MODE_KEY) || "mini";
        applyMode(savedMode);
        if (savedMode === "mini") {
          requestAnimationFrame(() => {
            window.scrollTo(0, lastMiniScroll);
          });
        } else {
          window.scrollTo(0, 0);
        }

        try {
          const lightboxState = JSON.parse(localStorage.getItem(IMAGE_LIGHTBOX_KEY));
          if (lightboxState && lightboxState.open && lightboxState.src) {
            openImageLightbox(lightboxState.src, lightboxState.alt || "");
          }
        } catch {
          // ignore invalid state
        }

        applyLineNumbers();
        updateAllTabOffsets();
        updateDeckScales();
        requestAnimationFrame(() => {
          updateDeckScales();
          updateAllTabOffsets();
        });

        decks.forEach((deck) => {
          const saved = localStorage.getItem(selectionKeyFor(deck.dataset.deck));
          if (saved && orderMap[saved]) {
            setOrder(orderMap[saved], deck);
          } else {
            setOrder(orderMap.yellow, deck);
          }
        });

        let resizeFrame = null;
        window.addEventListener("resize", () => {
          if (resizeFrame) return;
          resizeFrame = requestAnimationFrame(() => {
            resizeFrame = null;
            updateDeckScales();
            updateAllTabOffsets();
          });
        });
      })();
    </script>
  </body>
</html>
