    <script>
      PopsShared.setupAutoReload({
        // __reload_ui_setup
        intervalMs: 4000,
        scrollKey: "scroll-index-card3",
        canReload: function () {
          if (localStorage.getItem("index-card3-auto-reload") !== "1") return false;
          if (window.__popsIsListening) return false;
          var el = document.activeElement;
          if (el && el.contentEditable === "true") return false;
          return true;
        }
      });
      (function () {
        const LINES_TOTAL = 13;
        const VIEW_KEY = "index-card3-view";
        const LEGACY_MODE_KEY = "index-card3-mode";
        const ACTIVE_KEY = "index-card3-active";
        const SELECT_KEY = "index-card3-selected";
        const EXPANDED_KEY = "index-card3-expanded";
        const IMAGE_LIGHTBOX_KEY = "index-card3-image-lightbox";
        const CARD_EDITS_KEY = "index-card3-card-edits";
        const ACTIVE_EDIT_KEY = "index-card3-active-edit";
        const CARD_ITEMS_KEY = "index-card3-card-items";
        const DATA_URL = "index.txt";
        const pageTitle = document.getElementById("pageTitle");
        const decksRoot = document.getElementById("decksRoot");
        const imageLightbox = document.getElementById("imageLightbox");
        const imageLightboxImg = imageLightbox ? imageLightbox.querySelector("img") : null;
        let lastProjectScroll = 0;

        /* Leftmost card is ALWAYS index 0 (yellow). Do not overwrite --card-left anywhere. */
        const LEFTMOST_CARD_INDEX = 0;
        const YELLOW_CARD_INDEX = LEFTMOST_CARD_INDEX;
        const RED_CARD_INDEX = 1;
        const GREEN_CARD_INDEX = 2;

        const layerLayouts = [
          {
            color: "yellow", /* ALWAYS leftmost: --card-left 0px must stay fixed */
            style:
              "--card-left: 0px; --card-top: 0px; --tab-offset-x: 50px; --tab-offset-y: -53px; --layer-z: 90; --text-list-top: 22px;",
          },
          {
            color: "red", /* second from left */
            style:
              "--card-left: 36px; --card-top: -17px; --tab-offset-x: 292px; --tab-offset-y: -53px; --layer-z: 70; --text-title-top: -32px; --text-list-top: 24px;",
          },
          {
            color: "green", /* third from left / rightmost */
            style:
              "--card-left: 72px; --card-top: -34px; --tab-offset-x: 534px; --tab-offset-y: -53px; --layer-z: 50; --text-title-top: -32px; --text-list-top: 24px;",
          },
        ];

        let decksData;
        let decks;

        // __spatial_registry
        var spatial_registry = {};

        /* DEPRECATED: prefer deck-data-embed. Kept as last-resort fallback. */
        const defaultBarbershopCards = [
          {
            tabLabel: "Basic<br />Information",
            title: "Basic Information",
            image: "png/half a chairs worth.png",
            imageAlt: "Half a Chair's Worth",
            items: [
              { text: "Title" },
              { text: "\"Half a Chair's Worth\"", classes: ["level-2"] },
              { text: "Old titles", classes: ["level-2"] },
              { text: "\"What We Know, How Do We Know It\"", classes: ["level-3"] },
              { text: "What is it", classes: ["section"] },
              { text: "Amusing dialog on a heavy subject", classes: ["level-2"] },
              { text: "Message", classes: ["section"] },
              { text: "Know thy self", classes: ["level-2"] },
            ],
          },
          {
            tabLabel: "Main<br />Characters",
            title: "Main Characters",
            image: "png/vision.png",
            imageAlt: "Vision",
            imageClass: "card-text-image-small card-text-image-narrow",
            items: [
              { text: "George Weatherby" },
              {
                text: "Poetic, \"by the time we published this book, people won't be reading books anymore.\"",
                classes: ["level-2"],
              },
              { text: "Bad barber", classes: ["level-2"] },
              { text: "Aubrey Frick", classes: ["section"] },
              { text: "Practical, \"nobody cares anyway.\" Has Bad haircut.", classes: ["level-2"] },
              { text: "Has Deep cut in conscience", classes: ["level-2"] },
              { text: "Commonalities", classes: ["section"] },
              { text: "Assistant professors of mathematics (cover for math).", classes: ["level-2"] },
              { text: "Floridian", classes: ["level-2"] },
              { text: "40 year olds", classes: ["level-2"] },
              {
                text: "Don't speak Spanish, likely not Cuban, white vs Indian debate (undecided).",
                classes: ["level-2"],
              },
              { text: "Will misinformed and lie while deciding", classes: ["level-2"] },
            ],
          },
          {
            tabLabel: "Setting<br />&amp; Story",
            title: "Setting & Story",
            image: "png/shape.png",
            imageAlt: "Story shape",
            imageClass: "card-text-image-small card-text-image-narrow",
            items: [
              { text: "Setting" },
              { text: "Cuba, before Castro died", classes: ["level-2"] },
              { text: "One barbershop chair (half a chair's worth)", classes: ["level-2"] },
              { text: "Missed cruise return; ship flagged Uganda; seven years", classes: ["level-2"] },
              { text: "Setup", classes: ["section"] },
              { text: "Aubrey's adult child (20) is visiting", classes: ["level-2"] },
              { text: "He prepares the wisdom he'll say", classes: ["level-2"] },
              {
                text: "Issue (missed cruise or weren't allowed back; got drunk/drugged/illegal; may not be revealed early)",
                classes: ["level-2"],
              },
              { text: "Story flow", classes: ["section"] },
              { text: "Action rises, drops, then spikes at end", classes: ["level-2"] },
              { text: "Decide peak and trough", classes: ["level-2"] },
              { text: "By Act 1 Scene 1 end, we know who they are", classes: ["level-2"] },
            ],
          },
        ];

        const emptyCards = layerLayouts.map(() => ({
          tabLabel: "",
          title: "",
          items: [],
        }));

        /* Deck 3 Comebacks: yellow card = Too cheap with "how's your mother" */
        const comebacksCards = [
          { tabLabel: "Too cheap", title: "Too cheap", items: [{ text: "how's your mother" }] },
          ...layerLayouts.slice(1).map(() => ({ tabLabel: "", title: "", items: [] })),
        ];

        /* Away We Go deck: index 0 = yellow, 1 = red, 2 = green. Fallback when index.txt missing. */
        const defaultAwayWeGoCards = layerLayouts.map((layout, index) => {
          if (index === YELLOW_CARD_INDEX) {
            return {
              tabLabel: "Herodotus",
              title: "Herodotus",
              items: [
                { text: "The Greek historian Herodotus believed that we are what we do, not what we say." },
                { text: "According to him, our worth does not rely upon our appearance or the wardrobe we carry." },
                { text: "Furthermore, our evaluation of moral behavior sometimes lies outside the scope of due diligence." },
                { text: "The inevitability of conflict was evident from the start." },
              ],
            };
          }
          if (index === RED_CARD_INDEX) {
            return {
              tabLabel: "Example",
              title: "Example",
              items: [
                { text: "A story comes to mind from my operations days at AT&T in which I ran into a clash of cultures that caused confusion daily." },
                { text: "For example, a driver was sent to our location in West Virginia in a super-long limousine, inappropriate in scruffy West Virginia." },
                { text: "I could not convince the driver that money was not the sole criteria for evaluation." },
                { text: "\"It's free. They give you the limo for free!\"" },
                { text: "Again and again, she demonstrated that money was the only criteria she considered." },
              ],
            };
          }
          if (index === GREEN_CARD_INDEX) {
            return {
              tabLabel: "Conflicts",
              title: "Conflicts",
              items: [
                { text: "Conflicts are inevitable; we all have to navigate backgrounds and situations in the early part of our career." },
                { text: "There are differences in the meaning of words, phrases, and gestures." },
                { text: "It takes repetition to wipe out the past." },
                { classes: ["line-break"] },
                { text: "He had a way that permitted, etc." },
              ],
            };
          }
          return { tabLabel: "", title: "", items: [] };
        });

        const defaultDecksData = [
          { id: "barbershop", title: "Half a Chair's Worth", miniTitle: "Half a Chair's Worth", isActive: true, cards: defaultBarbershopCards },
          { id: "new", title: "Away We Go", miniTitle: "Away We Go", isActive: false, cards: defaultAwayWeGoCards },
          { id: "third", title: "Title", miniTitle: "Title", isActive: false, cards: comebacksCards },
        ];

        // __deck_data_embed_get
        function deck_data_embed_get() {
          var el = document.getElementById("deck-data-embed");
          if (!el) return null;
          try { return JSON.parse(el.textContent); } catch (e) { return null; }
        }

        // __deck_data_normalize
        function deck_data_normalize(data) {
          if (data && Array.isArray(data.decks) && data.decks.length > 0) {
            return data.decks.map((d, i) => ({
              id: d.id != null ? d.id : "deck-" + i,
              title: d.title != null ? d.title : "",
              miniTitle: d.miniTitle != null ? d.miniTitle : (d.title != null ? d.title : ""),
              isActive: i === 0,
              cards: Array.isArray(d.cards) ? d.cards : [],
            }));
          }
          if (data && Array.isArray(data.barbershopCards) && Array.isArray(data.awayWeGoCards)) {
            return [
              { id: "barbershop", title: "Half a Chair's Worth", miniTitle: "Half a Chair's Worth", isActive: true, cards: data.barbershopCards },
              { id: "new", title: "Away We Go", miniTitle: "Away We Go", isActive: false, cards: data.awayWeGoCards },
              { id: "third", title: "Title", miniTitle: "Title", isActive: false, cards: (data.comebacksCards && Array.isArray(data.comebacksCards)) ? data.comebacksCards : comebacksCards },
            ];
          }
          return null;
        }

        function deck_data_render(data, fromFile) {
          // __deck_data_render
          const list = deck_data_normalize(data);
          var embedFallback = list == null ? deck_data_normalize(deck_data_embed_get()) : null;
          decksData = list != null ? list : (embedFallback != null ? embedFallback : defaultDecksData);
          item_store_apply(decksData);
          /* Apply stored deck title edits */
          decksData.forEach(function (d) {
            var saved = deck_title_edit_get(d.id);
            if (saved != null) { d.miniTitle = saved; d.title = saved; }
          });
          /* Do not clear CARD_EDITS_KEY so title/tab and item edits persist across reloads */
          while (decksRoot.firstChild) {
            decksRoot.removeChild(decksRoot.firstChild);
          }
          decksData.forEach((deck, index) => {
            decksRoot.appendChild(deck_build(deck, index));
          });
          decks = Array.from(document.querySelectorAll(".deck"));
          card_rect_overlay_build();
          title_rect_overlay_build();
          deck_init_run();
        }

        // __deck_source_set
        function deck_source_set(message) {
          const el = document.getElementById("deckDataSource");
          if (el) el.textContent = message ? ` ${message}` : "";
        }

        function deck_data_load() {
          // __deck_data_load
          var embedded = deck_data_embed_get();
          if (location.protocol === "file:") {
            deck_data_render(embedded, false);
            deck_source_set(embedded ? "(embedded data)" : "(file:// — click 📂 to load index.txt)");
            return;
          }
          const url = new URL(DATA_URL + "?t=" + Date.now(), location.href).href;
          fetch(url, { cache: "no-store" })
            .then((r) => (r.ok ? r.json() : Promise.reject()))
            .then((data) => {
              if (deck_data_normalize(data) != null) {
                deck_data_render(data, true);
                deck_source_set("(loaded from index.txt)");
              } else {
                deck_data_render(embedded, false);
                deck_source_set(embedded ? "(embedded data)" : "(using built-in data)");
              }
            })
            .catch(() => {
              deck_data_render(embedded, false);
              deck_source_set(embedded ? "(embedded data)" : "(reload failed — click 📂 to load index.txt)");
            });
        }

        function deck_data_reload() {
          // __deck_data_reload
          var embedded = deck_data_embed_get();
          const url = new URL(DATA_URL + "?t=" + Date.now(), location.href).href;
          fetch(url, { cache: "no-store" })
            .then((r) => (r.ok ? r.json() : Promise.reject()))
            .then((data) => {
              if (deck_data_normalize(data) != null) {
                deck_data_render(data, true);
                deck_source_set("(loaded from index.txt)");
              } else {
                deck_data_render(embedded, false);
                deck_source_set(embedded ? "(embedded data)" : "(reload failed; using built-in data)");
              }
            })
            .catch(() => {
              deck_data_render(embedded, false);
              deck_source_set(embedded ? "(embedded data)" : "(reload failed — use Load from file)");
            });
        }

        // __deck_data_file_load
        function deck_data_file_load(file) {
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              if (deck_data_normalize(data) != null) {
                deck_data_render(data, true);
                deck_source_set("(loaded from file)");
              } else {
                deck_source_set("(invalid format: need decks array or barbershopCards + awayWeGoCards)");
              }
            } catch (_) {
              deck_source_set("(invalid JSON)");
            }
          };
          reader.onerror = () => deck_source_set("(could not read file)");
          reader.readAsText(file);
        }

        // __el_create
        function el_create(tag, className, text) {
          const el = document.createElement(tag);
          if (className) {
            el.className = className;
          }
          if (text != null) {
            el.textContent = text;
          }
          return el;
        }

        // __card_line_build
        function card_line_build(container) {
          const red = el_create("span", "line red");
          red.style.top = "var(--line-offset)";
          container.appendChild(red);
          for (let i = 1; i < LINES_TOTAL; i += 1) {
            const line = el_create("span", "line blue");
            line.style.top = `calc(var(--line-offset) + var(--line-gap) * ${i})`;
            container.appendChild(line);
          }
        }

        // __item_store_get
        function item_store_get() {
          try {
            const raw = localStorage.getItem(CARD_ITEMS_KEY);
            return raw ? JSON.parse(raw) : {};
          } catch (_) {
            return {};
          }
        }
        // __item_store_save
        function item_store_save(deckId, cardIndex, items) {
          const stored = item_store_get();
          stored[deckId + "-" + cardIndex] = items.map(function (item) {
            return { text: item.text || "", classes: item.classes || [] };
          });
          localStorage.setItem(CARD_ITEMS_KEY, JSON.stringify(stored));
        }
        // __item_store_apply
        function item_store_apply(decksDataArr) {
          var stored = item_store_get();
          if (!stored || !Object.keys(stored).length) return;
          decksDataArr.forEach(function (deck) {
            if (!deck.cards) return;
            deck.cards.forEach(function (card, ci) {
              var key = deck.id + "-" + ci;
              if (stored[key]) {
                card.items = stored[key];
              }
            });
          });
        }

        // __edit_store_get
        function edit_store_get() {
          try {
            const raw = localStorage.getItem(CARD_EDITS_KEY);
            return raw ? JSON.parse(raw) : {};
          } catch (_) {
            return {};
          }
        }
        // __item_text_get
        function item_text_get(deckId, cardIndex, itemIndex) {
          const key = `${deckId}-${cardIndex}-${itemIndex}`;
          return edit_store_get()[key];
        }
        // __item_text_save
        function item_text_save(deckId, cardIndex, itemIndex, text) {
          const edits = edit_store_get();
          edits[`${deckId}-${cardIndex}-${itemIndex}`] = text;
          localStorage.setItem(CARD_EDITS_KEY, JSON.stringify(edits));
        }
        // __tab_text_get
        function tab_text_get(deckId, cardIndex) {
          return edit_store_get()[`${deckId}-${cardIndex}-tabLabel`];
        }
        // __tab_text_save
        function tab_text_save(deckId, cardIndex, text) {
          const edits = edit_store_get();
          edits[`${deckId}-${cardIndex}-tabLabel`] = text;
          localStorage.setItem(CARD_EDITS_KEY, JSON.stringify(edits));
        }
        // __card_title_get
        function card_title_get(deckId, cardIndex) {
          return edit_store_get()[`${deckId}-${cardIndex}-cardTitle`];
        }
        // __card_title_save
        function card_title_save(deckId, cardIndex, text) {
          const key = `${deckId}-${cardIndex}-cardTitle`;
          const edits = edit_store_get();
          edits[key] = text;
          try {
            localStorage.setItem(CARD_EDITS_KEY, JSON.stringify(edits));
          } catch (e) {
            console.warn("Could not save card title to localStorage", e);
          }
        }
        // __deck_title_edit_get __chat_150 __deck_title_edit
        var DECK_TITLE_KEY = "pops-deck-titles";
        function deck_title_edit_get(deckId) {
          try {
            var stored = JSON.parse(localStorage.getItem(DECK_TITLE_KEY)) || {};
            return stored[deckId] != null ? stored[deckId] : null;
          } catch (e) { return null; }
        }
        // __deck_title_edit_save __chat_150 __deck_title_edit
        function deck_title_edit_save(deckId, text) {
          var stored = {};
          try { stored = JSON.parse(localStorage.getItem(DECK_TITLE_KEY)) || {}; } catch (e) {}
          stored[deckId] = text;
          try { localStorage.setItem(DECK_TITLE_KEY, JSON.stringify(stored)); } catch (e) {}
        }
        // __title_display_get
        /** Single source of truth for card title (used for both title and tab). Same pattern as item_text_get: prefer stored value. */
        function title_display_get(deckId, cardIndex) {
          const stored = card_title_get(deckId, cardIndex);
          if (stored != null) return stored;
          const deckData = decksData && decksData.find((d) => d.id === deckId);
          const card = deckData && deckData.cards && deckData.cards[cardIndex];
          return (card && card.title) != null ? card.title : "";
        }
        // __tab_label_shorten
        /** Shorten title for tab: first few words so tab doesn't overflow. */
        function tab_label_shorten(fullTitle) {
          if (!fullTitle || typeof fullTitle !== "string") return "";
          const plain = fullTitle.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
          const words = plain ? plain.split(" ") : [];
          const maxWords = 3;
          if (words.length <= maxWords) return plain;
          return words.slice(0, maxWords).join(" ") + "…";
        }
        // __tab_sync
        /** Update all tab elements matching deckId/cardIndex with shortened title. */
        function tab_sync(deckId, cardIndex, text) {
          var short = tab_label_shorten(text) || text || "";
          document.querySelectorAll('.tab-label[data-deck-id="' + deckId + '"][data-card-index="' + cardIndex + '"]').forEach(function (tab) {
            tab.textContent = short;
          });
        }
        // __edit_state_save
        /** Save active edit state for reload restore. opts: { type, deckId, cardIndex, selectionStart, selectionEnd, itemIndex? }. type: "item"|"tab"|"cardTitle"; itemIndex only for type "item". */
        function edit_state_save(opts) {
          const type = opts.type;
          const deckId = opts.deckId;
          const cardIndex = opts.cardIndex;
          const selectionStart = opts.selectionStart;
          const selectionEnd = opts.selectionEnd;
          const itemIndex = opts.itemIndex;
          try {
            const payload = { type, deckId, cardIndex, selectionStart, selectionEnd };
            if (type === "item" && itemIndex != null) payload.itemIndex = itemIndex;
            localStorage.setItem(ACTIVE_EDIT_KEY, JSON.stringify(payload));
          } catch (_) {}
        }
        // __edit_state_clear
        function edit_state_clear() {
          localStorage.removeItem(ACTIVE_EDIT_KEY);
        }

        // __item_storage_shift
        function item_storage_shift(deckId, cardIndex, fromIndex) {
          const edits = edit_store_get();
          const prefix = deckId + "-" + cardIndex + "-";
          /* Collect numeric item keys that need shifting */
          const toShift = [];
          Object.keys(edits).forEach(function (k) {
            if (!k.startsWith(prefix)) return;
            var suffix = k.slice(prefix.length);
            var n = parseInt(suffix, 10);
            if (String(n) === suffix && n >= fromIndex) toShift.push(n);
          });
          /* Sort descending so highest index moves first (avoids overwrites) */
          toShift.sort(function (a, b) { return b - a; });
          toShift.forEach(function (n) {
            var oldKey = prefix + n;
            var newKey = prefix + (n + 1);
            edits[newKey] = edits[oldKey];
            delete edits[oldKey];
          });
          localStorage.setItem(CARD_EDITS_KEY, JSON.stringify(edits));
        }

        // __item_storage_shift_down
        function item_storage_shift_down(deckId, cardIndex, fromIndex) {
          const edits = edit_store_get();
          const prefix = deckId + "-" + cardIndex + "-";
          const toShift = [];
          Object.keys(edits).forEach(function (k) {
            if (!k.startsWith(prefix)) return;
            var suffix = k.slice(prefix.length);
            var n = parseInt(suffix, 10);
            if (String(n) === suffix && n > fromIndex) toShift.push(n);
          });
          toShift.sort(function (a, b) { return a - b; });
          toShift.forEach(function (n) {
            var oldKey = prefix + n;
            var newKey = prefix + (n - 1);
            edits[newKey] = edits[oldKey];
            delete edits[oldKey];
          });
          delete edits[prefix + fromIndex];
          try { localStorage.setItem(CARD_EDITS_KEY, JSON.stringify(edits)); } catch (_) {}
        }

        // __item_insert
        function item_insert(deckId, cardIndex, insertAtItemIndex) {
          var deckData = decksData.find(function (d) { return d.id === deckId; });
          if (!deckData || !deckData.cards || !deckData.cards[cardIndex]) return;
          var items = deckData.cards[cardIndex].items;
          if (!items) {
            items = [];
            deckData.cards[cardIndex].items = items;
          }
          /* Clamp insert index */
          var idx = Math.max(0, Math.min(insertAtItemIndex, items.length));
          /* Shift storage keys before modifying the array */
          item_storage_shift(deckId, cardIndex, idx);
          /* Insert empty item into data model */
          items.splice(idx, 0, { text: "" });
          /* Persist structural change + new empty item */
          item_store_save(deckId, cardIndex, items);
          /* Rebuild DOM */
          item_text_rebuild(deckId, cardIndex);
          return idx;
        }

        // __item_delete
        function item_delete(deckId, cardIndex, itemIndex) {
          var deckData = decksData.find(function (d) { return d.id === deckId; });
          if (!deckData || !deckData.cards || !deckData.cards[cardIndex]) return null;
          var items = deckData.cards[cardIndex].items;
          if (!items || itemIndex < 0 || itemIndex >= items.length) return null;
          item_storage_shift_down(deckId, cardIndex, itemIndex);
          items.splice(itemIndex, 1);
          item_store_save(deckId, cardIndex, items);
          item_text_rebuild(deckId, cardIndex);
          var focusIdx = itemIndex < items.length ? itemIndex : Math.max(0, items.length - 1);
          return focusIdx;
        }

        // __item_level_get
        function item_level_get(item) {
          if (!item) return 0;
          var cls = item.classes || [];
          if (cls.indexOf("level-4") >= 0) return 3;
          if (cls.indexOf("level-3") >= 0) return 2;
          if (cls.indexOf("level-2") >= 0) return 1;
          return 0;
        }

        // __item_level_set
        function item_level_set(item, level) {
          if (!item.classes) item.classes = [];
          item.classes = item.classes.filter(function (c) {
            return c !== "level-2" && c !== "level-3" && c !== "level-4";
          });
          if (level === 1) item.classes.push("level-2");
          else if (level === 2) item.classes.push("level-3");
          else if (level === 3) item.classes.push("level-4");
        }

        // __item_indent
        function item_indent(deckId, cardIndex, itemIndex, direction) {
          var deckData = decksData.find(function (d) { return d.id === deckId; });
          if (!deckData || !deckData.cards || !deckData.cards[cardIndex]) return false;
          var items = deckData.cards[cardIndex].items;
          if (!items || !items[itemIndex]) return false;
          var currentLevel = item_level_get(items[itemIndex]);
          var newLevel = currentLevel + direction;
          if (newLevel < 0 || newLevel > 3) return false;
          /* Collect children: items below at deeper level */
          var children = [];
          for (var i = itemIndex + 1; i < items.length; i++) {
            var cls = items[i].classes || [];
            if (cls.indexOf("line-break") >= 0) continue;
            var childLevel = item_level_get(items[i]);
            if (childLevel > currentLevel) {
              children.push(i);
            } else {
              break;
            }
          }
          /* Apply level change */
          item_level_set(items[itemIndex], newLevel);
          children.forEach(function (ci) {
            var childLevel = item_level_get(items[ci]);
            var newChildLevel = childLevel + direction;
            if (newChildLevel >= 0 && newChildLevel <= 3) {
              item_level_set(items[ci], newChildLevel);
            }
          });
          /* Persist and rebuild */
          item_store_save(deckId, cardIndex, items);
          item_text_rebuild(deckId, cardIndex);
          return true;
        }

        // __item_move
        function item_move(deckId, cardIndex, itemIndex, direction) {
          return item_move_swap(deckId, cardIndex, itemIndex, direction);
        }
        function item_move_left(deckId, cardIndex, itemIndex) {
          return item_move_swap(deckId, cardIndex, itemIndex, -1);
        }
        function item_move_right(deckId, cardIndex, itemIndex) {
          return item_move_swap(deckId, cardIndex, itemIndex, 1);
        }
        function item_move_up(deckId, cardIndex, itemIndex) {
          return item_move_left(deckId, cardIndex, itemIndex);
        }
        function item_move_down(deckId, cardIndex, itemIndex) {
          return item_move_right(deckId, cardIndex, itemIndex);
        }
        function item_move_swap(deckId, cardIndex, itemIndex, direction) {
          var deckData = decksData.find(function (d) { return d.id === deckId; });
          if (!deckData || !deckData.cards || !deckData.cards[cardIndex]) return null;
          var items = deckData.cards[cardIndex].items;
          if (!items || !items[itemIndex]) return null;
          var currentLevel = item_level_get(items[itemIndex]);
          var childCount = 0;
          for (var i = itemIndex + 1; i < items.length; i++) {
            var cls = items[i].classes || [];
            if (cls.indexOf("line-break") >= 0) continue;
            if (item_level_get(items[i]) > currentLevel) childCount++; else break;
          }
          var ourStart = itemIndex;
          var ourEnd = itemIndex + childCount;
          var ourLen = childCount + 1;
          var otherIdx = direction < 0 ? itemIndex - 1 : ourEnd + 1;
          if (otherIdx < 0 || otherIdx >= items.length) return null;
          var otherLevel = item_level_get(items[otherIdx]);
          var otherStart = otherIdx;
          var otherEnd = otherIdx;
          if (direction < 0) {
            /* Moving up: swap past the single item above.
               No upward scan — children live below their parent,
               not above, so otherStart = otherEnd = otherIdx. */
          } else {
            for (var k = otherIdx + 1; k < items.length; k++) {
              var c2 = items[k].classes || [];
              if (c2.indexOf("line-break") >= 0) continue;
              if (item_level_get(items[k]) <= otherLevel) break;
              otherEnd = k;
            }
          }
          var otherLen = otherEnd - otherStart + 1;
          var ourBlock = items.slice(ourStart, ourEnd + 1);
          var otherBlock = items.slice(otherStart, otherEnd + 1);
          var before = items.slice(0, Math.min(ourStart, otherStart));
          var after = items.slice(Math.max(ourEnd, otherEnd) + 1);
          var newItems;
          if (direction < 0) {
            newItems = before.concat(ourBlock).concat(otherBlock).concat(after);
          } else {
            newItems = before.concat(otherBlock).concat(ourBlock).concat(after);
          }
          deckData.cards[cardIndex].items = newItems;
          var edits = edit_store_get();
          var prefix = deckId + "-" + cardIndex + "-";
          var oldToNew = {};
          var i, o;
          for (i = 0; i < before.length; i++) oldToNew[i] = i;
          if (direction < 0) {
            for (o = ourStart; o <= ourEnd; o++) oldToNew[o] = otherStart + (o - ourStart);
            for (o = otherStart; o <= otherEnd; o++) oldToNew[o] = otherStart + ourLen + (o - otherStart);
          } else {
            for (o = otherStart; o <= otherEnd; o++) oldToNew[o] = ourStart + (o - otherStart);
            for (o = ourStart; o <= ourEnd; o++) oldToNew[o] = ourStart + otherLen + (o - ourStart);
          }
          for (i = Math.max(ourEnd, otherEnd) + 1; i < items.length; i++) oldToNew[i] = i;
          var newEdits = {};
          Object.keys(edits).forEach(function (k) {
            if (!k.startsWith(prefix)) { newEdits[k] = edits[k]; return; }
            var suffix = k.slice(prefix.length);
            var n = parseInt(suffix, 10);
            if (String(n) !== suffix) { newEdits[k] = edits[k]; return; }
            if (oldToNew[n] != null) {
              newEdits[prefix + oldToNew[n]] = edits[k];
            }
          });
          try { localStorage.setItem(CARD_EDITS_KEY, JSON.stringify(newEdits)); } catch (_) {}
          item_store_save(deckId, cardIndex, newItems);
          item_text_rebuild(deckId, cardIndex);
          var newIdx = direction < 0 ? otherStart : ourStart + otherLen;
          return newIdx;
        }

        // __item_text_rebuild
        function item_text_rebuild(deckId, cardIndex) {
          var title = document.querySelector(
            '.card-text-title[data-deck-id="' + deckId + '"][data-card-index="' + cardIndex + '"]'
          );
          if (!title) return;
          var cardText = title.closest(".card-text");
          if (!cardText) return;
          var oldList = cardText.querySelector(".card-text-list");
          if (!oldList) return;
          var deckData = decksData.find(function (d) { return d.id === deckId; });
          if (!deckData || !deckData.cards || !deckData.cards[cardIndex]) return;
          var newList = item_list_build(deckData.cards[cardIndex].items || [], deckId, cardIndex);
          cardText.replaceChild(newList, oldList);
          /* Re-apply line numbers on the card layer host */
          var host = cardText.closest(".card-layer") || cardText.closest(".card-rect");
          if (host) card_outline_apply(host);
          item_edit_setup();
          item_insert_setup();
        }

        // __edit_state_save_current
        /** Save current selection/cursor when still editing (e.g. before reload without blur). */
        function edit_state_save_current() {
          const el = document.activeElement;
          if (!el || el.contentEditable !== "true") return;
          const { start, end } = edit_selection_get(el);

          if (el.classList && el.classList.contains("card-text-item-text")) {
            const item = el.closest(".card-text-item");
            if (!item || !item.dataset.deckId) return;
            const deckId = item.dataset.deckId;
            const cardIndex = parseInt(item.dataset.cardIndex, 10);
            const itemIndex = parseInt(item.dataset.itemIndex, 10);
            edit_state_save({ type: "item", deckId, cardIndex, selectionStart: start, selectionEnd: end, itemIndex });
            return;
          }
          if (el.classList && el.classList.contains("card-title-editable") && el.dataset.deckId) {
            edit_state_save({ type: "cardTitle", deckId: el.dataset.deckId, cardIndex: parseInt(el.dataset.cardIndex, 10), selectionStart: start, selectionEnd: end });
            return;
          }
        }

        // __export_data_get
        /** Build deck data with all localStorage edits applied, for export as index.txt. */
        function export_data_get() {
          if (!decksData || decksData.length < 1) return null;
          const edits = edit_store_get();
          function card_edit_apply(deckId, cards) {
            const out = JSON.parse(JSON.stringify(cards));
            out.forEach((card, cardIndex) => {
              const titleKey = `${deckId}-${cardIndex}-cardTitle`;
              if (edits[titleKey] != null) card.title = edits[titleKey];
              card.tabLabel = tab_label_shorten(card.title) || card.title || "";
              (card.items || []).forEach((item, itemIndex) => {
                const key = `${deckId}-${cardIndex}-${itemIndex}`;
                if (edits[key] != null) {
                  item.text = edits[key];
                }
              });
            });
            return out;
          }
          return {
            decks: decksData.map((d) => ({
              id: d.id,
              title: d.title,
              miniTitle: d.miniTitle,
              cards: card_edit_apply(d.id, d.cards),
            })),
          };
        }

        // __export_file_save
        function export_file_save() {
          const data = export_data_get();
          if (!data) return;
          const json = JSON.stringify(data, null, 2);
          const blob = new Blob([json], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "index.txt";
          a.click();
          URL.revokeObjectURL(a.href);
        }

        // __export_text_save __chat_168 __deck_text_download
        function export_text_save() {
          var data = export_data_get();
          if (!data || !data.decks) return;
          var lines = [];
          data.decks.forEach(function (deck) {
            lines.push(deck.title || deck.id);
            lines.push("");
            (deck.cards || []).forEach(function (card) {
              lines.push("    " + (card.title || "Untitled"));
              lines.push("");
              (card.items || []).forEach(function (item) {
                var cls = item.classes || [];
                if (cls.indexOf("line-break") >= 0) {
                  lines.push("");
                  return;
                }
                var level = 0;
                if (cls.indexOf("level-4") >= 0) level = 3;
                else if (cls.indexOf("level-3") >= 0) level = 2;
                else if (cls.indexOf("level-2") >= 0) level = 1;
                var indent = "        ";
                for (var i = 0; i < level; i++) indent += "    ";
                var text = item.text || "";
                if (cls.indexOf("section") >= 0) text = "[" + text + "]";
                lines.push(indent + text);
              });
              lines.push("");
            });
            lines.push("");
          });
          var txt = lines.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
          var blob = new Blob([txt], { type: "text/plain" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "decks.txt";
          a.click();
          URL.revokeObjectURL(a.href);
        }

        function item_list_build(items, deckId, cardIndex) {
          // __item_list_build
          const list = el_create("div", "card-text-list");
          items.forEach((item, itemIndex) => {
            const entry = document.createElement("div");
            entry.className = "card-text-item";
            if (item.classes && item.classes.length) {
              entry.classList.add(...item.classes);
            }
            entry.dataset.deckId = deckId;
            entry.dataset.cardIndex = String(cardIndex);
            entry.dataset.itemIndex = String(itemIndex);
            const textSpan = document.createElement("span");
            textSpan.className = "card-text-item-text";
            const savedText = item_text_get(deckId, cardIndex, itemIndex);
            textSpan.textContent = savedText != null ? savedText : (item.text != null ? item.text : item.html != null ? item.html : "");
            entry.appendChild(textSpan);
            list.appendChild(entry);
          });
          return list;
        }

        function card_layer_build(layerConfig, cardData, deckId, cardIndex) {
          // __card_layer_build
          const layer = el_create("div", "card-layer");
          layer.dataset.color = layerConfig.color;
          layer.setAttribute("style", layerConfig.style);

          const tab = el_create("div", `tab card-${layerConfig.color}-tab tab-label`);
          tab.dataset.deckId = deckId;
          tab.dataset.cardIndex = String(cardIndex);
          const titleContent = title_display_get(deckId, cardIndex);
          const tabContent = tab_label_shorten(titleContent) || titleContent || "";
          tab.textContent = tabContent;

          const card = el_create("div", `card card-${layerConfig.color}-primary`);
          if (titleContent) card.dataset.cardTitle = titleContent;
          const lines = el_create("div", "card-lines");
          lines.setAttribute("aria-hidden", "true");
          card_line_build(lines);

          const text = el_create("div", "card-text");
          const title = el_create("div", "card-text-title card-title-editable", titleContent);
          title.dataset.deckId = deckId;
          title.dataset.cardIndex = String(cardIndex);
          const list = item_list_build(cardData.items || [], deckId, cardIndex);

          text.appendChild(title);
          if (cardData.image) {
            const img = el_create("img", "card-text-image");
            img.src = cardData.image;
            img.alt = cardData.imageAlt || "";
            if (cardData.imageClass) {
              cardData.imageClass.split(/\s+/).forEach((cls) => {
                if (cls) {
                  img.classList.add(cls);
                }
              });
            }
            text.classList.add("has-image");
            text.appendChild(img);
          }
          text.appendChild(list);
          card.appendChild(lines);
          card.appendChild(text);

          layer.appendChild(tab);
          layer.appendChild(card);
          return layer;
        }

        function lightbox_open(src, alt) {
          // __lightbox_open
          if (!imageLightbox || !imageLightboxImg) return;
          imageLightboxImg.src = src;
          imageLightboxImg.alt = alt || "";
          imageLightbox.classList.add("open");
          imageLightbox.setAttribute("aria-hidden", "false");
          localStorage.setItem(IMAGE_LIGHTBOX_KEY, JSON.stringify({ open: true, src, alt: alt || "" }));
        }

        function lightbox_close() {
          // __lightbox_close
          if (!imageLightbox || !imageLightboxImg) return;
          imageLightbox.classList.remove("open");
          imageLightbox.setAttribute("aria-hidden", "true");
          imageLightboxImg.src = "";
          imageLightboxImg.alt = "";
          localStorage.setItem(IMAGE_LIGHTBOX_KEY, JSON.stringify({ open: false }));
        }

        function deck_build(deckData, index) {
          // __deck_build
          const deck = el_create("div", "deck");
          if (deckData.isActive) {
            deck.classList.add("is-active");
          }
          deck.dataset.deck = deckData.id;
          deck.dataset.title = deckData.title || deckData.miniTitle || String(index + 1);

          const titleText = `${index + 1})${deckData.miniTitle ? " " + deckData.miniTitle : ""}`;
          const title = el_create("div", "deck-title", titleText);
          title.setAttribute("aria-hidden", "true");

          const viewport = el_create("div", "deck-viewport");
          const scaleWrap = el_create("div", "deck-scale");
          const stackWrap = el_create("div", "deck-stack-wrap");
          const section = el_create("section", "card-scene");
          section.setAttribute("aria-label", `${deckData.title} deck`);
          const stack = el_create("div", "card-stack");
          /* Cards live only in the overlay; stack kept empty for viewport dimensions */

          section.appendChild(stack);
          stackWrap.appendChild(section);
          scaleWrap.appendChild(stackWrap);
          viewport.appendChild(scaleWrap);
          deck.appendChild(title);
          deck.appendChild(viewport);
          return deck;
        }

        // __deck_active_get
        function deck_active_get() {
          return decks.find((deck) => deck.classList.contains("is-active")) || decks[0];
        }

        // __deck_title_text_get
        function deck_title_text_get(deck) {
          const el = deck && deck.querySelector(".deck-title");
          return el ? el.textContent : (deck ? deck.dataset.title : "");
        }

        // __deck_selection_key_get
        function deck_selection_key_get(deckName) {
          return `${SELECT_KEY}-${deckName}`;
        }

        /* Slots set top + z only. Horizontal position is fixed: yellow always leftmost (0px), then red, green. */
        /* Position by stack order: front=0px (lowest), middle=-8px, highest=-24px. */
        const slots = {
          front: { cardTop: "0px", layerZ: 90 },
          middle: { cardTop: "-8px", layerZ: 70 },
          highest: { cardTop: "-24px", layerZ: 50 },
        };
        const stackTopsByPosition = ["0px", "-8px", "-24px"];
        const tabOffsetY = -53;

        // __deck_layer_map_build
        function deck_layer_map_build(deck) {
          const layerMap = {};
          const overlay = document.getElementById("cardRectOverlay");
          if (!overlay) return layerMap;
          const deckIndex = decks.indexOf(deck);
          if (deckIndex < 0) return layerMap;
          overlay.querySelectorAll(".card-rect[data-deck-index=\"" + deckIndex + "\"]").forEach((rect) => {
            const layer = rect.querySelector(".card-layer");
            if (layer && layer.dataset.color) {
              layerMap[layer.dataset.color] = layer;
            }
          });
          return layerMap;
        }

        // __card_layer_apply
        function card_layer_apply(layer, slot) {
          if (!layer) return;
          layer.style.setProperty("--card-top", slot.cardTop);
          layer.style.setProperty("--layer-z", slot.layerZ);
          /* Do not set --card-left here: leftmost (yellow) must always stay at 0px */
        }

        function deck_tab_offset_update(layerMap, deck) {
          // __deck_tab_offset_update
          /* Card layers live in overlay; use design width 1200 (CARD_RECT_WIDTH) */
          const cardWidth = 1200;
          /* Tabs 28% each; margins 5% each side; gaps 2% between – room at edges */
          const tabFrac = 0.28;
          const marginFrac = 0.05;
          const gapFrac = 0.02;
          const tabWidth = Math.floor(cardWidth * tabFrac);
          const leftInset = Math.round(cardWidth * marginFrac);
          const gap = Math.round(cardWidth * gapFrac);
          const colors = ["yellow", "red", "green"];
          colors.forEach((color, index) => {
            const layer = layerMap[color];
            if (!layer) return;
            layer.style.setProperty("--tab-width", tabWidth + "px");
            const left = leftInset + index * (tabWidth + gap);
            layer.style.setProperty("--tab-offset-x", left + "px");
          });
        }

        // __deck_tab_offset_update_all
        function deck_tab_offset_update_all() {
          decks.forEach((deck) => {
            deck_tab_offset_update(deck_layer_map_build(deck), deck);
          });
        }

        function deck_order_set(order, deck) {
          // __deck_order_set
          const layerMap = deck_layer_map_build(deck);
          const layerZByPosition = [90, 70, 50];
          order.forEach((color, pos) => {
            const layer = layerMap[color];
            if (!layer) return;
            const cardTop = stackTopsByPosition[pos] || slots.front.cardTop;
            const slot = { cardTop: cardTop, layerZ: layerZByPosition[pos] };
            card_layer_apply(layer, slot);
          });
          Object.values(layerMap).forEach((layer) => layer.classList.remove("is-front"));
          if (layerMap[order[0]]) {
            layerMap[order[0]].classList.add("is-front");
          }
          const cardStack = deck.querySelector(".card-stack");
          if (cardStack) {
            const tops = order.map((color, pos) => {
              const top = stackTopsByPosition[pos] || slots.front.cardTop;
              return parseFloat(top) + tabOffsetY;
            });
            const minTop = Math.min(...tops);
            cardStack.style.setProperty("--stack-top-offset", `${-minTop}px`);
          }
          deck_tab_offset_update(layerMap, deck);
        }

        const toRoman = (n) => {
          if (n < 1 || n > 20) return String(n);
          const map = [[10, "x"], [9, "ix"], [5, "v"], [4, "iv"], [1, "i"]];
          let s = "";
          for (const [val, sym] of map) {
            while (n >= val) {
              s += sym;
              n -= val;
            }
          }
          return s;
        };

        // __card_outline_apply
        function card_outline_apply(root) {
          const maxLines = 12;
          if (!root) return;
          root.querySelectorAll(".card-text-list").forEach((list) => {
            const card = list.closest(".card");
            const cardTitle = (card && (card.dataset.cardTitle || card.querySelector(".card-text-title")?.textContent || "") || "").trim().toLowerCase();
            const isBasicInfo = cardTitle === "basic information" || (cardTitle && cardTitle.startsWith("basic info"));

            /* Remove any existing line-break elements */
            list.querySelectorAll(".card-text-item.line-break").forEach((lb) => lb.remove());

            const items = Array.from(list.querySelectorAll(".card-text-item"));
            /* Outline markers: L1 A) B) C), L2 1) 2) 3), L3 a) b) c), L4 1) 2) 3) */
            let topNum = 0;
            let level2Num = 0;
            let level3Num = 0;
            let level4Num = 0;
            items.forEach((item) => {
              item.querySelectorAll(".alpha-marker").forEach((node) => node.remove());
              item.querySelectorAll(".bullet-marker").forEach((node) => node.remove());
              if (!item.classList.contains("line-break")) {
                let label;
                if (item.classList.contains("level-4")) {
                  level4Num += 1;
                  label = level4Num + ")";
                } else if (item.classList.contains("level-3")) {
                  level3Num += 1;
                  level4Num = 0;
                  label = String.fromCharCode(96 + level3Num) + ")";
                } else if (item.classList.contains("level-2")) {
                  level2Num += 1;
                  level3Num = 0;
                  level4Num = 0;
                  label = level2Num + ")";
                } else {
                  /* Top level: section headers or items with no level class */
                  topNum += 1;
                  level2Num = 0;
                  level3Num = 0;
                  level4Num = 0;
                  label = String.fromCharCode(64 + topNum) + ")";
                }
                const bullet = document.createElement("span");
                bullet.className = "bullet-marker";
                bullet.textContent = label;
                item.prepend(bullet);
              }
            });

            /* Line numbers in fixed vertical slots (align with ruled lines); text rows variable height. */
            const numbersWrap = document.createElement("div");
            numbersWrap.className = "card-line-numbers";
            numbersWrap.setAttribute("aria-hidden", "true");
            for (let i = 0; i < maxLines; i += 1) {
              const slot = document.createElement("div");
              slot.className = "card-line-number-slot";
              slot.style.setProperty("--line-index", String(i));
              const numSpan = document.createElement("span");
              numSpan.className = "line-number";
              numSpan.textContent = String(i + 1);
              slot.appendChild(numSpan);
              numbersWrap.appendChild(slot);
            }

            const rowsWrap = document.createElement("div");
            rowsWrap.className = "card-text-rows-wrap";
            for (let i = 0; i < maxLines; i += 1) {
              const rowEl = document.createElement("div");
              rowEl.className = "card-text-row";
              const cell = document.createElement("div");
              cell.className = "card-text-cell";
              if (items[i]) {
                cell.appendChild(items[i]);
              }
              rowEl.appendChild(cell);
              rowsWrap.appendChild(rowEl);
            }

            list.innerHTML = "";
            list.classList.add("card-text-list-rows");
            list.appendChild(numbersWrap);
            list.appendChild(rowsWrap);
          });
        }

        // __card_outline_apply_all
        function card_outline_apply_all() {
          document.querySelectorAll(".deck").forEach((deck) => {
            card_outline_apply(deck);
          });
        }

        function item_edit_setup() {
          // __item_edit_setup
          /* dblclick on item (e.g. bullet A)/B) area) when text span is empty/collapsed */
          document.querySelectorAll(".card-text-item:not(.line-break)").forEach((item) => {
            if (item._itemDblBound) return;
            item._itemDblBound = true;
            item.addEventListener("mousedown", (e) => {
              if (document.body.classList.contains("project-view")) return;
              if (e.target.closest(".card-text-item-text")) return;
              var textSpan = item.querySelector(".card-text-item-text");
              if (!textSpan) return;
              var deckId = item.dataset.deckId;
              var cardIndex = parseInt(item.dataset.cardIndex, 10);
              var itemIndex = parseInt(item.dataset.itemIndex, 10);
              e.stopPropagation();
              e.preventDefault();
              textSpan.contentEditable = "true";
              item.classList.add("is-editing");
              textSpan.focus();
              edit_state_save({ type: "item", deckId: deckId, cardIndex: cardIndex, selectionStart: 0, selectionEnd: 0, itemIndex: itemIndex });
            });
          });
          document.querySelectorAll(".card-text-item:not(.line-break) .card-text-item-text").forEach((textSpan) => {
            if (textSpan._editBound) return;
            textSpan._editBound = true;
            const item = textSpan.closest(".card-text-item");
            const deckId = item.dataset.deckId;
            const cardIndex = parseInt(item.dataset.cardIndex, 10);
            const itemIndex = parseInt(item.dataset.itemIndex, 10);

            textSpan.addEventListener("mousedown", (e) => {
              if (document.body.classList.contains("project-view")) return;
              e.stopPropagation();
              textSpan.contentEditable = "true";
              if (item) item.classList.add("is-editing");
              /* Let the browser handle caret placement and
                 drag-to-select natively — no preventDefault,
                 no manual caretRangeFromPoint needed. */
            });

            function item_edit_commit(deckId, cardIndex, itemIndex, text) {
              const deckData = decksData.find((d) => d.id === deckId);
              if (deckData && deckData.cards && deckData.cards[cardIndex] && deckData.cards[cardIndex].items && deckData.cards[cardIndex].items[itemIndex]) {
                deckData.cards[cardIndex].items[itemIndex].text = text;
              }
              item_text_save(deckId, cardIndex, itemIndex, text);
            }

            textSpan.addEventListener("blur", () => {
              if (textSpan.contentEditable !== "true") return;
              /* Save current selection/cursor so we can re-select after reload */
              const sel = window.getSelection();
              if (sel.rangeCount && textSpan.contains(sel.anchorNode)) {
                try {
                  const range = sel.getRangeAt(0);
                  const len = textSpan.textContent.length;
                  const start = range.startContainer === textSpan || range.startContainer.parentNode === textSpan
                    ? range.startOffset
                    : len;
                  const end = range.endContainer === textSpan || range.endContainer.parentNode === textSpan
                    ? range.endOffset
                    : len;
                  edit_state_save({ type: "item", deckId, cardIndex, selectionStart: Math.min(start, len), selectionEnd: Math.min(end, len), itemIndex });
                } catch (_) {}
              } else {
                /* No selection in this span; save cursor at end so we can still restore this line */
                const len = textSpan.textContent.length;
                edit_state_save({ type: "item", deckId, cardIndex, selectionStart: len, selectionEnd: len, itemIndex });
              }
              textSpan.contentEditable = "false";
              if (item) item.classList.remove("is-editing");
              const newText = textSpan.textContent.replace(/\s+$/g, "").replace(/^\s+/, "");
              textSpan.textContent = newText;
              item_edit_commit(deckId, cardIndex, itemIndex, newText);
            });

            textSpan.addEventListener("keydown", (e) => {
              if (textSpan.contentEditable !== "true") return;
              if (e.key === "Escape") {
                e.preventDefault();
                textSpan.blur();
              }
              if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                var curText = textSpan.textContent;
                item_edit_commit(deckId, cardIndex, itemIndex, curText);
                var deckData = decksData.find(function (d) { return d.id === deckId; });
                var curLevel = 0;
                if (deckData && deckData.cards && deckData.cards[cardIndex] && deckData.cards[cardIndex].items) {
                  curLevel = item_level_get(deckData.cards[cardIndex].items[itemIndex]);
                }
                var newIdx = item_insert(deckId, cardIndex, itemIndex + 1);
                if (newIdx != null && deckData && deckData.cards[cardIndex] && deckData.cards[cardIndex].items[newIdx]) {
                  item_level_set(deckData.cards[cardIndex].items[newIdx], curLevel);
                  item_store_save(deckId, cardIndex, deckData.cards[cardIndex].items);
                  item_text_rebuild(deckId, cardIndex);
                }
                var newItem = document.querySelector(
                  '.card-text-item[data-deck-id="' + deckId + '"][data-card-index="' + cardIndex + '"][data-item-index="' + newIdx + '"]'
                );
                if (newItem) {
                  var newSpan = newItem.querySelector(".card-text-item-text");
                  if (newSpan) {
                    newSpan.contentEditable = "true";
                    newItem.classList.add("is-editing");
                    newSpan.focus();
                    edit_state_save({ type: "item", deckId: deckId, cardIndex: cardIndex, selectionStart: 0, selectionEnd: 0, itemIndex: newIdx });
                  }
                }
                return;
              }
              if ((e.key === "Backspace" || e.key === "Delete") && !textSpan.textContent.trim()) {
                e.preventDefault();
                var focusIdx = item_delete(deckId, cardIndex, itemIndex);
                if (focusIdx != null) {
                  var newItem = document.querySelector(
                    '.card-text-item[data-deck-id="' + deckId + '"][data-card-index="' + cardIndex + '"][data-item-index="' + focusIdx + '"]'
                  );
                  if (newItem) {
                    var newSpan = newItem.querySelector(".card-text-item-text");
                    if (newSpan) {
                      newSpan.contentEditable = "true";
                      newItem.classList.add("is-editing");
                      newSpan.focus();
                      edit_state_save({ type: "item", deckId: deckId, cardIndex: cardIndex, selectionStart: 0, selectionEnd: 0, itemIndex: focusIdx });
                    }
                  }
                }
                return;
              }
              if (e.shiftKey && e.ctrlKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
                e.preventDefault();
                var curText = textSpan.textContent;
                item_edit_commit(deckId, cardIndex, itemIndex, curText);
                var sel = window.getSelection();
                var cursorPos = curText.length;
                if (sel.rangeCount && textSpan.contains(sel.anchorNode)) {
                  try { cursorPos = sel.getRangeAt(0).startOffset; } catch (_) {}
                }
                var dir = e.key === "ArrowLeft" ? -1 : 1;
                if (!item_indent(deckId, cardIndex, itemIndex, dir)) return;
                var newItem = document.querySelector(
                  '.card-text-item[data-deck-id="' + deckId + '"][data-card-index="' + cardIndex + '"][data-item-index="' + itemIndex + '"]'
                );
                if (newItem) {
                  var newSpan = newItem.querySelector(".card-text-item-text");
                  if (newSpan) {
                    newSpan.contentEditable = "true";
                    newItem.classList.add("is-editing");
                    newSpan.focus();
                    var len = newSpan.textContent.length;
                    var pos = Math.min(cursorPos, len);
                    if (newSpan.firstChild) {
                      try {
                        var range = document.createRange();
                        range.setStart(newSpan.firstChild, pos);
                        range.setEnd(newSpan.firstChild, pos);
                        sel.removeAllRanges();
                        sel.addRange(range);
                      } catch (_) {}
                    }
                    edit_state_save({ type: "item", deckId: deckId, cardIndex: cardIndex, selectionStart: pos, selectionEnd: pos, itemIndex: itemIndex });
                  }
                }
                return;
              }
              if (e.shiftKey && e.ctrlKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
                e.preventDefault();
                var curText = textSpan.textContent;
                var selOffsets = edit_selection_get(textSpan);
                item_edit_commit(deckId, cardIndex, itemIndex, curText);
                /* Disarm blur handler before rebuild so it cannot
                   write the old text to the wrong (post-swap) index */
                textSpan.contentEditable = "false";
                var newIdx = e.key === "ArrowUp"
                  ? item_move_left(deckId, cardIndex, itemIndex)
                  : item_move_right(deckId, cardIndex, itemIndex);
                if (newIdx == null) return;
                var _dk = deckId, _ci = cardIndex, _ni = newIdx, _so = selOffsets;
                requestAnimationFrame(function () {
                  var newItem = document.querySelector(
                    '.card-text-item[data-deck-id="' + _dk + '"][data-card-index="' + _ci + '"][data-item-index="' + _ni + '"]'
                  );
                  if (!newItem) return;
                  var newSpan = newItem.querySelector(".card-text-item-text");
                  if (!newSpan) return;
                  newSpan.contentEditable = "true";
                  newItem.classList.add("is-editing");
                  newSpan.focus();
                  var textNode = newSpan.firstChild;
                  if (textNode && textNode.nodeType === 3) {
                    var tLen = textNode.textContent.length;
                    var s = Math.min(_so.start, tLen);
                    var eOff = Math.min(_so.end, tLen);
                    var sel = window.getSelection();
                    var range = document.createRange();
                    range.setStart(textNode, s);
                    range.setEnd(textNode, eOff);
                    sel.removeAllRanges();
                    sel.addRange(range);
                  }
                  edit_state_save({ type: "item", deckId: _dk, cardIndex: _ci, selectionStart: _so.start, selectionEnd: _so.end, itemIndex: _ni });
                });
                return;
              }
              if (e.key === "Tab") {
                e.preventDefault();
                /* Save text before rebuild destroys the span */
                var curText = textSpan.textContent;
                item_edit_commit(deckId, cardIndex, itemIndex, curText);
                var sel = window.getSelection();
                var cursorPos = curText.length;
                if (sel.rangeCount && textSpan.contains(sel.anchorNode)) {
                  try { cursorPos = sel.getRangeAt(0).startOffset; } catch (_) {}
                }
                var dir = e.shiftKey ? -1 : 1;
                if (!item_indent(deckId, cardIndex, itemIndex, dir)) return;
                /* Re-focus the rebuilt item */
                var newItem = document.querySelector(
                  '.card-text-item[data-deck-id="' + deckId + '"][data-card-index="' + cardIndex + '"][data-item-index="' + itemIndex + '"]'
                );
                if (newItem) {
                  var newSpan = newItem.querySelector(".card-text-item-text");
                  if (newSpan) {
                    newSpan.contentEditable = "true";
                    newItem.classList.add("is-editing");
                    newSpan.focus();
                    /* Restore cursor position */
                    var len = newSpan.textContent.length;
                    var pos = Math.min(cursorPos, len);
                    if (newSpan.firstChild) {
                      try {
                        var range = document.createRange();
                        range.setStart(newSpan.firstChild, pos);
                        range.setEnd(newSpan.firstChild, pos);
                        sel.removeAllRanges();
                        sel.addRange(range);
                      } catch (_) {}
                    }
                    edit_state_save({ type: "item", deckId: deckId, cardIndex: cardIndex, selectionStart: pos, selectionEnd: pos, itemIndex: itemIndex });
                  }
                }
              }
            });

            // __item_paste_split
            textSpan.addEventListener("paste", (e) => {
              if (textSpan.contentEditable !== "true") return;
              var clip = (e.clipboardData || window.clipboardData);
              if (!clip) return;
              var raw = clip.getData("text/plain") || "";
              if (!raw) return;
              /* Split into sentences: split on . ! ? followed by space or end,
                 keeping the punctuation with the sentence. */
              var sentences = raw.match(/[^.!?]*[.!?]+(?:\s+|$)|[^.!?]+$/g);
              if (!sentences) sentences = [raw];
              sentences = sentences.map(function (s) { return s.trim(); }).filter(Boolean);
              /* Single sentence: let default paste handle it */
              if (sentences.length <= 1) return;
              e.preventDefault();
              /* Commit any existing text in the current item */
              var existingText = textSpan.textContent.trim();
              /* Get current indent level */
              var deckData = decksData.find(function (d) { return d.id === deckId; });
              var curLevel = 0;
              if (deckData && deckData.cards && deckData.cards[cardIndex] && deckData.cards[cardIndex].items && deckData.cards[cardIndex].items[itemIndex]) {
                curLevel = item_level_get(deckData.cards[cardIndex].items[itemIndex]);
              }
              /* Place first sentence into current item (appended to existing text) */
              var firstText = existingText ? existingText + " " + sentences[0] : sentences[0];
              textSpan.textContent = firstText;
              item_edit_commit(deckId, cardIndex, itemIndex, firstText);
              /* Insert remaining sentences as new items */
              var lastIdx = itemIndex;
              for (var si = 1; si < sentences.length; si++) {
                var newIdx = item_insert(deckId, cardIndex, lastIdx + 1);
                if (newIdx == null) break;
                if (deckData && deckData.cards[cardIndex] && deckData.cards[cardIndex].items[newIdx]) {
                  deckData.cards[cardIndex].items[newIdx].text = sentences[si];
                  item_level_set(deckData.cards[cardIndex].items[newIdx], curLevel);
                }
                item_text_save(deckId, cardIndex, newIdx, sentences[si]);
                lastIdx = newIdx;
              }
              /* Save and rebuild */
              item_store_save(deckId, cardIndex, deckData.cards[cardIndex].items);
              item_text_rebuild(deckId, cardIndex);
              /* Focus the last inserted item */
              var focusItem = document.querySelector(
                '.card-text-item[data-deck-id="' + deckId + '"][data-card-index="' + cardIndex + '"][data-item-index="' + lastIdx + '"]'
              );
              if (focusItem) {
                var focusSpan = focusItem.querySelector(".card-text-item-text");
                if (focusSpan) {
                  focusSpan.contentEditable = "true";
                  focusItem.classList.add("is-editing");
                  focusSpan.focus();
                  var len = focusSpan.textContent.length;
                  edit_state_save({ type: "item", deckId: deckId, cardIndex: cardIndex, selectionStart: len, selectionEnd: len, itemIndex: lastIdx });
                }
              }
            });

            textSpan.addEventListener("input", () => {
              if (textSpan.contentEditable !== "true") return;
              const currentText = textSpan.textContent;
              item_edit_commit(deckId, cardIndex, itemIndex, currentText);
              const sel = window.getSelection();
              if (sel.rangeCount && textSpan.contains(sel.anchorNode)) {
                try {
                  const range = sel.getRangeAt(0);
                  const len = textSpan.textContent.length;
                  const start = range.startContainer === textSpan || range.startContainer.parentNode === textSpan
                    ? range.startOffset
                    : len;
                  const end = range.endContainer === textSpan || range.endContainer.parentNode === textSpan
                    ? range.endOffset
                    : len;
                  edit_state_save({ type: "item", deckId, cardIndex, selectionStart: Math.min(start, len), selectionEnd: Math.min(end, len), itemIndex });
                } catch (_) {}
              }
            });
          });

          try {
            const active = localStorage.getItem(ACTIVE_EDIT_KEY);
            if (active) {
              const parsed = JSON.parse(active);
              const type = parsed.type || "item";
              const deckId = parsed.deckId;
              const selectionStart = parsed.selectionStart;
              const selectionEnd = parsed.selectionEnd;

              function edit_selection_restore(el, s, e) {
                if (typeof s !== "number" || typeof e !== "number" || !el) return;
                if (!el.firstChild) el.appendChild(document.createTextNode(el.textContent || ""));
                try {
                  const len = el.textContent.length;
                  const start = Math.min(s, len);
                  const end = Math.min(e, len);
                  const sel = window.getSelection();
                  const range = document.createRange();
                  range.setStart(el.firstChild, start);
                  range.setEnd(el.firstChild, end);
                  sel.removeAllRanges();
                  sel.addRange(range);
                } catch (_) {}
              }

              var restored = false;
              if (type === "item") {
                const itemIndex = parsed.itemIndex;
                const cardIndex = parsed.cardIndex;
                const item = document.querySelector(
                  `.card-text-item[data-deck-id="${deckId}"][data-card-index="${cardIndex}"][data-item-index="${itemIndex}"]`
                );
                if (item) {
                  const textSpan = item.querySelector(".card-text-item-text");
                  if (textSpan) {
                    if (!textSpan.firstChild) textSpan.appendChild(document.createTextNode(textSpan.textContent || ""));
                    textSpan.contentEditable = "true";
                    item.classList.add("is-editing");
                    textSpan.focus();
                    edit_selection_restore(textSpan, selectionStart, selectionEnd);
                    restored = true;
                  }
                }
              } else if (type === "cardTitle") {
                const cardIndex = parsed.cardIndex;
                const title = document.querySelector(
                  `.card-text-title.card-title-editable[data-deck-id="${deckId}"][data-card-index="${cardIndex}"]`
                );
                if (title) {
                  if (!title.firstChild) title.appendChild(document.createTextNode(title.textContent || ""));
                  title.contentEditable = "true";
                  title.focus();
                  edit_selection_restore(title, selectionStart, selectionEnd);
                  restored = true;
                }
              }
              /* Do not clear — beforeunload/pagehide will
                 overwrite with fresh state on next reload.
                 Clearing here races with async selectionchange
                 and loses state on rapid back-to-back reloads. */
            }
          } catch (_) {}
        }

        // __item_insert_setup
        function item_insert_setup() {
          document.querySelectorAll(".card-text-row").forEach(function (row) {
            if (row._insertBound) return;
            var cell = row.querySelector(".card-text-cell");
            if (!cell) return;
            /* Only bind on empty cells or cells that contain only a line-break */
            var child = cell.firstElementChild;
            var isEmpty = !child || (child.classList.contains("line-break") && !child.nextElementSibling);
            if (!isEmpty) return;
            row._insertBound = true;
            row.addEventListener("dblclick", function (e) {
              if (document.body.classList.contains("project-view")) return;
              e.stopPropagation();
              e.preventDefault();
              /* Find deckId and cardIndex from sibling items or card title */
              var rowsWrap = row.closest(".card-text-rows-wrap");
              if (!rowsWrap) return;
              var deckId, cardIndex;
              /* Try sibling rows first */
              var siblingItem = rowsWrap.querySelector(".card-text-item[data-deck-id]");
              if (siblingItem) {
                deckId = siblingItem.dataset.deckId;
                cardIndex = parseInt(siblingItem.dataset.cardIndex, 10);
              } else {
                /* Fall back to card title */
                var cardText = rowsWrap.closest(".card-text");
                var titleEl = cardText && cardText.querySelector(".card-text-title[data-deck-id]");
                if (!titleEl) return;
                deckId = titleEl.dataset.deckId;
                cardIndex = parseInt(titleEl.dataset.cardIndex, 10);
              }
              /* Determine insert index by scanning backward through rows */
              var rows = Array.from(rowsWrap.querySelectorAll(".card-text-row"));
              var rowIdx = rows.indexOf(row);
              var insertIdx = 0;
              for (var r = rowIdx - 1; r >= 0; r--) {
                var rCell = rows[r].querySelector(".card-text-cell");
                var rItem = rCell && rCell.querySelector(".card-text-item[data-item-index]");
                if (rItem) {
                  insertIdx = parseInt(rItem.dataset.itemIndex, 10) + 1;
                  break;
                }
              }
              /* Insert the new item */
              var finalIdx = item_insert(deckId, cardIndex, insertIdx);
              if (finalIdx == null) return;
              /* Find and activate the new item for editing */
              var newItem = document.querySelector(
                '.card-text-item[data-deck-id="' + deckId + '"][data-card-index="' + cardIndex + '"][data-item-index="' + finalIdx + '"]'
              );
              if (newItem) {
                var textSpan = newItem.querySelector(".card-text-item-text");
                if (textSpan) {
                  textSpan.contentEditable = "true";
                  newItem.classList.add("is-editing");
                  textSpan.focus();
                  edit_state_save({ type: "item", deckId: deckId, cardIndex: cardIndex, selectionStart: 0, selectionEnd: 0, itemIndex: finalIdx });
                }
              }
            });
          });
        }

        // __edit_selection_get
        function edit_selection_get(el) {
          const len = el.textContent.length;
          let start = len, end = len;
          const sel = window.getSelection();
          if (sel.rangeCount && el.contains(sel.anchorNode)) {
            try {
              const range = sel.getRangeAt(0);
              start = range.startContainer === el || range.startContainer.parentNode === el ? range.startOffset : len;
              end = range.endContainer === el || range.endContainer.parentNode === el ? range.endOffset : len;
              start = Math.min(start, len);
              end = Math.min(end, len);
            } catch (_) {}
          }
          return { start, end };
        }

        // __tab_title_edit_setup
        function tab_title_edit_setup() {
          document.querySelectorAll(".card-text-title.card-title-editable").forEach((title) => {
            if (title._editBound) return;
            title._editBound = true;
            const deckId = title.dataset.deckId;
            const cardIndex = parseInt(title.dataset.cardIndex, 10);

            title.addEventListener("dblclick", (e) => {
              if (document.body.classList.contains("project-view")) return;
              e.stopPropagation();
              e.preventDefault();
              if (!title.firstChild) title.appendChild(document.createTextNode(title.textContent || ""));
              title.contentEditable = "true";
              title.focus();
              const { start, end } = edit_selection_get(title);
              edit_state_save({ type: "cardTitle", deckId, cardIndex, selectionStart: start, selectionEnd: end });
