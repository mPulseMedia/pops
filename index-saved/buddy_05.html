<html><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic DOM Example</title>
    <style>
        body {
            background-color: #ff0000; /* Changed background to red */
            color: white;
            font-family: Arial, sans-serif;
        }
        .chat-container {
            padding: 20px;
        }
        .chat-messages {
            border: 1px solid white; 
            height: 300px; 
            overflow-y: auto; 
            padding: 10px;
        }
        .chat-input-bar {
            margin-top: 10px;
        }
        .page-link-box {
            display: block; 
            color: white; 
            margin-top: 20px; 
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div id="content">This is a sample paragraph. Modify the DOM as needed.</div>
        </div>
        <div class="chat-input-bar">
            <input type="text" id="userInput" placeholder="Type something...">
            <button id="changeButton">Change DOM</button>
            <button id="saveButton">Save Page</button>
        </div>
    </div>
    <a href="../index.html" class="page-link-box">D</a>
    <script>
        document.getElementById('changeButton').addEventListener('click', function() {
            const userInput = document.getElementById('userInput').value;
            const contentDiv = document.getElementById('content');
            contentDiv.innerText = userInput; // Change the DOM to show user input
        });

        document.getElementById('saveButton').addEventListener('click', function() {
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'buddy1.html'; // Save it as buddy1.html
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>

</body></html>
