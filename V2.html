      }

      .content-span {
        display: block;
        min-width: 0;
      }

      details[open] > summary::before {
        content: "▾";
      }

      .node {
        margin-left: 28px;
        margin-top: 12px;
        color: #3c4043;
        white-space: pre-wrap;

      function parseMarkdown(text) {
        const lines = text.split("\n");
        const root = { level: 0, title: "Root", children: [], body: [] };
        const stack = [root];

        lines.forEach((line) => {
          const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
          if (headingMatch) {
            const level = headingMatch[1].length;
            const title = headingMatch[2].trim();
            const node = { level, title, children: [], body: [] };

            while (stack.length > 1 && stack[stack.length - 1].level >= level) {
              stack.pop();
            }

            stack[stack.length - 1].children.push(node);
            stack.push(node);
          } else if (line.trim() !== "") {
            stack[stack.length - 1].body.push(line);
          }
        });

        return root;
      }

      function labelFor(level, index) {
        if (level === 1) return `${index + 1}.`;
        if (level === 2) return `${String.fromCharCode(65 + index)}.`;
        if (level === 3) return `${index + 1}.`;
        return `${String.fromCharCode(97 + index)}.`;
      }

      function parseTimestamp(text) {
        const bracketMatch = text.match(/\[(\d{1,2}:\d{2}(?::\d{2})?)\]/);
        const leadingMatch = text.match(
          /^\s*(\d{1,2}:\d{2}(?::\d{2})?)\s+/
        );
        const match = bracketMatch || leadingMatch;
        if (!match) return null;
        const timestamp = match[1];
        const parts = timestamp.split(":").map((part) => Number(part));
        if (parts.some((part) => Number.isNaN(part))) return null;
        let seconds = 0;
        if (parts.length === 2) {
          seconds = parts[0] * 60 + parts[1];
        } else if (parts.length === 3) {
          seconds = parts[0] * 3600 + parts[1] * 60 + parts[2];
        }
        return { seconds, label: timestamp, raw: match[0] };
      }

      function buildTimestampLink(seconds, label) {
        const link = document.createElement("a");
        link.href = `${YOUTUBE_BASE_URL}&t=${seconds}s`;
        link.textContent = label;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.style.marginLeft = "8px";
        link.style.color = "#1a73e8";
        link.style.textDecoration = "none";
        return link;
      }

      function guessSpeaker(text) {
        const trimmed = text.trim().toLowerCase();
        if (trimmed.endsWith("?") || trimmed.startsWith("who ") || trimmed.startsWith("what ") || trimmed.startsWith("why ") || trimmed.startsWith("how ")) {
          return "Paul";
        }
        if (
          trimmed.startsWith("yeah") ||
          trimmed === "mm hmm" ||
          trimmed === "mm-hmm" ||
          trimmed.startsWith("i like it") ||
          trimmed.startsWith("okay")
        ) {
          return "Phyllis";
        }
        return "Ray";
      }

      function buildSpeakerLink(name, seconds) {
        const link = document.createElement("a");
        link.href = `${YOUTUBE_BASE_URL}&t=${seconds}s`;
        link.textContent = name;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.style.marginRight = "8px";
        link.style.color = "#1a73e8";
        link.style.fontWeight = "600";
        link.style.textDecoration = "none";
        return link;
      }

      const INDENT_PX = 40;

      function renderNode(node, container, path = []) {
        node.children.forEach((child, idx) => {
          const hasChildren = child.children.length > 0;
          const wrapper = hasChildren
            ? document.createElement("details")
            : document.createElement("div");
          if (hasChildren) {
            wrapper.open = true;
          }

          const label = labelFor(child.level, idx);
          const item = hasChildren
            ? document.createElement("summary")
            : document.createElement("div");
          item.className = hasChildren ? "" : "leaf";
          const content = document.createElement("span");
          content.className = "content-span";
          const text = document.createElement("span");
          const timeInfo = parseTimestamp(child.title || "");
          const cleanedTitle = timeInfo
            ? (child.title || "").replace(timeInfo.raw, "").trim()
            : child.title || "Untitled";
          const speaker = timeInfo ? guessSpeaker(cleanedTitle) : null;
          text.textContent = `${label} ${cleanedTitle || "Untitled"}`;
          content.appendChild(text);
          item.style.setProperty(
            "--indent",
            `${Math.max(child.level - 1, 0) * INDENT_PX}px`
          );

          if (timeInfo) {
            content.insertBefore(
              buildSpeakerLink(speaker || "Speaker", timeInfo.seconds),
              text
            );
            content.appendChild(buildTimestampLink(timeInfo.seconds, timeInfo.label));
          }

          item.appendChild(content);

          wrapper.appendChild(item);

          if (child.body.length) {
            const body = document.createElement("div");
            body.className = "node";
            body.textContent = child.body.join("\n");
            wrapper.appendChild(body);
          }

          renderNode(child, wrapper, [...path, idx]);
          container.appendChild(wrapper);
        });
      }

      function renderOutline(markdownText) {
        outline.innerHTML = "";
        const tree = parseMarkdown(markdownText);
        renderNode(tree, outline);
      }

      expandAllBtn.addEventListener("click", () => {
        outline.querySelectorAll("details").forEach((detail) => {
          detail.open = true;
        });
      });
      collapseAllBtn.addEventListener("click", () => {
        outline.querySelectorAll("details").forEach((detail) => {
          detail.open = false;
        });
      });

      renderOutline(DEFAULT_MARKDOWN);
    </script>
  </body>
</html>
