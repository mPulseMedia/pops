      const LIGHTBOX_STATE_KEY = "outline-lightbox-state";

      function labelFor(level, index) {
        const mod = level % 4;
        if (mod === 0) return `${index + 1}.`;
        if (mod === 1) return `${String.fromCharCode(65 + index)}.`;
        if (mod === 2) return `${index + 1}.`;
        return `${String.fromCharCode(97 + index)}.`;
      }
      function normalizeLabels(node, level = 0) {
        if (!node || !node.c) return;
        node.c.forEach((child, index) => {
          child.l = labelFor(level, index);
          normalizeLabels(child, level + 1);
        });
      }
      const data = {

      const YOUTUBE_BASE_URL = "https://www.youtube.com/watch?v=qcr3OE5EIn0";

      function openLightbox(src, alt) {
        lightboxImg.src = src;
        lightboxImg.alt = alt || "";
        lightbox.classList.add("open");
        localStorage.setItem(
          LIGHTBOX_STATE_KEY,
          JSON.stringify({ open: true, src, alt: alt || "" })
        );
      }

      function closeLightbox() {
        lightbox.classList.remove("open");
        lightboxImg.src = "";
        lightboxImg.alt = "";
        localStorage.setItem(LIGHTBOX_STATE_KEY, JSON.stringify({ open: false }));
      }

      function appendThumbnail(container, node, beforeNode) {
        if (!node.i) return;
        const thumb = document.createElement("img");
        thumb.className = "thumb";
        thumb.src = node.i;
        thumb.alt = node.t || "image";
        thumb.addEventListener("click", (event) => {
          event.stopPropagation();
          openLightbox(node.i, node.t);
        });
        if (beforeNode) {
          container.insertBefore(thumb, beforeNode);
        } else {
          container.appendChild(thumb);
        }
      }

      function updateConnectors() {
        outline.querySelectorAll("details").forEach((detail) => {
          const summary = detail.querySelector("summary");
          const marker = summary.querySelector(".marker");
          if (!marker) return;
          let next = detail.nextElementSibling;
          while (next && !next.matches("details, .leaf-row")) {
            next = next.nextElementSibling;
          }
          if (!next) {
            marker.style.setProperty("--connector-length", "0px");
            return;
          }
          const nextMarker = next.querySelector(".marker");
          if (!nextMarker) {
            marker.style.setProperty("--connector-length", "0px");
            return;
          }
          const rect1 = marker.getBoundingClientRect();
          const rect2 = nextMarker.getBoundingClientRect();
          const center1 = rect1.top + rect1.height / 2;
          const center2 = rect2.top + rect2.height / 2;
          const length = Math.max(0, center2 - center1 - 54);
          marker.style.setProperty("--connector-length", `${length}px`);
        });
      }

      const OPEN_STATE_KEY = "outline-open-state";

      function loadOpenState() {
        try {
          return JSON.parse(localStorage.getItem(OPEN_STATE_KEY)) || {};
        } catch {
          return {};
        }
      }

      function saveOpenState(state) {
        localStorage.setItem(OPEN_STATE_KEY, JSON.stringify(state));
      }

      function nodeKey(path) {
        return path.join(".");
      }

      function renderNode(node, level, container, idx = 0, path = []) {
        const nextPath = [...path, idx];
        if (node.hidden) {
          if (node.c && node.c.length) {
            node.c.forEach((child, childIdx) =>
              renderNode(child, level, container, childIdx, nextPath)
            );
          }
          return;
        }
        if (node.c && node.c.length) {
          const details = document.createElement("details");
          const state = loadOpenState();
          const key = nodeKey(nextPath);
          details.open = Boolean(state[key]);
          details.dataset.key = key;

          const summary = document.createElement("summary");
          summary.style.setProperty("--level", level);

          const twist = document.createElement("span");
          twist.className = "twist marker";
          twist.textContent = "▸";

          const text = document.createElement("span");
          text.className = "text";
          const label = document.createElement("span");
          label.className = "label";
          const labelText = node.l ?? labelFor(level, idx);
          label.textContent = `${labelText} `;
          const content = document.createElement(node.linkInline ? "a" : "span");
          content.className = node.linkInline ? "inline-link" : "content";
          if (node.linkInline) {
            content.href = node.link;
          }
          content.textContent = node.t;
          if (node.i && !node.linkInline) {
            content.classList.add("inline-link");
          }
          text.appendChild(content);
          appendThumbnail(text, node, content);

          const times =
            node.c && node.c.length
              ? []
              : Array.isArray(node.s)
                ? node.s
                : node.time != null
                  ? [node.time]
                  : [];
          const linkWrap = document.createElement("div");
          linkWrap.className = "time-links";
          times.forEach((t) => {
            const link = document.createElement("a");
            link.className = "time-link";
            const minutes = Math.floor(t / 60);
            const seconds = t % 60;
            link.href = `${YOUTUBE_BASE_URL}&t=${minutes}m${seconds}s`;
            link.target = "yt-player";
            link.rel = "noopener noreferrer";
            linkWrap.appendChild(link);
          });

          if (times.length) {
            text.appendChild(linkWrap);
          }

          if (details.open) {
            twist.textContent = "▾";
          }
          details.addEventListener("toggle", () => {
            twist.textContent = details.open ? "▾" : "▸";
            const current = loadOpenState();
            current[key] = details.open;
            saveOpenState(current);
            requestAnimationFrame(updateConnectors);
          });
          if (node.n) {
            summary.classList.add("new-item");
          }
          summary.dataset.label = labelText;
          summary.appendChild(twist);
          summary.appendChild(label);
          summary.appendChild(text);
          details.appendChild(summary);

          const children = document.createElement("div");
          children.className = "children";
          node.c.forEach((child, childIdx) =>
            renderNode(child, level + 1, children, childIdx, nextPath)
          );
          details.appendChild(children);

          container.appendChild(details);
          return;
        }

        const row = document.createElement("div");
        row.className = "leaf-row";
        row.style.setProperty("--level", level);

        const spacer = document.createElement("span");
        spacer.className = "marker spacer";

        const text = document.createElement("span");
        text.className = "text";
        const label = document.createElement("span");
        label.className = "label";
        const labelText = node.l ?? labelFor(level, idx);
        label.textContent = `${labelText} `;
        const content = document.createElement(node.linkInline ? "a" : "span");
        content.className = node.linkInline ? "inline-link" : "content";
        if (node.linkInline) {
          content.href = node.link;
        }
        content.textContent = node.t;
        if (node.i && !node.linkInline) {
          content.classList.add("inline-link");
        }
        text.appendChild(content);
        appendThumbnail(text, node, content);

        const times = Array.isArray(node.s)
          ? node.s
          : node.time != null
            ? [node.time]
            : [];
        const linkWrap = document.createElement("div");
        linkWrap.className = "time-links";
        times.forEach((t) => {
          const link = document.createElement("a");
          link.className = "time-link";
          const minutes = Math.floor(t / 60);
          const seconds = t % 60;
          link.href = `${YOUTUBE_BASE_URL}&t=${minutes}m${seconds}s`;
          link.target = "yt-player";
          link.rel = "noopener noreferrer";
          linkWrap.appendChild(link);
        });

        if (node.n) {
          row.classList.add("new-item");
        }
        row.dataset.label = labelText;
        row.appendChild(spacer);
        row.appendChild(label);
        if (times.length) {
          text.appendChild(linkWrap);
        }
        row.appendChild(text);
        container.appendChild(row);
      }

      function renderOutline() {
        outline.innerHTML = "";
        normalizeLabels(data, 0);
        renderNode(data, 0, outline, 0);
        requestAnimationFrame(updateConnectors);
      }

      function captureOpenStateFromDom() {
        const state = loadOpenState();
        outline.querySelectorAll("details").forEach((detail) => {
          const key = detail.dataset.key;
          if (!key) return;
          state[key] = detail.open;
        });
        saveOpenState(state);
      }

      document.addEventListener("click", (event) => {
        const link = event.target.closest(".time-link");
        if (!link) return;
        event.preventDefault();
        const player = window.open(link.href, "yt-player");
        if (player) {
          player.blur();
          window.focus();
        }
      });

      lightbox.addEventListener("click", () => {
        closeLightbox();
      });

      function restoreLightbox() {
        try {
          const state = JSON.parse(localStorage.getItem(LIGHTBOX_STATE_KEY));
          if (state && state.open && state.src) {
            openLightbox(state.src, state.alt);
          }
        } catch {
          // ignore invalid state
        }
      }

      expandAllBtn.addEventListener("click", () => {
        outline.querySelectorAll("details").forEach((detail) => {
          detail.open = true;
        });
      });
      collapseAllBtn.addEventListener("click", () => {
        outline.querySelectorAll("details").forEach((detail) => {
          detail.open = false;
        });
      });

      renderOutline();
      window.addEventListener("resize", () => requestAnimationFrame(updateConnectors));
      PopsShared.setupZoomPersistence({ key: "zoom-index" });
      PopsShared.setupAutoReload({
        intervalMs: 4000,
        scrollKey: "scroll-index",
        beforeReload: () => {
          captureOpenStateFromDom();
        },
      });
      restoreLightbox();
    </script>
